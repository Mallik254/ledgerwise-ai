/* ---------------------------------------------------------------
   Budgets, accounts and the planning workspace
   --------------------------------------------------------------- */

function budgetBarClass(spent, limit) {
  const pct = safePct(spent, limit);
  if (spent > limit) return 'over';
  if (pct > 85) return 'warn';
  return '';
}

function renderBudgets() {
  const month = ui.month;
  const budget = budgetTotals(month);
  const days = month === currentMonthKey()
    ? Math.max(1, daysLeftInMonth(month))
    : daysInMonth(month);
  const dailyCushion = budget.remaining / days;
  const hasBudgets = budget.rows.length > 0;
  const sourceMonth = addMonthsKey(month, -1);
  const sourceCount = state.budgets.filter((b) => b.month === sourceMonth && b.limitCents > 0).length;

  const groups = new Map();
  for (const row of budget.rows) {
    if (!groups.has(row.category.group)) groups.set(row.category.group, []);
    groups.get(row.category.group).push(row);
  }
  const groupKeys = [...groups.keys()].sort((a, b) => {
    return (GROUPS[a] ? GROUPS[a].order : 99) - (GROUPS[b] ? GROUPS[b].order : 99);
  });

  const groupHtml = groupKeys.map((key) => {
    const rows = groups.get(key);
    const limit = sum(rows.map((r) => r.limitCents));
    const spent = sum(rows.map((r) => r.spentCents));
    return `<section class="card budget-group">
      <div class="budget-group-head">
        <h3>${esc(groupLabel(key))}</h3>
        <span>${esc(money(spent, { whole: true }))} of ${esc(money(limit, { whole: true }))}</span>
      </div>
      ${rows.map((row) => {
        const pct = safePct(row.spentCents, row.limitCents);
        const barPct = clamp(pct, 0, 100);
        const barClass = budgetBarClass(row.spentCents, row.limitCents);
        return `<button type="button" class="budget-line-btn" data-act="edit-budget" data-id="${esc(row.category.id)}" aria-label="Edit ${esc(row.category.name)} budget">
          <div class="budget-line-top">
            <span class="cat-dot" style="background:${esc(row.category.color)}"></span>
            <span class="name">${esc(row.category.name)}</span>
            <span class="amounts"><strong>${esc(money(row.spentCents, { whole: true }))}</strong> / ${esc(money(row.limitCents, { whole: true }))} ${icon('edit', 11, 'edit-mark')}</span>
          </div>
          <div class="budget-line-bar">
            <div class="bar"><span class="${barClass}" style="width:${barPct.toFixed(1)}%"></span></div>
            <span class="pct ${row.spentCents > row.limitCents ? 'neg' : ''}">${percent(pct, 0)}</span>
          </div>
        </button>`;
      }).join('')}
    </section>`;
  }).join('');

  const unbudgeted = budget.unbudgeted.length ? `<section class="card unbudgeted-card">
    <div class="section-head">
      <div>
        <h3>Spending without a limit</h3>
        <p>These categories had activity but no budget this month.</p>
      </div>
      <span class="badge badge-neutral">${esc(money(budget.unbudgetedTotal, { whole: true }))}</span>
    </div>
    ${budget.unbudgeted.map((row) => `<div class="unbudgeted-list">
      <span style="display:inline-flex;align-items:center;gap:7px;min-width:0">
        <span class="cat-dot" style="background:${esc(row.category.color)}"></span>
        <span>${esc(row.category.name)}</span>
      </span>
      <span style="display:inline-flex;align-items:center;gap:12px">
        <span class="mono">${esc(money(row.spentCents, { whole: true }))}</span>
        <button type="button" class="link-btn" data-act="edit-budget" data-id="${esc(row.category.id)}">Set limit</button>
      </span>
    </div>`).join('')}
  </section>` : '';

  const emptyState = !hasBudgets ? `<div class="card budget-empty">
    <div class="empty">
      <div class="empty-icon">${icon('budget', 20)}</div>
      <h3>Give this month a shape</h3>
      <p>Set limits for the categories that matter. Spending will track against them automatically from your ledger.</p>
      <div class="button-row" style="justify-content:center">
        <button type="button" class="btn btn-primary" data-act="edit-budget">${icon('plus', 15)} Build a budget</button>
        ${sourceCount ? `<button type="button" class="btn btn-secondary" data-act="copy-budgets" data-from="${sourceMonth}">Use ${esc(monthLabel(sourceMonth, true))} plan</button>` : ''}
      </div>
    </div>
  </div>` : '';

  const hero = hasBudgets ? `<section class="card budget-hero" aria-label="Budget summary">
    <div class="stat budget-total">
      <span class="stat-label">Total plan</span>
      <span class="stat-value">${esc(money(budget.limit, { whole: true }))}</span>
      <div class="budget-progress"><span class="${budgetBarClass(budget.spent, budget.limit)}" style="width:${clamp(budget.pct, 0, 100).toFixed(1)}%"></span></div>
      <span class="stat-note">${budget.rows.length} budgeted ${plural(budget.rows.length, 'category', 'categories')}</span>
    </div>
    <div class="stat">
      <span class="stat-label">Spent</span>
      <span class="stat-value">${esc(money(budget.spent, { whole: true }))}</span>
      <span class="stat-note">${percent(budget.pct, 0)} of plan</span>
    </div>
    <div class="stat">
      <span class="stat-label">Remaining</span>
      <span class="stat-value ${budget.remaining < 0 ? 'neg' : ''}">${esc(money(budget.remaining, { whole: true }))}</span>
      <span class="stat-note">${budget.remaining < 0 ? 'Over the plan' : 'Still available'}</span>
    </div>
    <div class="stat">
      <span class="stat-label">Daily cushion</span>
      <span class="stat-value">${esc(money(Math.max(0, dailyCushion), { whole: true }))}</span>
      <span class="stat-note">${month === currentMonthKey() ? `${days} days left` : month < currentMonthKey() ? 'Month complete' : `${days} days in month`}</span>
    </div>
  </section>` : '';

  const note = `<div class="info-note" style="margin-top:16px">
    ${icon('info', 15)}
    <span>Limits reset each month and are counted from posted expense entries, including corrections. This build does not roll unspent money into the next month.</span>
  </div>`;

  return `
    <div class="top-gap"></div>
    ${pageHead({
      eyebrow: 'Monthly budgets',
      title: 'Plans, not guesses',
      subtitle: 'Decide what each category may use before the month spends it for you. Click any line to change its limit.',
      actions: `${monthSwitch()}
        <button class="btn btn-secondary" data-act="copy-budgets" data-from="${sourceMonth}">${icon('repeat', 15)} Copy last month</button>
        <button class="btn btn-primary" data-act="edit-budget">${icon('edit', 15)} Edit plan</button>`
    })}
    ${hero}
    ${emptyState}
    <div class="budget-groups">${groupHtml}</div>
    ${unbudgeted}
    ${note}
  `;
}

/* --------------------------------------------------------------- accounts */

function accountTypeOrder(type) {
  const order = ['cash', 'bank', 'mobile', 'savings', 'credit', 'overdraft', 'loan'];
  return order.indexOf(type) === -1 ? 99 : order.indexOf(type);
}

function renderAccounts() {
  const totals = accountTotals();
  const archived = state.accounts.filter((acc) => acc.archived);
  const shown = state.accounts
    .filter((acc) => ui.showArchivedAccounts || !acc.archived)
    .slice()
    .sort((a, b) => {
      const natureA = accountNature(a) === 'asset' ? 0 : 1;
      const natureB = accountNature(b) === 'asset' ? 0 : 1;
      return natureA - natureB || accountTypeOrder(a.type) - accountTypeOrder(b.type) || a.name.localeCompare(b.name);
    });

  const cards = shown.map((acc) => {
    const balance = accountBalance(acc.id);
    const liability = accountNature(acc) === 'liability';
    const last = accountLastActivity(acc.id);
    const label = liability
      ? (balance < 0 ? 'Credit balance' : 'Owed')
      : acc.type === 'savings' ? 'Set aside' : 'Available';
    return `<article class="card account-card ${liability ? 'is-liability' : ''} ${acc.archived ? 'is-archived' : ''}">
      <div class="account-top">
        <div class="account-identity">
          <span class="account-icon">${icon(ACCOUNT_TYPES[acc.type] ? ACCOUNT_TYPES[acc.type].icon : 'wallet', 18)}</span>
          <div style="min-width:0">
            <strong>${esc(acc.name)}</strong>
            <span>${esc(accountSubtitle(acc))}</span>
          </div>
        </div>
        ${acc.archived ? statusBadge('Archived', 'neutral') : (liability ? statusBadge(`${acc.apr || 0}% APR`, 'rose') : (acc.spendable ? '' : statusBadge('Reserve', 'sky')))}
      </div>
      <div class="account-balance ${accountBalanceClass(acc)}">${esc(money(balance, { whole: true }))}</div>
      <div class="account-balance-label">${esc(label)}</div>
      <div class="account-foot">
        <span class="tiny">${last ? `Last activity ${esc(dateLabel(last))}` : 'No activity yet'}</span>
        <div class="account-actions">
          ${acc.archived ? '' : `<button type="button" class="btn-icon btn-sm" data-act="add-tx" data-account="${esc(acc.id)}" aria-label="Add transaction to ${esc(acc.name)}" title="Add transaction">${icon('plus', 14)}</button>
          <button type="button" class="btn-icon btn-sm" data-act="reconcile-account" data-id="${esc(acc.id)}" aria-label="Reconcile ${esc(acc.name)}" title="Reconcile">${icon('check-circle', 14)}</button>
          <button type="button" class="btn-icon btn-sm" data-act="import-statement" data-id="${esc(acc.id)}" aria-label="Import a statement into ${esc(acc.name)}" title="Import statement">${icon('upload', 14)}</button>${liability ? '' : `
          <button type="button" class="btn-icon btn-sm" data-act="mpesa-messages" data-id="${esc(acc.id)}" aria-label="Download ${esc(acc.name)} as M-Pesa confirmation texts" title="Save as M-Pesa messages">${icon('download', 14)}</button>`}`}
          <button type="button" class="btn-icon btn-sm" data-act="edit-account" data-id="${esc(acc.id)}" aria-label="Edit ${esc(acc.name)}" title="Edit account">${icon('edit', 14)}</button>
        </div>
      </div>
    </article>`;
  }).join('');

  const empty = !state.accounts.length ? `<div class="card" style="margin-top:18px">
    <div class="empty" style="padding:48px 24px">
      <div class="empty-icon">${icon('wallet', 22)}</div>
      <h3>No accounts yet</h3>
      <p>Add M-Pesa, a bank account, cash or savings. Opening balances are posted as balanced equity entries, not typed totals.</p>
      <button type="button" class="btn btn-primary" data-act="add-account">${icon('plus', 15)} Add your first account</button>
    </div>
  </div>` : '';

  return `
    <div class="top-gap"></div>
    ${pageHead({
      eyebrow: 'Accounts',
      title: 'Where your money lives',
      subtitle: 'Every balance is calculated from posted journal entries. Reconcile against a statement when real life and the ledger disagree.',
      actions: `${archived.length ? `<button class="btn btn-ghost" data-act="toggle-archived">${ui.showArchivedAccounts ? 'Hide' : 'Show'} archived (${archived.length})</button>` : ''}
        <button class="btn btn-primary" data-act="add-account">${icon('plus', 16)} Add account</button>`
    })}

    <section class="card account-summary" aria-label="Account totals">
      <div class="stat">
        <span class="stat-label">Assets</span>
        <span class="stat-value">${esc(money(totals.assets, { whole: true }))}</span>
        <span class="stat-note">Cash, bank, mobile &amp; savings</span>
      </div>
      <div class="stat">
        <span class="stat-label">Liabilities</span>
        <span class="stat-value">${esc(money(totals.liabilities, { whole: true }))}</span>
        <span class="stat-note">Cards and loans owed</span>
      </div>
      <div class="stat">
        <span class="stat-label">Net worth</span>
        <span class="stat-value">${esc(money(totals.net, { whole: true }))}</span>
        <span class="stat-note">Assets minus liabilities</span>
      </div>
    </section>

    ${cards ? `<section class="accounts-grid" aria-label="Accounts">${cards}</section>` : empty}

    <div class="info-note" style="margin-top:16px">
      ${icon('info', 15)}
      <span>Archiving keeps an account’s full history and its effect on net worth. Add a <strong>credit card</strong> or <strong>loan</strong> account to unlock the payoff planner.</span>
    </div>
  `;
}

/* --------------------------------------------------------------- plan shell */

function planTabButton(tab, count) {

    <span>${esc(meta.label)}</span>

function renderPlan() {
  const tabs = `<div class="plan-tabs" role="tablist" aria-label="Planning tools">
    ${planTabButton('bills', activeRecurring().filter((rule) => rule.kind !== 'income').length)}
    ${planTabButton('goals', activeGoals().length)}
    ${planTabButton('debt', activeAccounts().filter((acc) => accountNature(acc) === 'liability' && accountBalance(acc.id) > 0).length)}
    ${planTabButton('forecast')}
  </div>`;

  const meta = {
    bills: {
      sub: 'Scheduled bills and income are templates. Nothing posts until you mark it paid or received.',

    },
    goals: {
      sub: 'Goals earmark money you already have. They do not move cash — they set it aside from safe-to-spend.',
      action: `<button class="btn btn-primary" data-act="add-goal">${icon('plus', 16)} Add goal</button>`
    },
    debt: {
      sub: 'See what you owe and model a payoff. The simulation is an estimate and does not post entries.',
      action: ''
    },
    forecast: {
      sub: 'A cash-only view of scheduled rules. It shows commitments you have already planned, not every future choice.',
      action: ''
    }
  };
  const current = meta[ui.planTab] || meta.bills;

  let body = '';
  if (ui.planTab === 'goals') body = renderPlanGoals();
  else if (ui.planTab === 'debt') body = renderPlanDebt();
  else if (ui.planTab === 'forecast') body = renderPlanForecast();
  else body = renderPlanBills();

  return `
    <div class="top-gap"></div>
    ${pageHead({
      eyebrow: 'Plan ahead',
      title: 'Look ahead with calm',
      subtitle: current.sub,
      actions: current.action
    })}
    ${tabs}
    ${body}
  `;
}

/* --------------------------------------------------------------- bills & income */

function ruleSubtitle(rule) {
  const account = accountById(rule.accountId);
  if (rule.kind === 'transfer') {
    const to = accountById(rule.toAccountId);
    return `${FREQUENCIES[rule.frequency].short} · ${account ? account.name : 'Account'} → ${to ? to.name : 'Account'}`;
  }
  const category = rule.categoryId ? categoryById(rule.categoryId) : null;
  return [FREQUENCIES[rule.frequency].short, category && category.name, account && account.name].filter(Boolean).join(' · ');
}

function ruleActionButtons(rule, paused) {
  if (paused) {
    return `<button type="button" class="btn btn-xs btn-quiet" data-act="rule-toggle" data-id="${esc(rule.id)}">Resume</button>
      <button type="button" class="btn btn-xs btn-ghost" data-act="edit-bill" data-id="${esc(rule.id)}">Edit</button>`;
  }
  const payLabel = rule.kind === 'income' ? 'Received' : rule.kind === 'transfer' ? 'Move now' : 'Mark paid';
  return `<button type="button" class="btn btn-xs btn-primary" data-act="rule-paid" data-id="${esc(rule.id)}">${esc(payLabel)}</button>
    <button type="button" class="btn btn-xs btn-ghost" data-act="rule-skip" data-id="${esc(rule.id)}" aria-label="Skip the next ${esc(rule.name)}">Skip</button>
    <button type="button" class="btn-icon btn-sm" data-act="edit-bill" data-id="${esc(rule.id)}" aria-label="Edit ${esc(rule.name)}" title="Edit">${icon('edit', 13)}</button>`;
}

function ruleRow(rule, paused) {
  const overdue = !paused && rule.nextDate < todayISO();
  const amountClass = rule.kind === 'income' ? 'pos' : '';
  const iconName = rule.kind === 'income' ? 'arrow-down-right' : rule.kind === 'transfer' ? 'arrow-right-left' : 'repeat';
  return `<div class="bill-row">
    <span class="row-icon ${overdue ? 'rose' : rule.kind === 'income' ? '' : 'brass'}">${icon(iconName, 15)}</span>
    <div class="bill-main">
      <strong>${esc(rule.name)}${paused ? ' <span class="bill-sub">Paused</span>' : ''}</strong>
      <span>${overdue ? `<span class="bill-overdue">${esc(dueLabel(rule.nextDate))}</span> · ` : `${esc(dueLabel(rule.nextDate))} · `}${esc(ruleSubtitle(rule))}</span>
    </div>
    <span class="bill-amount ${amountClass}">${esc(money(rule.amountCents))}</span>
    <div class="bill-actions">${ruleActionButtons(rule, paused)}</div>
  </div>`;
}

function renderPlanBills() {
  const active = activeRecurring();
  const bills = active.filter((rule) => rule.kind !== 'income').slice().sort((a, b) => a.nextDate.localeCompare(b.nextDate));
  const incomes = active.filter((rule) => rule.kind === 'income').slice().sort((a, b) => a.nextDate.localeCompare(b.nextDate));
  const paused = state.recurring.filter((rule) => !rule.active);
  const safe = safeToSpend();
  const monthlyLoad = recurringMonthlyLoad();
  const monthlyIncome = recurringMonthlyIncome();
  const overdue = bills.filter((rule) => rule.nextDate < todayISO());
  const overdueTotal = sum(overdue.map((rule) => rule.amountCents));

  const billsHtml = bills.length ? bills.map((rule) => ruleRow(rule, false)).join('') : `<div class="empty" style="padding:24px 4px">
    <div class="empty-icon">${icon('calendar', 19)}</div>
    <h3>No bills scheduled</h3>
    <p>Add rent, utilities, subscriptions or regular transfers to see them here.</p>
    <button type="button" class="btn btn-secondary btn-sm" data-act="add-bill">Add a bill</button>
  </div>`;

  const incomeHtml = incomes.length ? incomes.map((rule) => ruleRow(rule, false)).join('') : `<div class="empty" style="padding:22px 4px">
    <div class="empty-icon">${icon('trend-up', 19)}</div>
    <h3>No expected income</h3>
    <p>Add a retainer, salary or regular client payment.</p>
    <button type="button" class="btn btn-secondary btn-sm" data-act="add-bill" data-kind="income">Add expected income</button>
  </div>`;

  const pausedHtml = paused.length ? `<section class="card section-card" style="margin-top:16px">
    <div class="section-head">
      <div><h3>Paused rules</h3><p>Not counted in commitments or cash forecasts.</p></div>
      <span class="badge badge-neutral">${paused.length}</span>
    </div>
    ${paused.map((rule) => ruleRow(rule, true)).join('')}
  </section>` : '';

  return `
    <section class="card plan-summary" aria-label="Planning summary">
      <div class="stat">
        <span class="stat-label">Cash out · 14 days</span>
        <span class="stat-value">${esc(money(safe.bills, { whole: true }))}</span>
        <span class="stat-note">That leaves spendable cash</span>
      </div>
      <div class="stat">
        <span class="stat-label">Overdue</span>
        <span class="stat-value">${esc(money(overdueTotal, { whole: true }))}</span>
        <span class="stat-note">${overdue.length ? `${overdue.length} ${plural(overdue.length, 'rule')} past due` : 'Everything on time'}</span>
      </div>
      <div class="stat">
        <span class="stat-label">Monthly commitments</span>
        <span class="stat-value">${esc(money(monthlyLoad, { whole: true }))}</span>
        <span class="stat-note">Bills &amp; transfers leaving cash</span>
      </div>
      <div class="stat">
        <span class="stat-label">Expected income</span>
        <span class="stat-value">${esc(money(monthlyIncome, { whole: true }))}</span>
        <span class="stat-note">Monthly equivalent from rules</span>
      </div>
    </section>

    <div class="split-grid">
      <section class="card section-card">
        <div class="section-head">
          <div><h3>Bills &amp; commitments</h3><p>Mark paid posts a real entry dated today.</p></div>
          <button type="button" class="link-btn" data-act="add-bill">${icon('plus', 13)} Add</button>
        </div>
        <div class="bill-list">${billsHtml}</div>
      </section>

      <section class="card section-card income-card">
        <div class="section-head">
          <div><h3>Expected income</h3><p>Scheduled money, not yet received.</p></div>
          <button type="button" class="link-btn" data-act="add-bill" data-kind="income">${icon('plus', 13)} Add</button>
        </div>
        <div class="bill-list">${incomeHtml}</div>
        <div class="info-note" style="margin-top:14px">
          ${icon('info', 14)}
          <span>Only mark income <strong>Received</strong> when it has actually landed in an account. A forecast is not a balance.</span>
        </div>
      </section>
    </div>

    ${pausedHtml}

    <div class="info-note" style="margin-top:16px">
      ${icon('repeat', 15)}
      <span>Recurring rules never post by themselves. <strong>Mark paid</strong> or <strong>Received</strong> records today’s entry and moves the next date forward; <strong>Skip</strong> only moves the date. Correct a posted entry from the ledger.</span>
    </div>
  `;
}

/* --------------------------------------------------------------- goals */

function monthsFromToday(iso) {
  const today = parseDate(todayISO());
  const target = parseDate(iso);
  return Math.ceil((target - today) / (86400000 * 30.44));
}

function goalNeed(goal) {
  const saved = Math.max(0, goalSaved(goal));
  const remaining = Math.max(0, goal.targetCents - saved);
  if (!remaining) return { funded: true, amount: 0, late: false };
  if (!goal.targetDate) return { funded: false, amount: 0, late: false, noDate: true };
  const months = monthsFromToday(goal.targetDate);
  if (months <= 0) return { funded: false, amount: remaining, late: true };
  return { funded: false, amount: Math.ceil(remaining / months), late: false, months };
}

function goalHistory(goal, limit) {
  return goal.contributions.slice()
    .sort((a, b) => b.date.localeCompare(a.date))
    .slice(0, limit);
}

function renderPlanGoals() {
  const goals = activeGoals();
  const saved = sum(goals.map((goal) => Math.max(0, goalSaved(goal))));
  const target = sum(goals.map((goal) => goal.targetCents));
  const pct = safePct(saved, target);

  const cards = goals.map((goal) => {
    const goalSavedCents = Math.max(0, goalSaved(goal));
    const pctSaved = safePct(goalSavedCents, goal.targetCents);
    const funded = goal.targetCents > 0 && goalSavedCents >= goal.targetCents;
    const barPct = clamp(pctSaved, 0, 100);
    const need = goalNeed(goal);
    const history = goalHistory(goal, 2);
    return `<article class="card goal-card">
      <div class="goal-top">
        <div>
          <div class="goal-name">${esc(goal.name)}</div>
          <div class="goal-target">Target ${esc(money(goal.targetCents, { whole: true }))}${goal.targetDate ? ` · by ${esc(dateInputLabel(goal.targetDate))}` : ''}</div>
        </div>
        <span class="badge ${funded ? 'badge-mint' : 'badge-brass'}">${funded ? 'Funded' : `${percent(pctSaved, 0)}`}</span>
      </div>
      ${goal.note ? `<p class="hint" style="margin-top:8px">${esc(goal.note)}</p>` : ''}
      <div class="goal-progress"><span class="${funded ? 'done' : ''}" style="width:${barPct.toFixed(1)}%"></span></div>
      <div class="goal-figures">
        <strong>${esc(money(goalSavedCents, { whole: true }))}</strong>
        <span>of ${esc(money(goal.targetCents, { whole: true }))}</span>
      </div>
      <div class="goal-meta">
        ${icon('calendar', 12)}
        <span>${need.funded ? 'Target reached' : need.late ? 'Target date has passed' : need.noDate ? 'No target date set' : `${esc(money(need.amount, { whole: true }))}/month to stay on track`}</span>
      </div>
      ${history.length ? `<div class="goal-history">${history.map((entry) => `<div>
        <span>${esc(dateLabel(entry.date))}${entry.note ? ` · ${esc(entry.note)}` : ''}</span>
        <span class="mono">${entry.amountCents > 0 ? '+' : ''}${esc(money(entry.amountCents, { whole: true }))}</span>
      </div>`).join('')}</div>` : ''}
      <div class="goal-actions">
        <button type="button" class="btn btn-secondary btn-sm" data-act="goal-money" data-id="${esc(goal.id)}">${icon('plus', 13)} Add money</button>
        <button type="button" class="btn btn-ghost btn-sm" data-act="edit-goal" data-id="${esc(goal.id)}">Edit</button>
      </div>
    </article>`;
  }).join('');

  const empty = !goals.length ? `<div class="card">
    <div class="empty" style="padding:48px 24px">
      <div class="empty-icon">${icon('target', 22)}</div>
      <h3>What are you building toward?</h3>
      <p>An emergency fund, school fees, a laptop, a trip. A goal marks money as reserved so it is not counted as safe to spend.</p>
      <button type="button" class="btn btn-primary" data-act="add-goal">${icon('plus', 15)} Create a goal</button>
    </div>
  </div>` : '';

  return `
    <section class="card plan-summary" aria-label="Goal summary">
      <div class="stat">
        <span class="stat-label">Reserved</span>
        <span class="stat-value">${esc(money(saved, { whole: true }))}</span>
        <span class="stat-note">Across active goals</span>
      </div>
      <div class="stat">
        <span class="stat-label">Combined target</span>
        <span class="stat-value">${esc(money(target, { whole: true }))}</span>
        <span class="stat-note">${goals.length} active ${plural(goals.length, 'goal')}</span>
      </div>
      <div class="stat">
        <span class="stat-label">Funded</span>
        <span class="stat-value">${percent(pct, 0)}</span>
        <span class="stat-note">Of all targets</span>
      </div>
      <div class="stat">
        <span class="stat-label">Safe-to-spend effect</span>
        <span class="stat-value">−${esc(money(saved, { whole: true }))}</span>
        <span class="stat-note">Reserves are not spendable cash</span>
      </div>
    </section>

    ${cards ? `<section class="goals-grid" aria-label="Goals">${cards}</section>` : empty}

    <div class="info-note" style="margin-top:16px">
      ${icon('info', 15)}
      <span>Goal money is an <strong>earmark</strong>, not a ledger transfer. It stays in the account it is already in, but is subtracted from safe to spend. Move actual cash between accounts with a transfer when you want it physically separated.</span>
    </div>
  `;
}

/* --------------------------------------------------------------- debt planner */

function renderPlanDebt() {
  const liabilities = activeAccounts().filter((acc) => accountNature(acc) === 'liability');
  const owed = liabilities.filter((acc) => accountBalance(acc.id) > 0);
  const totalDebt = sum(owed.map((acc) => accountBalance(acc.id)));
  if (!owed.length) {
    return `<div class="card">
      <div class="empty" style="padding:48px 24px">
        <div class="empty-icon">${icon('debt', 22)}</div>
        <h3>No debt to model</h3>
        <p>Add a credit card or loan account if you are carrying a balance. The planner uses its ledger balance, APR and minimum payment.</p>
        <div class="button-row" style="justify-content:center">
          <button type="button" class="btn btn-primary" data-act="add-account">${icon('plus', 15)} Add a debt account</button>
          <button type="button" class="btn btn-secondary" data-act="go" data-page="accounts">Open accounts</button>
        </div>
      </div>
    </div>`;
  }

  const extraCents = parseMoneyInput(ui.debtExtra) || 0;
  const sim = simulateDebt(extraCents, ui.debtStrategy);
  const minimums = sum(owed.map((acc) => Math.max(0, acc.minPaymentCents)));
  const weightedApr = totalDebt ? sum(owed.map((acc) => accountBalance(acc.id) * (Number(acc.apr) || 0))) / totalDebt : 0;
  const payoffDate = sim.finished ? addMonths(todayISO(), sim.months) : null;

  const debtRows = liabilities.slice().sort((a, b) => accountBalance(b.id) - accountBalance(a.id)).map((acc) => {
    const balance = accountBalance(acc.id);
    return `<div class="debt-card">
      <div>
        <div class="debt-name">${icon(ACCOUNT_TYPES[acc.type].icon, 15)} ${esc(acc.name)} ${balance > 0 ? '' : statusBadge('Paid off', 'mint')}</div>
        <div class="debt-sub">${Number(acc.apr) || 0}% APR · minimum ${esc(money(acc.minPaymentCents, { whole: true }))}/month · ${esc(accountTypeLabel(acc))}</div>
      </div>
      <div class="debt-balance">${esc(money(balance, { whole: true }))}<span>${balance > 0 ? 'owed' : 'clear'}</span></div>
    </div>`;
  }).join('');

  const result = sim.finished ? `<div class="planner-result">
    <div class="big">${sim.months} ${plural(sim.months, 'month')}</div>
    <div class="label">Estimated debt-free around ${esc(payoffDate ? monthLabel(monthOf(payoffDate)) : '—')}.</div>
    <div class="planner-result-grid">
      <div><span>Total interest estimate</span><strong>${esc(money(sim.totalInterest, { whole: true }))}</strong></div>
      <div><span>Monthly payment</span><strong>${esc(money(sim.monthlyPayment, { whole: true }))}</strong></div>
      <div><span>Starting debt</span><strong>${esc(money(totalDebt, { whole: true }))}</strong></div>
      <div><span>Strategy</span><strong>${sim.strategy === 'snowball' ? 'Snowball' : 'Avalanche'}</strong></div>
    </div>
  </div>
  <div class="divider"></div>
  <div class="section-head" style="margin-bottom:8px"><div><h3>Payoff order</h3><p>The order the simulation clears balances.</p></div></div>
  ${sim.payoffOrder.map((debt, index) => `<div class="payoff-row">
    <span class="order">${index + 1}</span>
    <span class="grow">${esc(debt.name)}</span>
    <span class="mono">cleared</span>
  </div>`).join('')}
  <div style="margin-top:14px">${debtChart(sim.balancesOverTime, { width: 480, height: 150, label: 'Estimated debt balance over the payoff period' })}</div>`
  : `<div class="info-note rose" style="margin-bottom:12px">${icon('alert', 15)}<span><strong>These minimums do not clear the debt.</strong> Interest is growing faster than the scheduled payments. Increase the extra payment to see a path out.</span></div>
  <div class="planner-result">
    <div class="big">Not clearing</div>
    <div class="label">At the current minimums and extra payment, the balance does not reach zero within 50 years.</div>
    <div class="planner-result-grid">
      <div><span>Starting debt</span><strong>${esc(money(totalDebt, { whole: true }))}</strong></div>
      <div><span>Monthly payment</span><strong>${esc(money(sim.monthlyPayment, { whole: true }))}</strong></div>
    </div>
  </div>`;

  return `
    <section class="card plan-summary" aria-label="Debt summary">
      <div class="stat">
        <span class="stat-label">Total owed</span>
        <span class="stat-value">${esc(money(totalDebt, { whole: true }))}</span>
        <span class="stat-note">${owed.length} interest-bearing ${plural(owed.length, 'balance')}</span>
      </div>
      <div class="stat">
        <span class="stat-label">Minimums</span>
        <span class="stat-value">${esc(money(minimums, { whole: true }))}</span>
        <span class="stat-note">Per month, before extra</span>
      </div>
      <div class="stat">
        <span class="stat-label">Weighted APR</span>
        <span class="stat-value">${percent(weightedApr, 1)}</span>
        <span class="stat-note">Across current balances</span>
      </div>
      <div class="stat">
        <span class="stat-label">Estimated freedom</span>
        <span class="stat-value">${sim.finished ? `${sim.months} ${plural(sim.months, 'month')}` : 'Not clearing'}</span>
        <span class="stat-note">${sim.finished ? 'With the extra payment' : 'At current payments'}</span>
      </div>
    </section>

    <div class="debt-layout">
      <section class="card section-card">
        <div class="section-head">
          <div><h3>What you owe</h3><p>Balances come from the ledger, not the simulator.</p></div>
          <button type="button" class="link-btn" data-act="go" data-page="accounts">Edit accounts</button>
        </div>
        ${debtRows}
        <div class="info-note" style="margin-top:14px">
          ${icon('info', 14)}
          <span>Add or change APR and minimum payment on the account itself. Interest shown here is simulated, not posted to your ledger.</span>
        </div>
      </section>

      <section class="card planner-box">
        <h3>Payoff planner</h3>
        <p class="hint">Model an extra monthly payment using avalanche (highest APR first) or snowball (smallest balance first).</p>
        <form class="planner-form" data-form="debt-plan" style="margin-top:14px">
          <div class="field">
            <label class="label" for="debt-extra">Extra each month <span class="optional">optional</span></label>
            <div class="money-field inline">
              <span class="money-symbol">${esc(currencySymbol())}</span>
              <input class="input" id="debt-extra" name="extra" inputmode="decimal" placeholder="0.00" value="${esc(ui.debtExtra)}" autocomplete="off">
            </div>
          </div>
          <div class="field" style="margin-top:13px">
            <span class="label">Strategy</span>
            <div class="segmented" role="group" aria-label="Payoff strategy">
              <button type="button" data-act="debt-strategy" data-value="avalanche" aria-pressed="${ui.debtStrategy !== 'snowball'}">Avalanche</button>
              <button type="button" data-act="debt-strategy" data-value="snowball" aria-pressed="${ui.debtStrategy === 'snowball'}">Snowball</button>
            </div>
            <input type="hidden" name="strategy" value="${esc(ui.debtStrategy)}">
            <p class="hint">${ui.debtStrategy === 'snowball' ? 'Clears the smallest balance first for momentum.' : 'Targets the highest interest rate first, usually saving the most.'}</p>
          </div>
          <button type="submit" class="btn btn-primary btn-block" style="margin-top:14px">${icon('trend-down', 15)} Update plan</button>
        </form>

        <div style="margin-top:18px">${result}</div>

        <div class="info-note" style="margin-top:16px">
          ${icon('alert', 14)}
          <span>Estimate only. It assumes fixed APRs, no fees, no new borrowing and that every minimum stays the same. Confirm actual terms with your lender.</span>
        </div>
      </section>
    </div>
  `;
}

/* --------------------------------------------------------------- forecast */

function renderPlanForecast() {
  const forecast = buildForecast(ui.forecastDays);
  const points = forecast.points.map((point) => ({
    label: dateLabel(point.date),
    value: point.value
  }));
  const events = forecast.events;
  const rangeButtons = [30, 60, 90].map((days) => `<button type="button" data-act="forecast-range" data-days="${days}" aria-pressed="${ui.forecastDays === days}">${days} days</button>`).join('');

  const eventHtml = events.length ? events.map((event) => `<div class="forecast-event">
    <span class="date">${esc(dateLabel(event.effectiveDate))}</span>
    <span class="name">${esc(event.rule.name)}${event.overdue ? ' <span class="bill-overdue">· overdue</span>' : ''}<span class="bill-sub">${esc(event.rule.kind === 'income' ? 'Income' : event.rule.kind === 'transfer' ? 'Transfer' : 'Bill')}</span></span>
    <span class="amount ${event.deltaCents > 0 ? 'pos' : 'neg'}">${event.deltaCents > 0 ? '+' : ''}${esc(money(event.deltaCents))}</span>
  </div>`).join('') : `<div class="empty" style="padding:24px 4px">
    <div class="empty-icon">${icon('calendar', 19)}</div>
    <h3>No scheduled movements</h3>
    <p>Add bills, transfers or expected income to project the next few weeks.</p>
    <button type="button" class="btn btn-secondary btn-sm" data-act="add-bill">Add a rule</button>
  </div>`;

  const lowestTone = forecast.lowest < 0 ? 'neg' : '';
  return `
    <section class="card chart-card" style="min-height:0">
      <div class="forecast-head">
        <div>
          <div class="eyebrow" style="margin-bottom:6px">Cash forecast</div>
          <h2 style="font-size:22px">The next ${forecast.days} days</h2>
          <p class="hint" style="margin-top:4px">Only scheduled rules are included. Starting cash is today’s spendable balance.</p>
        </div>
        <div class="segmented" role="group" aria-label="Forecast range">${rangeButtons}</div>
      </div>
      <div class="forecast-summary">
        <div><span>Starting cash</span><strong>${esc(money(forecast.start, { whole: true }))}</strong></div>
        <div><span>Lowest point</span><strong class="${lowestTone}">${esc(money(forecast.lowest, { whole: true }))}</strong></div>
        <div><span>Ending cash</span><strong>${esc(money(forecast.end, { whole: true }))}</strong></div>
        <div><span>Net change</span><strong class="${forecast.change < 0 ? 'neg' : 'pos'}">${forecast.change > 0 ? '+' : ''}${esc(money(forecast.change, { whole: true }))}</strong></div>
      </div>
      <div class="chart-body" style="min-height:220px;margin-top:8px">
        ${lineChart(points, { width: 900, height: 240, color: '#245a40', label: 'Projected spendable cash', empty: 'No scheduled movements in this window.' })}
      </div>
      <div class="forecast-foot" style="color:var(--muted-light);font-size:10px">
        <span>Through ${esc(dateInputLabel(forecast.through))}</span>
        <span>${events.length} scheduled ${plural(events.length, 'event')}</span>
      </div>
    </section>

    <div class="split-grid" style="margin-top:18px">
      <section class="card section-card">
        <div class="section-head">
          <div><h3>Scheduled events</h3><p>Every occurrence in this window, in date order.</p></div>
          <span class="badge badge-neutral">${events.length}</span>
        </div>
        <div class="forecast-list" style="margin-top:0">${eventHtml}</div>
      </section>

      <section class="card section-card">
        <div class="section-head"><div><h3>What this assumes</h3><p>Read the forecast as a plan, not a prediction.</p></div></div>
        <div class="assumption-list">
          <div>Only active recurring rules are included. One-off spending is not predicted.</div>
          <div>Rules post on their scheduled dates, even if income arrives late.</div>
          <div>Internal transfers between spendable accounts net to zero; transfers to savings, cards and loans reduce spendable cash.</div>
          <div>Cash held in savings and reserve accounts is excluded from starting cash.</div>
          <div>Goal earmarks and your cash cushion are not subtracted here, so this is more optimistic than safe-to-spend.</div>
        </div>
        <div class="info-note forest" style="margin-top:16px">
          ${icon('shield', 15)}
          <span>For a cushion-aware number, use <strong>safe to spend</strong> on the overview, which subtracts goals and your buffer.</span>
        </div>
      </section>
    </div>
  `;
}

   Reports, settings and the welcome experience
   --------------------------------------------------------------- */

function renderReports() {
  const month = ui.month;
  const totals = monthTotals(month);
  const previous = monthTotals(addMonthsKey(month, -1));
  const budget = budgetTotals(month);
  const months = monthsEnding(month, 6);
  const cashflow = monthlyCashflow(months).map((row) => ({ ...row, label: monthShort(row.month) }));
  const categories = spendingByCategory(month, 8);
  const maxCategory = categories.length ? Math.max(...categories.map((row) => row.spentCents)) : 0;
  const savingsRate = totals.income ? safePct(totals.net, totals.income) : 0;
  const nwSeries = netWorthSeries(months);
  const nwCurrent = nwSeries.length ? nwSeries[nwSeries.length - 1].value : 0;
  const nwChange = nwSeries.length > 1 ? nwCurrent - nwSeries[nwSeries.length - 2].value : 0;
  const nwTotals = month === currentMonthKey() ? accountTotals() : accountTotals(monthEnd(month));
  const corrections = state.transactions.filter((tx) => (tx.type === 'reversal' || tx.type === 'adjustment') && monthOf(tx.date) === month).length;

  const budgetRows = budget.rows.slice()
    .sort((a, b) => b.spentCents - a.spentCents || b.limitCents - a.limitCents)
    .slice(0, 8);

  const categoryBars = categories.length ? categories.map((row) => {
    const share = safePct(row.spentCents, totals.expense);
    const width = maxCategory ? (row.spentCents / maxCategory) * 100 : 0;
    return `<div class="category-line">
      <span class="cat-left"><span class="cat-dot" style="background:${esc(row.category.color || '#9a958b')}"></span><span>${esc(row.category.name)}</span></span>
      <span class="cat-right">${percent(share, 0)}</span>
      <span class="cat-bar"><span style="width:${width.toFixed(1)}%;background:${esc(row.category.color || '#245a40')}"></span></span>
    </div>`;
  }).join('') : `<div class="empty" style="padding:22px 0"><p>No expenses recorded in this month.</p></div>`;

  const budgetTable = budgetRows.length ? `<div style="overflow-x:auto"><table class="report-table">
    <thead><tr><th>Category</th><th class="num hide-mobile">Budget</th><th class="num">Spent</th><th class="num">Left</th></tr></thead>
    <tbody>${budgetRows.map((row) => {
      const over = row.spentCents > row.limitCents;
      const close = !over && safePct(row.spentCents, row.limitCents) > 85;
      return `<tr>
        <td><span class="cat-name"><span class="cat-dot" style="background:${esc(row.category.color)}"></span>${esc(row.category.name)}${over ? ` <span class="badge badge-rose">Over</span>` : close ? ` <span class="badge badge-warning">Close</span>` : ''}</span></td>
        <td class="num hide-mobile">${esc(money(row.limitCents, { whole: true }))}</td>
        <td class="num">${esc(money(row.spentCents, { whole: true }))}</td>
        <td class="num ${over ? 'neg' : ''}">${esc(money(row.remainingCents, { whole: true }))}</td>
      </tr>`;
    }).join('')}</tbody>
  </table></div>
  <div class="button-row" style="margin-top:12px"><button type="button" class="link-btn" data-act="go" data-page="budgets">Open all budgets ${icon('arrow-right', 12)}</button></div>`
  : `<div class="empty" style="padding:22px 0"><p>No budgets set for ${esc(monthLabel(month))}.</p><button class="btn btn-secondary btn-sm" data-act="edit-budget">Build a budget</button></div>`;

  const allRows = [];
  categoriesOf('expense', true).forEach((cat) => {
    const value = totals.byCategory.get(cat.id) || 0;
    const before = previous.byCategory.get(cat.id) || 0;
    if (value || before) allRows.push({ cat, value, before, type: 'expense' });
  });
  allRows.sort((a, b) => b.value - a.value);
  const incomeRows = [];
  categoriesOf('income', true).forEach((cat) => {
    const value = totals.byCategory.get(cat.id) || 0;
    const before = previous.byCategory.get(cat.id) || 0;
    if (value || before) incomeRows.push({ cat, value, before, type: 'income' });
  });
  incomeRows.sort((a, b) => b.value - a.value);
  const combined = [...allRows, ...incomeRows];

  const totalTable = combined.length ? `<div style="overflow-x:auto"><table class="report-table">
    <thead><tr><th>Category</th><th>Type</th><th class="num">This month</th><th class="num">Share</th><th class="num hide-mobile">vs last month</th></tr></thead>
    <tbody>${combined.map((row) => {
      const share = safePct(row.value, row.type === 'income' ? totals.income : totals.expense);
      const diff = row.value - row.before;
      let delta;
      if (!row.before && row.value) delta = '<span class="badge badge-brass">New</span>';
      else if (!diff) delta = '<span class="muted">—</span>';
      else {
        const good = row.type === 'income' ? diff > 0 : diff < 0;
        delta = `<span class="mono ${good ? 'pos' : 'neg'}">${diff > 0 ? '+' : ''}${esc(money(diff))}</span>`;
      }
      return `<tr>
        <td><span class="cat-name"><span class="cat-dot" style="background:${esc(row.cat.color)}"></span>${esc(row.cat.name)}</span></td>
        <td><span class="badge ${row.type === 'income' ? 'badge-mint' : 'badge-neutral'}">${row.type === 'income' ? 'Income' : 'Expense'}</span></td>
        <td class="num">${esc(money(row.value, { whole: true }))}</td>
        <td class="num">${percent(share, 0)}</td>
        <td class="num hide-mobile">${delta}</td>
      </tr>`;
    }).join('')}</tbody>
  </table></div>` : `<div class="empty" style="padding:30px 0"><p>No category activity recorded for this month.</p></div>`;

  return `
    <div class="top-gap"></div>
    <div class="print-head">
      <div class="eyebrow">Ledgerwise · Monthly report</div>
      <h1 style="margin:6px 0 3px">${esc(monthLabel(month))}</h1>
      <p class="hint">Generated ${esc(dateInputLabel(todayISO()))} · ${esc(state.profile.currency)} · ${esc(state.profile.name || 'Personal ledger')}</p>
    </div>
    ${pageHead({
      eyebrow: 'Reports',
      title: 'The month, explained',
      subtitle: 'Income, spending, budget performance and the categories that moved. Transfers between your own accounts are not counted as spending.',
      actions: `${monthSwitch()}
        <button class="btn btn-secondary" data-act="export-report">${icon('download', 15)} Export CSV</button>
        <button class="btn btn-ghost" data-act="print">${icon('printer', 15)} Print</button>`
    })}

    <section class="card stat-strip" aria-label="Month totals">
      <div class="stat">
        <span class="stat-label">Income</span>
        <span class="stat-value pos">${esc(money(totals.income, { whole: true }))}</span>
        <span class="stat-note">${previous.income ? `${percent(safePct(totals.income - previous.income, previous.income), 0)} vs last month` : 'No prior income'}</span>
      </div>
      <div class="stat">
        <span class="stat-label">Spending</span>
        <span class="stat-value">${esc(money(totals.expense, { whole: true }))}</span>
        <span class="stat-note">${percent(safePct(totals.expense, totals.income), 0)} of income</span>
      </div>
      <div class="stat">
        <span class="stat-label">Kept</span>
        <span class="stat-value ${totals.net < 0 ? 'neg' : ''}">${esc(money(totals.net, { whole: true }))}</span>
        <span class="stat-note">Income minus spending</span>
      </div>
      <div class="stat">
        <span class="stat-label">Savings rate</span>
        <span class="stat-value">${percent(savingsRate, 0)}</span>
        <span class="stat-note">Target ${state.profile.savingsTargetPct}%</span>
      </div>
    </section>

    <section class="card chart-card" style="min-height:0" aria-label="Net worth">
      <div class="chart-head">
        <div>
          <h3>Net worth</h3>
          <p>Assets minus liabilities, as at ${esc(month === currentMonthKey() ? 'today' : monthEnd(month))}</p>
        </div>
        <div class="chart-legend">
          <span class="legend-item"><strong class="mono ${nwChange < 0 ? 'neg' : 'pos'}">${icon(nwChange < 0 ? 'trend-down' : 'trend-up', 13)} ${esc(money(Math.abs(nwChange), { whole: true }))}</strong> vs last month</span>
          <button type="button" class="btn btn-secondary btn-sm" data-act="explain" data-kind="networth">${icon('info', 14)} How it’s built</button>
        </div>
      </div>
      <div class="nw-total mono">${esc(money(nwCurrent, { whole: true }))}</div>
      <div class="chart-body">${sparkline(nwSeries.map((point) => point.value), { width: 900, height: 150, color: '#245a40', label: 'Net worth over the last six months' })}</div>
      <div class="nw-split">
        <span>Assets <strong class="mono">${esc(money(nwTotals.assets, { whole: true }))}</strong></span>
        <span>Liabilities <strong class="mono">${esc(money(nwTotals.liabilities, { whole: true }))}</strong></span>
        <button type="button" class="link-btn" data-act="go" data-page="accounts">Open accounts ${icon('arrow-right', 12)}</button>
      </div>
    </section>

    <section class="card chart-card" style="min-height:0">
      <div class="chart-head">
        <div><h3>Six-month cash flow</h3><p>Income and spending to ${esc(monthLabel(month))}</p></div>
        <div class="chart-legend">
          <span class="legend-item"><span class="legend-dot" style="background:#245a40"></span>Income</span>
          <span class="legend-item"><span class="legend-dot" style="background:#d3b39d"></span>Spending</span>
        </div>
      </div>
      <div class="chart-body">${cashflowChart(cashflow, { width: 900, height: 230 })}</div>
    </section>

    <div class="report-grid">
      <section class="card report-card">
        <div class="section-head">
          <div><h3>Where spending went</h3><p>${esc(monthLabel(month))} · ${esc(money(totals.expense, { whole: true }))} total</p></div>
        </div>
        <div class="category-breakdown">${categoryBars}</div>
      </section>

      <section class="card report-card">
        <div class="section-head">
          <div><h3>Budget vs actual</h3><p>${budget.rows.length} budgeted ${plural(budget.rows.length, 'category', 'categories')}.</p></div>
          ${statusBadge(budget.limit ? `${percent(budget.pct, 0)} used` : 'No plan', budget.pct > 100 ? 'rose' : budget.limit ? 'mint' : 'neutral')}
        </div>
        ${budgetTable}
      </section>

      <section class="card report-card full">
        <div class="section-head">
          <div><h3>Month in review</h3><p>A few checks on the shape of the month.</p></div>
        </div>
        <div class="month-review">
          <div><span>Kept</span><strong class="${totals.net < 0 ? 'neg' : ''}">${esc(money(totals.net, { whole: true }))}</strong></div>
          <div><span>Budgeted spending</span><strong>${esc(money(budget.spent, { whole: true }))}</strong></div>
          <div><span>Unbudgeted spending</span><strong>${esc(money(budget.unbudgetedTotal, { whole: true }))}</strong></div>
          <div><span>Corrections posted</span><strong>${corrections}</strong></div>
        </div>
      </section>

      <section class="card report-card full">
        <div class="section-head">
          <div><h3>All category totals</h3><p>Current month compared with ${esc(monthLabel(addMonthsKey(month, -1)))}.</p></div>
        </div>
        ${totalTable}
      </section>
    </div>

    <div class="info-note" style="margin-top:16px">
      ${icon('info', 15)}
      <span>Reports read posted journal entries. Reversals are dated on the original entry so corrections cancel within the right period. Opening balances and account transfers never count as income or spending.</span>
    </div>
  `;
}

/* --------------------------------------------------------------- settings */

function formatBytes(bytes) {
  if (!bytes) return '0 KB';
  if (bytes < 1024) return `${bytes} B`;
  if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
  return `${(bytes / (1024 * 1024)).toFixed(2)} MB`;
}

function categoryManagerRow(category) {
  return `<div class="cat-manager-row ${category.archived ? 'archived' : ''}">
    <span class="cat-dot" style="background:${esc(category.color)}"></span>
    <span class="name">${esc(category.name)}</span>
    <span class="group">${esc(groupLabel(category.group))}</span>
    <button type="button" class="btn-icon btn-sm" data-act="edit-category" data-id="${esc(category.id)}" aria-label="Edit ${esc(category.name)}">${icon('edit', 13)}</button>
    <button type="button" class="btn-icon btn-sm" data-act="toggle-category" data-id="${esc(category.id)}" aria-label="${category.archived ? 'Restore' : 'Archive'} ${esc(category.name)}">${icon(category.archived ? 'rotate-ccw' : 'archive', 13)}</button>
  </div>`;
}

const THEME_KEY = 'ledgerwise_theme_v1';
const THEME_CHOICES = [
  { id: 'paper', label: 'Paper', note: 'Warm cream and forest green — the original.' },
  { id: 'night', label: 'Night', note: 'Dark surfaces, same green and brass identity.' },
  { id: 'linen', label: 'Linen', note: 'Bright cool white with harder contrast, best in daylight.' },
  { id: 'system', label: 'Follow device', note: 'Paper by day, Night when your device goes dark.' }
];

function themeChoice() {
  let stored = '';
  try { stored = localStorage.getItem(THEME_KEY) || ''; } catch (err) { /* private mode */ }
  return THEME_CHOICES.some((t) => t.id === stored) ? stored : 'paper';
}

function resolveTheme(choice) {
  if (choice !== 'system') return choice;
  try { return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'paper'; } catch (err) { return 'paper'; }
}

let themeMediaBound = false;

function applyTheme(choice) {
  const selected = choice || themeChoice();
  const resolved = resolveTheme(selected);
  if (resolved === 'paper') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', resolved);
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', resolved === 'night' ? '#0f1512' : resolved === 'linen' ? '#f6f7f6' : '#173f2e');
  if (selected === 'system' && !themeMediaBound) {
    themeMediaBound = true;
    try {
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => applyTheme('system'));
    } catch (err) { themeMediaBound = false; }
  }
  return resolved;
}

function setThemeChoice(choice) {
  if (!THEME_CHOICES.some((t) => t.id === choice)) return;
  try { localStorage.setItem(THEME_KEY, choice); } catch (err) { /* private mode */ }
  applyTheme(choice);
}

function appearanceCard() {
  const choice = themeChoice();
  const resolved = resolveTheme(choice);
  const active = THEME_CHOICES.find((t) => t.id === choice) || THEME_CHOICES[0];
  const buttons = THEME_CHOICES.map((t) => `<button type="button" data-act="set-theme" data-choice="${t.id}" aria-pressed="${t.id === choice}" title="${esc(t.note)}">${esc(t.label)}</button>`).join('');
  const swatches = THEME_CHOICES.map((t) => {
    const map = {
      paper: ['#f3eee3', '#173f2e', '#b3874a'],
      night: ['#0f1512', '#3d8a64', '#d9ae63'],
      linen: ['#f6f7f6', '#0f5f52', '#9a6b25'],
      system: ['#f3eee3', '#0f1512', '#b3874a']
    };
    return `<span class="theme-swatch${t.id === resolved ? ' on' : ''}">${(map[t.id] || []).map((c) => `<i style="background:${c}"></i>`).join('')}${esc(t.id === 'system' ? resolved : t.id)}</span>`;
  }).join('');
  return `<section class="card settings-card">
    <div class="section-head">
      <div><h3>Appearance</h3><p>Remembered on this device only, so your phone can go dark while your laptop stays light.</p></div>
    </div>
    <div class="segmented" role="group" aria-label="Theme">${buttons}</div>
    <div class="theme-swatch-row">${swatches}</div>
    <p class="hint" style="margin-top:10px">${esc(active.note)}</p>
  </section>`;
}

'use strict';

/* ---------------------------------------------------------------
   Modals and forms
   --------------------------------------------------------------- */
let activeModal = null;
let lastFocusedElement = null;

function modalShell(opts) {
  const titleId = `modal-title-${Date.now()}`;
  return `<div class="modal-layer" id="modal-layer">
    <div class="modal-backdrop" data-act="close-modal" aria-hidden="true"></div>
    <div class="modal ${opts.size === 'lg' ? 'modal-lg' : opts.size === 'sm' ? 'modal-sm' : opts.size === 'xl' ? 'modal-xl' : ''}" role="dialog" aria-modal="true" aria-labelledby="${titleId}">
      <div class="modal-head">
        <div>
          <h2 id="${titleId}">${esc(opts.title || '')}</h2>
          ${opts.subtitle ? `<p>${esc(opts.subtitle)}</p>` : ''}
        </div>
        <button type="button" class="modal-close" data-act="close-modal" aria-label="Close dialog">${icon('close', 16)}</button>
      </div>
      <div class="modal-body">${opts.body || ''}</div>
      ${opts.foot ? `<div class="modal-foot">${opts.foot}</div>` : ''}
    </div>
  </div>`;
}

function openModal(opts) {
  const root = document.getElementById('modal-root');
  if (!root) return;
  lastFocusedElement = document.activeElement;
  root.innerHTML = modalShell(opts);
  document.body.classList.add('locked');
  activeModal = root.querySelector('.modal');
  if (typeof opts.onReady === 'function') opts.onReady(root);
  requestAnimationFrame(() => {
    const target = root.querySelector('[data-autofocus]')
      || root.querySelector('input:not([type="hidden"]), select, textarea, button:not(.modal-close)');
    if (target && typeof target.focus === 'function') target.focus({ preventScroll: true });
  });
}

function closeModal() {
  const root = document.getElementById('modal-root');
  if (root) root.innerHTML = '';
  document.body.classList.remove('locked');
  activeModal = null;
  if (lastFocusedElement && document.contains(lastFocusedElement) && typeof lastFocusedElement.focus === 'function') {
    lastFocusedElement.focus({ preventScroll: true });
  }
  lastFocusedElement = null;
}

function trapFocus(event) {
  if (!activeModal) return;
  const focusable = [...activeModal.querySelectorAll('button:not([disabled]), [href], input:not([disabled]):not([type="hidden"]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])')]
    .filter((el) => el.offsetParent !== null);
  if (!focusable.length) return;
  const first = focusable[0];
  const last = focusable[focusable.length - 1];
  if (event.shiftKey && document.activeElement === first) {
    event.preventDefault();
    last.focus();
  } else if (!event.shiftKey && document.activeElement === last) {
    event.preventDefault();
    first.focus();
  }
}

document.addEventListener('keydown', (event) => {
  if (!activeModal) return;
  if (event.key === 'Escape') {
    event.preventDefault();
    closeModal();
  } else if (event.key === 'Tab') {
    trapFocus(event);
  }
});

function formError(message) {
  const root = document.getElementById('modal-root');
  const target = root && root.querySelector('#form-error');
  if (target) {
    target.textContent = message;
    target.classList.add('show');
    target.scrollIntoView({ block: 'nearest' });
  }
  toast(message, 'error');
}

function accountSelectOptions(opts = {}) {
  const selected = opts.selected || '';
  let list = activeAccounts().slice().sort((a, b) => {
    const natureA = accountNature(a) === 'asset' ? 0 : 1;
    const natureB = accountNature(b) === 'asset' ? 0 : 1;
    return natureA - natureB || accountTypeOrder(a.type) - accountTypeOrder(b.type) || a.name.localeCompare(b.name);
  });
  if (opts.assetsOnly) list = list.filter((acc) => accountNature(acc) === 'asset');
  if (selected && !list.some((acc) => acc.id === selected)) {
    const extra = accountById(selected);
    if (extra) list = [extra, ...list];
  }
  return `<option value="">${esc(opts.placeholder || 'Choose an account…')}</option>` + list.map((acc) => {
    const detail = `${accountTypeLabel(acc)}${acc.institution ? ` · ${acc.institution}` : ''} · ${money(accountBalance(acc.id))}${acc.archived ? ' · archived' : ''}`;
    return `<option value="${esc(acc.id)}"${isSelected(acc.id, selected)}>${esc(acc.name)} — ${esc(detail)}</option>`;
  }).join('');
}

function txCategoryOptions(type, selected) {
  const cats = categoriesOf(type, false);
  const selectedCategory = selected ? state.categories.find((cat) => cat.id === selected) : null;
  if (selectedCategory && selectedCategory.archived && !cats.some((cat) => cat.id === selectedCategory.id)) {
    cats.push(selectedCategory);
  }
  const groups = new Map();
  for (const cat of cats) {
    if (!groups.has(cat.group)) groups.set(cat.group, []);
    groups.get(cat.group).push(cat);
  }
  const sorted = [...groups.keys()].sort((a, b) => (GROUPS[a] ? GROUPS[a].order : 99) - (GROUPS[b] ? GROUPS[b].order : 99));
  return `<option value="">Choose a category…</option>` + sorted.map((key) => `<optgroup label="${esc(groupLabel(key))}">
    ${groups.get(key).map((cat) => `<option value="${esc(cat.id)}"${isSelected(cat.id, selected)}>${esc(cat.name)}${cat.archived ? ' (archived)' : ''}</option>`).join('')}
  </optgroup>`).join('');
}

function mostRecentCategory(type) {
  const recent = state.transactions.slice()
    .filter((tx) => tx.categoryId && categoryById(tx.categoryId).type === type && tx.type === type)
    .sort(txSort)[0];
  return recent ? recent.categoryId : '';
}

function lastUsedAccountId(type) {
  const recent = state.transactions.slice().sort(txSort)[0];
  const account = recent ? accountById(recent.accountId) : null;
  const ok = (acc) => acc && !acc.archived && (type !== 'income' || accountNature(acc) === 'asset');
  if (ok(account)) return account.id;
  const fallback = activeAccounts().find(ok);
  return fallback ? fallback.id : '';
}

/* The destination you used last time with this same source account, so a routine
   M-Pesa to M-Shwari top-up fills itself instead of being re-picked every time. */
function lastTransferDestination(fromAccountId) {
  if (!fromAccountId) return '';
  const recent = state.transactions.slice()
    .filter((tx) => tx.type === 'transfer' && tx.accountId === fromAccountId && tx.toAccountId)
    .sort(txSort)[0];
  if (!recent) return '';
  const account = accountById(recent.toAccountId);
  return account && !account.archived && account.id !== fromAccountId ? account.id : '';
}

const ACCOUNT_NAME_GENERIC = ['bank', 'account', 'wallet', 'card', 'cash', 'money', 'savings', 'loan', 'mobile', 'pesa'];

function matchAccountByName(text, excludeId) {
  const words = ` ${String(text || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim().split(' ').filter(Boolean).join(' ')} `;
  if (words.trim().length < 4) return null;
  let best = null;
  let bestScore = 0;
  for (const account of activeAccounts()) {
    if (account.id === excludeId || account.archived) continue;
    for (const needle of [account.name, account.institution]) {
      const flat = String(needle || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
      if (!flat) continue;
      if (flat.length >= 4 && words.includes(` ${flat} `)) {
        if (flat.length > bestScore) { best = account; bestScore = flat.length; }
        continue;
      }
      for (const token of flat.split(' ')) {
        if (token.length < 5 || ACCOUNT_NAME_GENERIC.includes(token)) continue;
        if (words.includes(` ${token} `) && token.length > bestScore) {
          best = account;
          bestScore = token.length;
        }
      }
    }
  }
  return best;
}

/* Keeps the account boxes in step with what he has typed and with his own habits:
   a description naming another account fills the destination, and an expense or
   income that clearly moves money between his own pockets offers the Transfer tab. */
function syncTxMatches() {
  const form = document.getElementById('tx-form');
  if (!form) return;
  const type = document.querySelector('input[name="tx-type"]')?.value || 'expense';
  const from = document.getElementById('tx-account');
  const to = document.getElementById('tx-destination');
  const note = document.getElementById('tx-destination-note');
  const hint = document.getElementById('tx-match-hint');
  const text = `${form.querySelector('[name="payee"]')?.value || ''} ${form.querySelector('[name="description"]')?.value || ''}`;
  const match = matchAccountByName(text, from ? from.value : '');
  if (note) note.hidden = !(to && match && to.dataset.auto === '1' && to.value === match.id);
  if (type === 'transfer') {
    if (hint) hint.hidden = true;
    if (match && to && to.value !== match.id) {
      to.value = match.id;
      to.dataset.auto = '1';
      if (note) note.hidden = false;
      refreshTxPreview();
    }
    return;
  }
  if (!hint) return;
  hint.hidden = !match;
  if (match) {
    hint.dataset.type = 'transfer';
    hint.innerHTML = `${icon('info', 14)}<span>That is one of your own accounts. To move money there instead of spending it, record a <strong>Transfer</strong> to ${esc(match.name)}.</span>`;
  }
}

function refreshTxPreview() {
  const preview = document.getElementById('tx-preview');
  if (!preview) return;
  const type = document.querySelector('input[name="tx-type"]')?.value || 'expense';
  const raw = document.getElementById('tx-amount')?.value || '';

  const account = accountById(document.getElementById('tx-account')?.value);
  const category = categoryById(document.getElementById('tx-category')?.value);
  const destination = accountById(document.getElementById('tx-destination')?.value);
  if (!amount) {
    preview.innerHTML = `${icon('info', 14)}<span>Enter an amount to see the journal lines this entry will post.</span>`;
    return;
  }
  if (!account) {
    preview.innerHTML = `${icon('info', 14)}<span>Choose an account to see how the entry will balance.</span>`;
    return;
  }
  if (type === 'transfer') {
    if (!destination) {
      preview.innerHTML = `${icon('info', 14)}<span>Debit ${esc(destination ? destination.name : 'the destination')} and credit ${esc(account.name)} once a destination is chosen.</span>`;
      return;
    }
    preview.innerHTML = `${icon('check', 14)}<span>Debit <strong>${esc(destination.name)}</strong> ${esc(money(amount))} · credit <strong>${esc(account.name)}</strong> ${esc(money(amount))}. Two balanced lines.</span>`;
    return;
  }
  if (!document.getElementById('tx-category')?.value || !category) {
    preview.innerHTML = `${icon('info', 14)}<span>Choose a category to see how the entry will balance.</span>`;
    return;
  }
  if (type === 'income') {
    preview.innerHTML = `${icon('check', 14)}<span>Debit <strong>${esc(account.name)}</strong> ${esc(money(amount))} · credit <strong>${esc(category.name)}</strong> ${esc(money(amount))}. Two balanced lines.</span>`;
  } else {
    preview.innerHTML = `${icon('check', 14)}<span>Debit <strong>${esc(category.name)}</strong> ${esc(money(amount))} · credit <strong>${esc(account.name)}</strong> ${esc(money(amount))}. Two balanced lines.</span>`;
  }
}

function setTxType(type) {
  const hidden = document.querySelector('input[name="tx-type"]');
  if (hidden) hidden.value = type;
  document.querySelectorAll('.segmented [data-act="tx-type"]').forEach((button) => {
    button.setAttribute('aria-pressed', String(button.dataset.type === type));
  });
  const categoryWrap = document.getElementById('tx-category-wrap');
  const destWrap = document.getElementById('tx-destination-wrap');
  if (categoryWrap) categoryWrap.hidden = type === 'transfer';
  if (destWrap) destWrap.hidden = type !== 'transfer';
  const accountSelect = document.getElementById('tx-account');
  const currentAccount = accountSelect ? accountSelect.value : '';
  if (accountSelect) {
    accountSelect.innerHTML = accountSelectOptions({
      selected: currentAccount,
      assetsOnly: type === 'income',
      placeholder: 'Choose an account…'
    });
    if (!accountSelect.value) {
      const first = accountSelect.querySelector('option:not([value=""])');
      if (first && currentAccount === '') accountSelect.value = '';
    }
  }
  const accountLabel = document.getElementById('tx-account-label');
  if (accountLabel) accountLabel.textContent = type === 'income' ? 'Received into' : type === 'transfer' ? 'From account' : 'Paid from';
  const categorySelect = document.getElementById('tx-category');
  if (categorySelect && type !== 'transfer') {
    const prior = categorySelect.value;
    categorySelect.innerHTML = txCategoryOptions(type, type === 'expense' && prior && categoryById(prior).type === 'expense' ? prior : type === 'income' && prior && categoryById(prior).type === 'income' ? prior : mostRecentCategory(type));
  }
  const destSelect = document.getElementById('tx-destination');
  if (destSelect && type === 'transfer') {
    destSelect.innerHTML = accountSelectOptions({ selected: destSelect.value, placeholder: 'Choose destination…' });
    if (!destSelect.value) {
      const remembered = lastTransferDestination(currentAccount);
      if (remembered) destSelect.value = remembered;
    }
  }
  syncTxMatches();
  refreshTxPreview();
}

    title: editing ? 'Correct this entry' : 'Record a transaction',

      : 'Each entry posts two balanced journal lines and can be reviewed later.',
    size: 'lg',
    body,
    foot: `<button type="button" class="btn btn-ghost" data-act="close-modal">Cancel</button>

        if (event && event.target && event.target.id === 'tx-destination') delete event.target.dataset.auto;
        refreshTxPreview();
        syncTxMatches();
      };
      form.addEventListener('input', onEntry);
      form.addEventListener('change', onEntry);
      onEntry();
    }
  });
}

function journalName(entry, tx) {
  if (entry.equity) {
    if (tx.type === 'opening') return 'Opening equity';
    if (tx.type === 'adjustment') return 'Reconciliation equity';
    return 'Equity';
  }
  if (entry.categoryId) return categoryById(entry.categoryId).name;
  const account = accountById(entry.accountId);
  return account ? account.name : 'Missing account';
}

function openTxDetail(id) {

  const destination = tx.toAccountId ? accountById(tx.toAccountId) : null;
  const system = tx.type === 'opening' || tx.type === 'adjustment';
  const reversed = !!tx.reversedBy;
  const reversalTx = reversed ? state.transactions.find((row) => row.id === tx.reversedBy) : null;
  const originalTx = tx.replaces ? state.transactions.find((row) => row.id === tx.replaces) : null;

  const body = `<div class="detail-amount-wrap">
    <div class="detail-type">${statusBadge(txKindLabel(tx), tx.type === 'income' ? 'mint' : tx.type === 'transfer' ? 'sky' : 'neutral')} ${statusBadgeHtml}</div>

    <div class="detail-cell"><span>Date</span><strong>${esc(dateInputLabel(tx.date))}</strong></div>
    <div class="detail-cell"><span>Reference</span><strong>${esc(tx.ref || '—')}</strong></div>

    <div class="detail-cell"><span>${tx.type === 'transfer' ? 'To' : 'Category'}</span><strong>${esc(tx.type === 'transfer' ? (destination ? destination.name : '—') : (category ? category.name : '—'))}</strong></div>

    <div class="detail-cell"><span>Lines</span><strong>${tx.entries.length}</strong></div>
  </div>
  ${tx.notes ? `<p class="detail-note">${esc(tx.notes)}</p>` : ''}
  <div class="form-section" style="margin-top:18px;padding-top:16px">
    <div class="form-section-title">Journal</div>

function refreshReconcilePreview() {
  const root = document.getElementById('modal-root');
  if (!root) return;
  const form = root.querySelector('#reconcile-form');
  if (!form) return;
  const account = accountById(form.dataset.id);
  if (!account) return;
  const current = accountBalance(account.id);
  const raw = root.querySelector('#reconcile-statement').value;
  const statement = parseMoneyInput(raw, { allowZero: true, allowNegative: accountNature(account) === 'liability' });
  const preview = root.querySelector('#reconcile-diff');
  if (!preview) return;
  if (statement == null) {
    preview.className = 'preview-line warn';
    preview.innerHTML = `${icon('info', 14)}<span>Enter the statement balance to see the adjustment.</span>`;
    return;
  }
  const diff = statement - current;
  if (diff === 0) {
    preview.className = 'preview-line';
    preview.innerHTML = `${icon('check', 14)}<span>Already matches the ledger at <strong>${esc(money(current))}</strong>. No adjustment will post.</span>`;
  } else {
    preview.className = 'preview-line warn';
    preview.innerHTML = `${icon('alert', 14)}<span>An adjustment of <strong>${esc(money(Math.abs(diff)))}</strong> will post to equity, ${diff > 0 ? 'increasing' : 'decreasing'} the account to ${esc(money(statement))}. It will not count as income or spending.</span>`;
  }
}

function openBudgetEditor(categoryId) {
  const month = ui.month;
  const map = budgetsForMonth(month);
  const totals = monthTotals(month);
  const expense = categoriesOf('expense', false);
  const groups = new Map();
  for (const category of expense) {
    if (!groups.has(category.group)) groups.set(category.group, []);
    groups.get(category.group).push(category);
  }
  const groupKeys = [...groups.keys()].sort((a, b) => (GROUPS[a] ? GROUPS[a].order : 99) - (GROUPS[b] ? GROUPS[b].order : 99));

  const rowField = (category) => {
    const limit = map.get(category.id) || 0;
    const spent = totals.byCategory.get(category.id) || 0;
    return `<div class="field">
      <label class="label" for="budget-${esc(category.id)}">${esc(category.name)} <span class="optional">${spent ? `${esc(money(spent, { whole: true }))} spent` : 'no activity'}</span></label>
      <div class="money-field inline">
        <span class="money-symbol">${esc(currencySymbol())}</span>
        <input class="input" id="budget-${esc(category.id)}" name="budget_${esc(category.id)}" inputmode="decimal" value="${limit ? esc(inputMoney(limit)) : ''}" placeholder="No limit">
      </div>
    </div>`;
  };

  const single = categoryId ? categoryById(categoryId) : null;
  const body = `<form id="budget-form" data-form="budget" novalidate>
    ${single
      ? `<div class="explain-rows">
          <div class="explain-row"><span>${esc(single.name)}</span><span>${esc(groupLabel(single.group))}</span></div>
          <div class="explain-row"><span>Spent this month</span><span class="mono">${esc(money(totals.byCategory.get(single.id) || 0))}</span></div>
        </div>
        <div class="field" style="margin-top:14px">
          <label class="label" for="budget-${esc(single.id)}">Monthly limit</label>
          <div class="money-field">
            <span class="money-symbol">${esc(currencySymbol())}</span>
            <input class="input" id="budget-${esc(single.id)}" name="budget_${esc(single.id)}" inputmode="decimal" value="${map.get(single.id) ? esc(inputMoney(map.get(single.id))) : ''}" placeholder="0.00" data-autofocus>
          </div>
          <p class="hint">Leave blank or enter 0 to remove this limit. Limits apply only to ${esc(monthLabel(month))}.</p>
        </div>`
      : `<p class="hint" style="margin-bottom:14px">Set a monthly limit for ${esc(monthLabel(month))}. Leave blank or 0 for no limit. Spending is counted from posted expense entries.</p>
        ${groupKeys.map((key) => `<div class="form-section">
          <div class="form-section-title">${esc(groupLabel(key))}</div>
          <div class="form-grid">${groups.get(key).map(rowField).join('')}</div>
        </div>`).join('')}`}

  </form>`;

  openModal({
    title: single ? `Edit ${single.name} budget` : 'Build the month’s plan',
    subtitle: single ? 'A limit is a decision, not a restriction.' : 'Give each category a ceiling. You can change it whenever life changes.',
    size: single ? undefined : 'lg',
    body,
    foot: `${single && map.get(single.id) ? `<button type="button" class="btn btn-ghost left" data-act="remove-budget" data-id="${esc(single.id)}" style="color:var(--negative)">Remove limit</button>` : ''}
      <button type="button" class="btn btn-ghost" data-act="close-modal">Cancel</button>
      <button type="submit" class="btn btn-primary" form="budget-form">Save plan</button>`
  });
}

function refreshGoalMoneyPreview() {
  const root = document.getElementById('modal-root');
  if (!root) return;
  const form = root.querySelector('#goal-money-form');
  if (!form) return;
  const goal = state.goals.find((row) => row.id === form.dataset.id);
  if (!goal) return;
  const mode = root.querySelector('input[name="goal-money-mode"]')?.value || 'add';
  const amount = parseMoneyInput(root.querySelector('#goal-money-amount')?.value || '');
  const current = Math.max(0, goalSaved(goal));
  const preview = root.querySelector('#goal-money-preview');
  if (!preview) return;
  if (!amount) {
    preview.className = 'preview-line';
    preview.innerHTML = `${icon('info', 14)}<span>Currently reserved: <strong>${esc(money(current))}</strong>.</span>`;
    return;
  }
  const next = mode === 'withdraw' ? current - amount : current + amount;
  if (next < 0) {
    preview.className = 'preview-line warn';
    preview.innerHTML = `${icon('alert', 14)}<span>You cannot withdraw more than the <strong>${esc(money(current))}</strong> currently reserved.</span>`;
  } else {
    preview.className = 'preview-line';
    preview.innerHTML = `${icon('check', 14)}<span>Reserved after this: <strong>${esc(money(next))}</strong> of ${esc(money(goal.targetCents))}.</span>`;
  }
}
