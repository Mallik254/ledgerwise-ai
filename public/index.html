function cloudKeyIsPublishable(key) {
  const value = String(key || '').trim();
  if (!value || /REPLACE_WITH/i.test(value)) return false;
  if (/^sb_secret_/i.test(value) || /service_role/i.test(value)) return false;
  if (value.startsWith('sb_publishable_')) return true;
  if (value.startsWith('eyJ')) {
    try {
      let body = value.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
      body += '='.repeat((4 - (body.length % 4)) % 4);
      const payload = JSON.parse(atob(body));
      return payload.role === 'anon';
    } catch (err) {
      return false;
    }
  }
  return false;
}

function isCloudConfigured() {
  try {
    return new URL(SUPABASE_URL).protocol === 'https:'
      && cloudKeyIsPublishable(SUPABASE_PUBLISHABLE_KEY);
  } catch (err) {
    return false;
  }
}

function cloudRedirectUrl() {
  const url = new URL(window.location.href);
  url.hash = '';
  url.search = '';
  return `${url.origin}${url.pathname}`;
}

function cloudAuthParamsPresent() {
  const search = new URLSearchParams(window.location.search);
  const hash = new URLSearchParams(window.location.hash.replace(/^#/, ''));
  return search.has('code') || search.has('error') || hash.has('access_token') || hash.has('error');
}

function cloudCleanUrl() {
  const url = new URL(window.location.href);
  ['code', 'error', 'error_code', 'error_description'].forEach((key) => url.searchParams.delete(key));
  if (/#(access_token|refresh_token|expires_in|token_type|error|error_code|error_description)=/.test(url.hash)) {
    url.hash = '';
  }
  const next = `${url.pathname}${url.search}${url.hash}`;
  if (next !== `${window.location.pathname}${window.location.search}${window.location.hash}`) {
    window.history.replaceState(null, '', next);
  }
}

function cloudReadAuthError() {
  const query = new URLSearchParams(window.location.search);
  const hash = new URLSearchParams(window.location.hash.replace(/^#/, ''));
  const code = query.get('error_code') || hash.get('error_code') || '';
  const raw = query.get('error_description') || query.get('error') || hash.get('error_description') || hash.get('error') || '';
  if (!raw && !code) return '';
  const combined = `${code} ${raw}`;
  if (query.has('error') || hash.has('error')) cloudCleanUrl();
  if (/expired|invalid|otp/i.test(combined)) {
    return 'That sign-in link has expired or has already been used. Request a new one below.';
  }
  return 'That sign-in link could not be used. Request a new one below.';
}

/* --------------------------------------------------------------- local cache */

function cloudClearLocal() {
  try {
    localStorage.removeItem(DB_KEY);
    localStorage.removeItem(CLOUD_META_KEY);
  } catch (err) { /* storage can be blocked */ }
}

function cloudStoreLocal(nextState) {
  try {
    localStorage.setItem(DB_KEY, JSON.stringify(nextState));
    ui.lastSaved = nextState.updatedAt || nowISO();
  } catch (err) { /* the cloud copy remains authoritative */ }
}

function cloudWriteMeta() {
  if (!cloud.user) return;
  try {
    localStorage.setItem(CLOUD_META_KEY, JSON.stringify({
      userId: cloud.user.id,
      revision: cloud.revision,
      savedAt: cloud.lastSync ? cloud.lastSync.toISOString() : nowISO()
    }));
  } catch (err) { /* not fatal */ }
}

function cloudReadMeta() {
  try {
    const raw = localStorage.getItem(CLOUD_META_KEY);
    if (!raw) return null;
    const value = JSON.parse(raw);
    if (!value || typeof value !== 'object') return null;
    return value;
  } catch (err) {
    return null;
  }
}

/* --------------------------------------------------------------- status UI */

function cloudStatusLabel() {
  switch (cloud.status) {
    case 'pending': return 'Unsaved changes';
    case 'saving': return 'Saving to cloud…';
    case 'saved': return 'Saved to cloud';
    case 'error': return 'Not saved · Retry';
    case 'conflict': return 'Sync conflict · Review';
    default: return 'Private cloud';
  }
}

function cloudStatusBadge() {
  if (cloud.status === 'saved') return { label: 'Synced', tone: 'mint' };
  if (cloud.status === 'pending' || cloud.status === 'saving') return { label: 'Saving', tone: 'brass' };
  if (cloud.status === 'conflict') return { label: 'Review needed', tone: 'rose' };
  if (cloud.status === 'error') return { label: 'Not saved', tone: 'rose' };
  return { label: 'Cloud', tone: 'neutral' };
}

function cloudTimeLabel() {
  if (!cloud.lastSync) return 'Waiting for the first cloud save.';
  const seconds = Math.max(0, Math.round((Date.now() - cloud.lastSync.getTime()) / 1000));
  if (seconds < 20) return 'Saved just now.';
  if (seconds < 60) return `Saved ${seconds} seconds ago.`;
  const minutes = Math.round(seconds / 60);
  if (minutes < 60) return `Saved ${minutes} ${plural(minutes, 'minute')} ago.`;
  return `Saved ${timestampLabel(cloud.lastSync.toISOString())}.`;
}

function cloudStatusDetail() {
  if (cloud.status === 'error') return cloud.lastError || 'Your latest changes are in this browser only.';
  if (cloud.status === 'conflict') return 'Cloud saving is paused until the conflict is reviewed.';
  if (cloud.status === 'pending') return 'Changes are waiting to be written to your private cloud ledger.';
  if (cloud.status === 'saving') return 'Writing changes to your private cloud ledger.';
  return `${cloudTimeLabel()} Only your signed-in account can read this ledger.`;
}

function renderCloudStatus() {
  const signedIn = !!(cloud.enabled && cloud.user);
  const pill = document.getElementById('cloud-pill');
  if (pill) {
    pill.hidden = !signedIn;
    pill.dataset.status = cloud.status;
    const label = document.getElementById('cloud-pill-text');
    if (label) label.textContent = cloudStatusLabel();
  }

  const bar = document.getElementById('cloud-bar');
  if (bar) {
    const urgent = signedIn && ['error', 'conflict'].includes(cloud.status);
    bar.hidden = !urgent;
    bar.dataset.status = cloud.status;
    if (urgent) {
      const conflict = cloud.status === 'conflict';
      bar.innerHTML = `<div class="cloud-bar-main">${icon('alert', 14)}<span>${conflict
        ? 'A newer ledger was saved in another tab or on another device. Your changes here are not in the cloud yet.'
        : esc(cloud.lastError || 'Cloud save failed. Your changes are still in this browser.')}</span></div>
        <button type="button" class="link-btn" data-act="cloud-sync-now">${conflict ? 'Review' : 'Retry'}</button>`;
    } else {
      bar.innerHTML = '';
    }
  }

  document.querySelectorAll('[data-cloud-badge]').forEach((element) => {
    const badge = cloudStatusBadge();
    element.className = `badge badge-${badge.tone}`;
    element.textContent = badge.label;
  });
  document.querySelectorAll('[data-cloud-detail]').forEach((element) => {
    element.textContent = cloudStatusDetail();
  });
  document.querySelectorAll('[data-cloud-email]').forEach((element) => {
    element.textContent = cloud.user && cloud.user.email ? cloud.user.email : '';
  });
  document.querySelectorAll('[data-cloud-save-now]').forEach((button) => {
    button.disabled = !signedIn || cloud.status === 'saving' || cloud.status === 'conflict';
  });
}

function cloudSetStatus(status, error) {
  const previous = cloud.status;
  cloud.status = status;
  if (status === 'error') cloud.lastError = error || cloud.lastError || 'Cloud save failed.';
  if (status === 'saved') cloud.lastError = '';
  renderCloudStatus();
  if (status === 'saved' && previous === 'error') {
    toast('Back in sync. Your ledger is saved to the cloud.', 'success');
  }
}

/* --------------------------------------------------------------- boot and auth */

function startCloudApp() {
  cloud.enabled = true;
  cloud.initialized = false;

  const authMessage = cloudReadAuthError();
  if (!isCloudConfigured()) {
    console.error('[Ledgerwise cloud] Supabase configuration is missing or invalid.');
    showAuthFatal(
      'Cloud sign-in is not connected yet',
      'Supabase credentials have not been configured for this build. If you are the owner, connect the project before sharing this address.',
      { retry: false }
    );
    return;
  }
  if (!window.supabase || typeof window.supabase.createClient !== 'function') {
    showAuthFatal(
      'Secure sign-in could not load',
      'The sign-in library did not load. Check your internet connection or disable a content blocker, then try again.',
      { retry: true }
    );
    return;
  }

  showAuthLoading();
  try {
    cloud.client = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true,
        flowType: 'pkce'
      }
    });
  } catch (err) {
    console.error('[Ledgerwise cloud] Client could not start', err);
    showAuthFatal('Cloud sign-in could not start', 'Please try again in a moment.', { retry: true });
    return;
  }

  bindCloudLifecycle();

  cloud.client.auth.onAuthStateChange((event, session) => {
    if (event === 'PASSWORD_RECOVERY') {
      cloud.recoveryMode = true;
      if (session) { cloud.session = session; cloud.user = session.user; }
      window.setTimeout(() => showAuthPasswordReset(), 0);
      return;
    }
    if (event === 'SIGNED_OUT') {
      cloud.session = null;
      if (!cloud.deleting && !cloud.deleted) window.setTimeout(() => handleCloudSignedOut(), 0);
      return;
    }
    if (!session || !session.user) return;
    cloud.deleted = false;
    cloud.session = session;
    const user = session.user;
    const changedUser = cloud.user && cloud.user.id !== user.id;
    cloud.user = user;
    if (changedUser) {
      cloud.loadedUserId = null;
      cloud.openingUserId = null;
      cloud.revision = 0;
      cloud.hasLedger = false;
      cloudClearLocal();
      state = null;
      if (typeof closeModal === 'function') closeModal();
    }
    if (event === 'SIGNED_IN' || event === 'INITIAL_SESSION' || event === 'USER_UPDATED') {
      if (cloud.loadedUserId !== user.id && cloud.openingUserId !== user.id) {
        window.setTimeout(() => cloudOpenSession(user), 0);
      } else {
        renderCloudStatus();
      }
    }
  });

  cloud.client.auth.getSession().then(({ data, error }) => {
    if (error) {
      console.error('[Ledgerwise cloud] Session could not be read', error);
      showAuthFatal('We couldn’t check your session', 'Check your connection, then try again.', { retry: true });
      return;
    }
    if (data && data.session && data.session.user) {
      cloud.user = data.session.user;
      cloud.session = data.session;
      if (cloud.recoveryMode) {
        showAuthPasswordReset();
      } else {
        cloudOpenSession(data.session.user);
      }
      return;
    }
    if (authMessage) {
      showAuthSignIn(authMessage);
      return;
    }
    if (cloudAuthParamsPresent()) {
      showAuthLoading('Completing your secure sign-in…');
      window.setTimeout(() => {
        if (!cloud.user) showAuthSignIn('The authentication link could not be completed. Please sign in again or request a password reset.');
      }, 7000);
      return;
    }
    showAuthSignIn();
  }).catch((err) => {
    console.error('[Ledgerwise cloud] Session check failed', err);
    showAuthFatal('We couldn’t reach your ledger', 'Check your internet connection, then try again.', { retry: true });
  });

}

async function cloudOpenSession(user) {
  if (!cloud.client || !user) return;
  if (cloud.openingUserId === user.id || cloud.loadedUserId === user.id) return;
  cloud.openingUserId = user.id;
  cloud.user = user;

  const authRoot = document.getElementById('auth-root');
  if (authRoot) authRoot.hidden = false;
  showAuthLoading('Opening your private ledger…');

  try {
    const row = await cloudFetchRow();
    if (!cloud.user || cloud.user.id !== user.id) return;

    if (row) {
      let restored;
      try {
        restored = normaliseState(row.data);
      } catch (err) {
        throw new Error('CLOUD_LEDGER_INVALID');
      }
      cloud.revision = Number(row.revision) || 0;
      cloud.hasLedger = true;
      cloud.lastSync = row.updated_at ? new Date(row.updated_at) : new Date();
      cloud.pending = false;
      cloud.conflict = false;
      cloud.applyingRemote = true;
      cloudStoreLocal(restored);
      cloudWriteMeta();
      cloud.applyingRemote = false;
      cloud.loadedUserId = user.id;
      cloudSetStatus('saved');
      cloudHideAuth();
      cloudCleanUrl();
      enterLedger(restored);
    } else {
      cloud.revision = 0;
      cloud.hasLedger = false;
      cloud.lastSync = null;
      cloud.pending = false;
      cloud.conflict = false;
      cloud.localCandidate = cloudClaimLocal(user);
      if (!cloud.localCandidate) cloudClearLocal();
      cloud.loadedUserId = user.id;
      cloudSetStatus('idle');
      cloudHideAuth();
      cloudCleanUrl();
      enterLedger(null);
    }
  } catch (err) {
    console.error('[Ledgerwise cloud] Ledger could not be opened', err);
    const message = cloudDataErrorText(err);
    cloud.lastError = message;
    cloud.loadedUserId = null;
    showAuthFatal('We couldn’t open your ledger', message, {
      retry: true,
      signOut: !!cloud.user
    });
  } finally {
    cloud.openingUserId = null;
  }
}

async function cloudFetchRow() {
  if (!cloud.client || !cloud.user) throw new Error('CLOUD_NOT_SIGNED_IN');
  const { data, error } = await cloud.client
    .from('ledgers')
    .select('data, revision, updated_at')
    .eq('user_id', cloud.user.id)
    .maybeSingle();
  if (error) throw error;
  return data;
}

/* --------------------------------------------------------------- browser ledger migration */

function cloudClaimLocal(user) {
  let raw = '';
  try { raw = localStorage.getItem(DB_KEY) || ''; } catch (err) { return null; }
  if (!raw || !user) return null;
  const meta = cloudReadMeta();
  if (meta && meta.userId && meta.userId !== user.id) {
    cloudClearLocal();
    return null;
  }
  try {
    return normaliseState(JSON.parse(raw));
  } catch (err) {
    return null;
  }
}

function cloudMigrationBanner() {
  const candidate = cloud.localCandidate;
  if (!candidate || !cloud.user) return '';
  const count = Array.isArray(candidate.transactions) ? candidate.transactions.length : 0;
  return `<div class="cloud-migrate" role="region" aria-label="Ledger found on this device">
    <div class="cloud-migrate-title">${icon('history', 15)}<strong>Ledger found on this device</strong></div>
    <p>${esc(candidate.profile.name || 'Untitled ledger')} · ${esc(candidate.profile.currency)} · ${count} ${plural(count, 'entry', 'entries')}. Add it to your account so this history is not lost.</p>
    <div class="cloud-migrate-actions">
      <button type="button" class="btn btn-secondary btn-sm" data-act="cloud-import-local">Add to my account</button>
      <button type="button" class="link-btn" data-act="cloud-download-local">Download a copy</button>
      <button type="button" class="link-btn" data-act="cloud-dismiss-local">Start blank</button>
    </div>
  </div>`;
}

async function cloudImportLocal() {
  const candidate = cloud.localCandidate;
  if (!candidate || !cloud.user) return;
  const buttons = [...document.querySelectorAll('[data-act="cloud-import-local"]')];
  buttons.forEach((button) => { button.disabled = true; });
  state = candidate;
  cloud.applyingRemote = true;
  logAudit('workspace', 'Imported the ledger from this browser into the cloud account.');
  cloud.applyingRemote = false;
  state.updatedAt = nowISO();
  try {
    await cloudWriteLedger(JSON.stringify(state));
  } catch (err) {
    console.error('[Ledgerwise cloud] Browser ledger import failed', err);
    state = null;
    buttons.forEach((button) => { button.disabled = false; });
    if (err && err.conflict) {
      cloud.conflict = true;
      cloud.pending = true;
      cloudSetStatus('conflict');
      openCloudConflictModal();
      return;
    }
    toast(cloudDataErrorText(err), 'error');
    return;
  }
  cloud.applyingRemote = true;
  cloudStoreLocal(state);
  cloudWriteMeta();
  cloud.applyingRemote = false;
  cloud.localCandidate = null;
  cloud.hasLedger = true;
  cloudSetStatus('saved');
  closeModal();
  showApp();
  applyHash(location.hash);
  syncHash(false);
  renderPage();
  scrollTop();
  toast('Your browser ledger is now saved to your private cloud account.', 'success');
}

function cloudDownloadLocal() {
  const candidate = cloud.localCandidate;
  if (!candidate) return;
  const name = candidate.profile.name ? candidate.profile.name.replace(/[^\w-]+/g, '-').replace(/^-|-$/g, '').toLowerCase() : 'ledgerwise';
  if (downloadFile(`${name || 'ledgerwise'}-browser-backup-${todayISO()}.json`, JSON.stringify(candidate, null, 2), 'application/json')) {
    toast('Browser ledger downloaded.');
  }
}

function cloudDismissLocal() {
  if (!cloud.localCandidate) return;
  cloudArchiveLocalCandidate();
  cloud.localCandidate = null;
  const banner = document.querySelector('.cloud-migrate');
  if (banner) banner.remove();
  toast('Starting blank. A recovery copy of the old browser ledger is kept on this device.', 'info');
  const input = document.getElementById('welcome-name');
  if (input) input.focus({ preventScroll: true });
}

function cloudArchiveLocalCandidate() {
  if (!cloud.localCandidate) return;
  try {
    const raw = localStorage.getItem(DB_KEY);
    if (raw) localStorage.setItem(`${DB_KEY}_recovery_${Date.now()}`, raw);
  } catch (err) { /* storage may be full */ }
  cloud.localCandidate = null;
}

function handleCloudSignedOut() {
  if (cloud.deleting || cloud.deleted) return;
  stopCloudResendTimer();
  if (cloud.timer) {
    window.clearTimeout(cloud.timer);
    cloud.timer = null;
  }
  cloud.session = null;
  cloud.user = null;
  cloud.loadedUserId = null;
  cloud.openingUserId = null;
  cloud.revision = 0;
  cloud.hasLedger = false;
  cloud.pending = false;
  cloud.flushing = null;
  cloud.conflict = false;
  cloud.status = 'idle';
  cloud.lastError = '';
  cloud.lastSync = null;
  cloud.localCandidate = null;
  cloudClearLocal();
  state = null;
  if (typeof closeModal === 'function') closeModal();
  const app = document.getElementById('app');
  const welcome = document.getElementById('welcome-root');
  if (app) app.hidden = true;
  if (welcome) {
    welcome.hidden = true;
    welcome.innerHTML = '';
  }
  showAuthSignIn(cloud.authMessage || 'You’ve been signed out. Enter your email to open your ledger again.');
  cloud.authMessage = '';
}

function cloudHideAuth() {
  stopCloudResendTimer();
  const root = document.getElementById('auth-root');
  if (root) {
    root.hidden = true;
    root.innerHTML = '';
  }
  document.title = `${APP_NAME} — Personal ledger & budget`;
}

function cloudShowSignIn(message) {
  showAuthSignIn(message || '');
}

function cloudErrorTextForAuth(err) {
  const message = String(err && err.message ? err.message : '');
  const status = err && err.status;
  if (status === 429 || /rate limit|too many/i.test(message)) {
    return 'Too many sign-in emails were requested. Wait a few minutes, then try again.';
  }
  if (/email.*invalid|invalid.*email/i.test(message)) {
    return 'That email address does not look right. Check it and try again.';
  }
  if (/signups? not allowed|signup.*disabled/i.test(message)) {
    return 'New account creation is disabled in Supabase. Enable email sign-ups in Authentication settings.';
  }
  if (/password.*(weak|short|characters|length)|weak password/i.test(message)) {
    return 'Choose a stronger password with at least 8 characters.';
  }
  if (/failed to fetch|network|load failed/i.test(message)) {
    return 'We couldn’t reach the cloud. Check your connection and try again.';
  }
  if (/invalid login credentials/i.test(message)) {
    return 'Email or password is incorrect. If this account was created with a magic link, choose “Forgot password?” to set a password first.';
  }
  if (/email not confirmed/i.test(message)) {
    return 'Please confirm your email first. Check your inbox, then sign in with your password.';
  }
  return message || 'Authentication failed. Please try again.';
}

async function submitCloudAuth(form) {
  const email = formValue(form, 'email').trim().toLowerCase();
  const mode = formValue(form, 'authMode') || cloud.authMode || 'login';
  const password = formValue(form, 'password');
  const accepted = formChecked(form, 'terms');
  const submit = form.querySelector('button[type="submit"]');
  if (!cloud.client) { showFormError(form, 'Cloud sign-in is not available.'); return; }
  if (!navigator.onLine) { showFormError(form, 'You appear to be offline. Check your connection and try again.'); return; }
  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) {
    showFormError(form, 'Enter a valid email address.'); return;
  }
  if (mode !== 'forgot' && (!password || password.length < 8)) {
    showFormError(form, 'Use a password with at least 8 characters.'); return;
  }
  if (mode === 'signup' && !accepted) {
    showFormError(form, 'Please confirm you are 18 or older and accept the terms and privacy notice.'); return;
  }
  if (submit) {
    submit.disabled = true;
    submit.textContent = mode === 'signup' ? 'Creating account…' : mode === 'forgot' ? 'Sending reset link…' : 'Signing in…';
  }
  try {
    let result;
    if (mode === 'signup') {
      result = await cloud.client.auth.signUp({
        email,
        password,
        options: {
          emailRedirectTo: cloudRedirectUrl(),
          data: {
            product: 'Ledgerwise',
            terms_version: CLOUD_TERMS_VERSION,
            terms_accepted_at: new Date().toISOString()
          }
        }
      });
      if (result.error) throw result.error;
      cloud.pendingEmail = email;
      if (result.data && result.data.session) {
        cloud.session = result.data.session;
        cloud.user = result.data.user;
        cloud.deleted = false;
        await cloudOpenSession(result.data.user);
      } else {
        showAuthConfirmation(email);
      }
      return;
    }
    if (mode === 'forgot') {
      result = await cloud.client.auth.resetPasswordForEmail(email, {
        redirectTo: cloudRedirectUrl()
      });
      if (result.error) throw result.error;
      cloud.pendingEmail = email;
      showAuthConfirmation(email, '', 'reset');
      return;
    }
    result = await cloud.client.auth.signInWithPassword({ email, password });
    if (result.error) throw result.error;
    if (result.data && result.data.session && result.data.user) {
      cloud.session = result.data.session;
      cloud.user = result.data.user;
      cloud.deleted = false;
      await cloudOpenSession(result.data.user);
    }
  } catch (err) {
    console.error('[Ledgerwise cloud] Password authentication failed', err);
    if (submit) {
      submit.disabled = false;
      submit.innerHTML = `${mode === 'signup' ? 'Create account' : mode === 'forgot' ? 'Send reset link' : 'Sign in'} ${icon('arrow-right', 15)}`;
    }
    const raw = String(err && (err.message || err.msg) || '');
    let message = cloudErrorTextForAuth(err);
    if (/invalid login credentials/i.test(raw)) message = 'Email or password is incorrect. If this account was created with a magic link, choose “Forgot password?” to set a password first.';
    else if (/email not confirmed/i.test(raw)) message = 'Please confirm your email first. Check your inbox, then sign in with your password.';
    else if (/already registered|user already registered/i.test(raw)) message = 'An account already exists for this email. Sign in, or choose “Forgot password?” if you have not set a password yet.';
    else if (/password should be at least/i.test(raw)) message = 'Use a password with at least 8 characters.';
    showFormError(form, message);
  }
}

async function submitCloudPasswordReset(form) {
  const password = formValue(form, 'password');

/* --------------------------------------------------------------- sync */

function cloudLedgerChanged() {
  if (!cloud.enabled || !cloud.user || !cloud.loadedUserId || cloud.applyingRemote) return false;
  cloud.pending = true;
  if (cloud.status === 'conflict') {
    renderCloudStatus();
    return true;
  }
  if (cloud.flushing) {
    renderCloudStatus();
    return true;
  }
  cloudSetStatus('pending');
  if (cloud.timer) window.clearTimeout(cloud.timer);
  cloud.timer = window.setTimeout(() => {
    cloud.timer = null;
    cloudFlush();
  }, CLOUD_SYNC_DELAY);
  return true;
}

async function cloudWriteLedger(snapshot) {
  if (!cloud.client || !cloud.user) throw new Error('CLOUD_NOT_SIGNED_IN');
  if (new Blob([snapshot]).size > CLOUD_MAX_BYTES) {
    const err = new Error('Your ledger is too large for one cloud save. Export a JSON backup now.');
    err.code = 'LEDGER_TOO_LARGE';
    throw err;
  }
  const data = JSON.parse(snapshot);
  const expected = cloud.revision;

  if (expected === 0) {
    const { data: inserted, error } = await cloud.client
      .from('ledgers')
      .insert({ user_id: cloud.user.id, data, revision: 1 })
      .select('revision, updated_at')
      .single();
    if (error) {
      if (error.code === '23505') throw cloudConflictError(error);
      throw error;
    }
    cloud.revision = Number(inserted.revision) || 1;
    cloud.hasLedger = true;
    cloud.lastSync = inserted.updated_at ? new Date(inserted.updated_at) : new Date();
    cloudWriteMeta();
    return;
  }

  const { data: updated, error } = await cloud.client
    .from('ledgers')
    .update({ data, revision: expected + 1 })
    .eq('user_id', cloud.user.id)
    .eq('revision', expected)
    .select('revision, updated_at');
  if (error) throw error;
  if (!Array.isArray(updated) || updated.length === 0) throw cloudConflictError();
  cloud.revision = Number(updated[0].revision) || expected + 1;
  cloud.hasLedger = true;
  cloud.lastSync = updated[0].updated_at ? new Date(updated[0].updated_at) : new Date();
  cloudWriteMeta();
}

function cloudConflictError(cause) {
  const err = new Error('CLOUD_CONFLICT');
  err.conflict = true;
  if (cause) err.cause = cause;
  return err;
}

async function cloudFlush() {
  if (!cloud.user || !state || !cloud.client) return false;
  if (cloud.status === 'conflict') return false;

  if (cloud.flushing) {
    cloud.pending = true;
    try { await cloud.flushing; } catch (err) { /* reported by the owning call */ }
    if (cloud.timer) {
      window.clearTimeout(cloud.timer);
      cloud.timer = null;
    }
    return cloudFlush();
  }

  if (cloud.timer) {
    window.clearTimeout(cloud.timer);
    cloud.timer = null;
  }
  cloud.pending = false;
  cloudSetStatus('saving');
  const snapshot = JSON.stringify(state);

  const task = (async () => {
    try {
      await cloudWriteLedger(snapshot);
      return true;
    } catch (err) {
      console.error('[Ledgerwise cloud] Save failed', err);
      if (err && err.conflict) {
        cloud.conflict = true;
        cloud.pending = true;
        cloudSetStatus('conflict');
        openCloudConflictModal();
      } else {
        cloud.pending = true;
        cloudSetStatus('error', cloudDataErrorText(err));
      }
      return false;
    }
  })();

  cloud.flushing = task;
  const ok = await task;
  cloud.flushing = null;

  if (ok) {
    if (cloud.pending && cloud.timer === null && cloud.status !== 'conflict') {
      cloud.pending = false;
      cloudSetStatus('saving');
      cloud.timer = window.setTimeout(() => {
        cloud.timer = null;
        cloudFlush();
      }, 150);
    } else if (!cloud.pending) {
      cloudSetStatus('saved');
    }
  }
  return ok;
}

function cloudDataErrorText(err) {
  const code = err && err.code;
  const message = String(err && err.message ? err.message : '');
  if (err && err.conflict) return 'This ledger changed somewhere else. Review the two copies before saving.';
  if (code === 'LEDGER_TOO_LARGE') return message;
  if (code === 'CLOUD_NOT_SIGNED_IN') return 'Your session has ended. Sign in again to continue syncing.';
  if (code === 'CLOUD_LEDGER_INVALID') return 'The cloud copy could not be read, so it was left untouched. Contact support before making changes.';
  if (code === '42P01' || /relation .*ledgers.* does not exist/i.test(message)) {
    return 'Cloud storage has not been set up for this project yet.';
  }
  if (code === '42501' || /row-level security/i.test(message)) {
    return 'Your account could not access this ledger. Sign out and sign in again.';
  }
  if (code === '23514' || /check constraint/i.test(message)) {
    return 'The cloud rejected this ledger because it is too large or not a valid ledger document. Export a backup now.';
  }
  if (!navigator.onLine || /failed to fetch|networkerror|load failed/i.test(message)) {
    return 'You are offline or the cloud could not be reached. Your changes are still in this browser.';
  }
  return 'Cloud save failed. Your changes are still in this browser; try again.';
}

function cloudSyncNow() {
  if (!cloud.user) {
    cloudShowSignIn('Sign in to continue.');
    return;
  }
  if (cloud.conflict) {
    openCloudConflictModal();
    return;
  }
  if (cloud.flushing) {
    toast('A cloud save is already in progress.', 'info');
    return;
  }
  if (!cloud.pending && cloud.status === 'saved') {
    toast('Everything is saved to the cloud.', 'info');
    return;
  }
  cloudFlush().then((ok) => {
    if (ok) toast('Saved to your private cloud ledger.', 'success');
    else if (!cloud.conflict) toast(cloud.lastError || 'Still not saved. Check your connection.', 'error');
  });
}

function cloudRetry() {
  if (!cloud.client) {
    window.location.reload();
    return;
  }
  if (!cloud.user) {
    if (cloud.authMessage) showAuthSignIn(cloud.authMessage);
    else showAuthSignIn();
    return;
  }
  if (cloud.status === 'error' && cloud.loadedUserId === cloud.user.id) {
    cloudSyncNow();
    return;
  }
  cloud.loadedUserId = null;
  cloud.openingUserId = null;
  cloudOpenSession(cloud.user);
}

  openModal({

      <button type="button" class="btn btn-primary" data-act="cloud-conflict-reload">Load cloud version</button>`
  });

async function cloudResolveConflict() {
  if (!cloud.user) return;
  const root = document.querySelector('#modal-root .modal-foot');
  if (root) root.querySelectorAll('button').forEach((button) => { button.disabled = true; });
  try {
    const row = await cloudFetchRow();
    if (!row) {
      throw new Error('No cloud ledger was found. Reload the page to start again.');
    }
    let restored;
    try {
      restored = normaliseState(row.data);
    } catch (err) {
      throw new Error('The cloud copy could not be read. Nothing was replaced.');
    }
    cloud.applyingRemote = true;
    state = restored;
    cloud.revision = Number(row.revision) || 0;
    cloud.lastSync = row.updated_at ? new Date(row.updated_at) : new Date();
    cloud.hasLedger = true;
    cloud.pending = false;
    cloud.conflict = false;
    cloudStoreLocal(restored);
    cloudWriteMeta();
    cloud.applyingRemote = false;
    cloud.loadedUserId = cloud.user.id;
    closeModal();
    showApp();
    applyHash(location.hash);
    syncHash(false);
    renderPage();
    cloudSetStatus('saved');
    toast('Cloud version loaded. Your unsaved device copy was not uploaded.', 'info');
  } catch (err) {
    console.error('[Ledgerwise cloud] Conflict reload failed', err);
    toast(err.message || 'The cloud version could not be loaded. Try again.', 'error');
    if (root) root.querySelectorAll('button').forEach((button) => { button.disabled = false; });
  }
}

/* --------------------------------------------------------------- sign out and deletion */

async function cloudRequestSignOut() {
  if (cloud.deleting) return;
  if (!cloud.user) {
    showAuthSignIn();
    return;
  }
  if (cloud.conflict) {
    openCloudConflictModal();
    return;
  }
  if (cloud.pending || cloud.flushing) {
    const ok = await cloudFlush();
    if (!ok) {
      toast(cloud.lastError || 'Your latest changes are not in the cloud yet. Try Save now before signing out.', 'error');
      return;
    }
  }
  cloud.authMessage = 'You’re signed out. Your cloud ledger is safe.';
  try {
    const { error } = await cloud.client.auth.signOut();
    if (error) throw error;
  } catch (err) {
    console.error('[Ledgerwise cloud] Sign out failed', err);
    toast('Could not sign out. Check your connection and try again.', 'error');
  }
}

      <button type="submit" class="btn btn-danger" form="cloud-delete-form">Delete account &amp; ledger</button>`
  });
}

async function submitCloudDelete(form) {
  const confirmation = formValue(form, 'confirmation').trim().toUpperCase();
  if (confirmation !== 'DELETE') {
    showFormError(form, 'Type DELETE exactly to confirm.');
    return;
  }
  if (!cloud.client || !cloud.user) {
    showFormError(form, 'You are no longer signed in. Reload the page and try again.');
    return;
  }
  const submit = document.querySelector('button[form="cloud-delete-form"]');
  if (submit) {
    submit.disabled = true;
    submit.textContent = 'Deleting your account…';
  }
  if (cloud.timer) {
    window.clearTimeout(cloud.timer);
    cloud.timer = null;
  }
  cloud.pending = false;
  cloud.deleting = true;
  try {
    const { error } = await cloud.client.rpc('delete_my_account');
    if (error) throw error;
  } catch (err) {
    console.error('[Ledgerwise cloud] Account deletion failed', err);
    cloud.deleting = false;
    if (submit) {
      submit.disabled = false;
      submit.textContent = 'Delete account & ledger';
    }
    const missing = err && (err.code === '42883' || /function .*delete_my_account.* does not exist/i.test(String(err.message || '')));
    showFormError(form, missing
      ? 'Account deletion is not available yet. Please contact support.'
      : 'Deletion could not be completed. Nothing else was changed. Check your connection and try again.');
    return;
  }

  try { await cloud.client.auth.signOut({ scope: 'local' }); } catch (err) { /* the account is already gone */ }
  cloudClearLocal();
  cloud.user = null;
  cloud.session = null;
  cloud.loadedUserId = null;
  cloud.revision = 0;
  cloud.hasLedger = false;
  cloud.pending = false;
  cloud.conflict = false;
  cloud.localCandidate = null;
  state = null;
  closeModal();
  const app = document.getElementById('app');
  const welcome = document.getElementById('welcome-root');
  if (app) app.hidden = true;
  if (welcome) {
    welcome.hidden = true;
    welcome.innerHTML = '';
  }
  cloud.deleted = true;
  showAuthDeleted();
  cloud.deleting = false;
}

async function cloudDeleteLedger() {
  if (!cloud.client || !cloud.user) throw new Error('Sign in again before erasing your ledger.');
  if (cloud.timer) {
    window.clearTimeout(cloud.timer);
    cloud.timer = null;
  }
  if (cloud.flushing) {
    try { await cloud.flushing; } catch (err) { /* deletion is explicit */ }
  }
  const { error } = await cloud.client
    .from('ledgers')
    .delete()
    .eq('user_id', cloud.user.id);
  if (error) {
    console.error('[Ledgerwise cloud] Ledger deletion failed', error);
    throw new Error('The cloud ledger could not be erased. Nothing was changed.');
  }
  cloud.revision = 0;
  cloud.hasLedger = false;
  cloud.lastSync = null;
  cloud.pending = false;
  cloud.conflict = false;
  cloud.localCandidate = null;
  cloudClearLocal();
  cloudSetStatus('idle');
}

/* --------------------------------------------------------------- lifecycle */

function bindCloudLifecycle() {
  if (cloud.initialized) return;
  cloud.initialized = true;

  window.addEventListener('online', () => {
    if (!cloud.user) return;
    if (cloud.status === 'error' || cloud.pending) {
      toast('Back online. Saving your ledger…', 'info');
      cloudFlush();
    }
  });

  window.addEventListener('offline', () => {
    if (!cloud.user) return;
    if (cloud.pending || cloud.flushing) {
      cloud.lastError = 'You are offline. Changes are kept in this browser and will sync when you reconnect.';
      renderCloudStatus();
    }
  });

  window.addEventListener('storage', (event) => {
    if (event.key !== CLOUD_META_KEY || !event.newValue || !cloud.user) return;
    try {
      const meta = JSON.parse(event.newValue);
      if (meta && meta.userId === cloud.user.id && Number(meta.revision) > cloud.revision) {
        if (cloud.timer) {
          window.clearTimeout(cloud.timer);
          cloud.timer = null;
        }
        cloud.conflict = true;
        cloud.pending = true;
        cloudSetStatus('conflict');
        renderCloudStatus();
        if (document.visibilityState === 'visible' && !document.getElementById('modal-layer')) {
          openCloudConflictModal();
        }
      }
    } catch (err) { /* malformed companion data is ignored */ }
  });

  window.addEventListener('beforeunload', (event) => {
    if (cloud.user && (cloud.pending || cloud.flushing || cloud.status === 'conflict')) {
      event.preventDefault();
      event.returnValue = '';
    }
  });

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && cloud.user && cloud.pending && !cloud.flushing) {
      cloudFlush();
    }
  });
}

/* --------------------------------------------------------------- notices */

function toast(message, tone = 'success') {
  const root = document.getElementById('toast-root');
  if (!root || !message) return;
  const node = document.createElement('div');
  node.className = `toast ${tone}`;
  const iconName = tone === 'error' ? 'alert' : tone === 'info' ? 'info' : 'check-circle';
  node.innerHTML = `${icon(iconName, 15)}<span>${esc(message)}</span>`;
  root.appendChild(node);
  setTimeout(() => {
    node.style.transition = 'opacity .2s var(--ease), transform .2s var(--ease)';
    node.style.opacity = '0';
    node.style.transform = 'translateY(6px)';
    setTimeout(() => node.remove(), 240);
  }, 3600);
}

function scrollTop() {
  window.scrollTo({ top: 0, left: 0, behavior: 'auto' });
}

/* --------------------------------------------------------------- routing */

function hashFor() {
  if (ui.page === 'plan' && ui.planTab !== 'bills') return `#plan/${ui.planTab}`;
  return `#${ui.page}`;
}

function applyHash(hash) {
  const raw = String(hash || '').replace(/^#\/?/, '');
  const [pageRaw, tabRaw] = raw.split('/');
  const page = PAGES.includes(pageRaw) ? pageRaw : 'overview';
  ui.page = page;
  if (page === 'plan') {
    ui.planTab = PLAN_TABS.includes(tabRaw)
      ? tabRaw
      : (PLAN_TABS.includes(ui.planTab) ? ui.planTab : 'bills');
  }
}

function syncHash(push) {
  const hash = hashFor();
  if (location.hash === hash) {
    lastHash = hash;
    return;
  }
  try {
    if (push) history.pushState(null, '', hash);
    else history.replaceState(null, '', hash);
  } catch (err) {
    location.hash = hash;
  }
  lastHash = hash;
}

function navigate(page, tab, opts = {}) {
  if (!PAGES.includes(page)) page = 'overview';
  let nextTab = ui.planTab;
  if (page === 'plan') {
    nextTab = PLAN_TABS.includes(tab)
      ? tab
      : (PLAN_TABS.includes(ui.planTab) ? ui.planTab : 'bills');
  }
  const changed = ui.page !== page || (page === 'plan' && ui.planTab !== nextTab);
  ui.page = page;
  if (page === 'plan') ui.planTab = nextTab;
  closeNav();
  syncHash(opts.push !== false);
  renderPage();
  if (changed) {
    scrollTop();
    const view = document.getElementById('view');
    if (view) {
      try { view.focus({ preventScroll: true }); } catch (err) { /* focus is optional */ }
    }
  }
}

function handleRouteChange() {
  if (location.hash === lastHash) return;
  lastHash = location.hash;
  if (!state) return;
  const before = `${ui.page}/${ui.planTab}`;
  applyHash(location.hash);
  if (`${ui.page}/${ui.planTab}` === before) return;
  closeNav();
  renderPage();
  scrollTop();
}

function clearRouteHash() {
  try {
    history.replaceState(null, '', location.href.split('#')[0]);
  } catch (err) {
    try { location.hash = ''; } catch (e) { /* ignore */ }
  }
  lastHash = location.hash;
}

/* --------------------------------------------------------------- small helpers */

function formControl(form, name) {
  return form && form.elements ? form.elements.namedItem(name) : null;
}

function formValue(form, name) {
  const control = formControl(form, name);
  if (!control) return '';
  return control.value == null ? '' : String(control.value);
}

function formChecked(form, name) {
  const control = formControl(form, name);
  return !!(control && control.checked);
}

function validISODate(value) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(String(value || ''))) return false;
  const date = parseDate(value);
  return isoFromDate(date) === value;
}

function showFormError(form, message) {
  const text = String(message || 'Something needs your attention.');
  const node = form ? form.querySelector('#form-error, #welcome-error') : null;
  if (node) {
    node.textContent = text;
    node.classList.add('show');
    if (typeof node.scrollIntoView === 'function') node.scrollIntoView({ block: 'nearest' });
  }
  toast(text, 'error');
}

function showConfirmError(message) {
  const text = String(message || 'Something needs your attention.');

  if (node) {
    node.textContent = text;

function persist(action, text) {

  return saveState();
}

function refresh(message, tone) {
  if (!state) return;
  renderPage();

function submitForm(form) {
  if (!form) return;
  if (typeof form.requestSubmit === 'function') form.requestSubmit();
  else form.dispatchEvent(new Event('submit', { bubbles: true, cancelable: true }));
}

function categoryInUse(id) {
  if (!id || !state) return false;
  return state.transactions.some((tx) => tx.entries.some((entry) => entry.categoryId === id))
    || state.budgets.some((budget) => budget.categoryId === id)
    || state.recurring.some((rule) => rule.categoryId === id);
}

function accountRuleUseCount(id) {
  if (!id || !state) return 0;
  return state.recurring.filter((rule) => rule.active
    && (rule.accountId === id || rule.toAccountId === id)).length;
}

/* --------------------------------------------------------------- downloads */

function downloadFile(filename, content, mime) {
  try {
    const blob = new Blob([content], { type: mime || 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = filename;
    link.rel = 'noopener';
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
    return true;
  } catch (err) {
    toast('The download could not be started.', 'error');
    return false;
  }
}

function csvCell(value) {
  let text = String(value == null ? '' : value);
  // Spreadsheet apps can execute text beginning with these characters.
  if (/^[=+\-@\t\r]/.test(text)) text = `'${text}`;
  if (/[",\r\n]/.test(text)) return `"${text.replace(/"/g, '""')}"`;
  return text;
}

function csvNumber(value) {
  return { numeric: true, value: String(value) };
}

function csvRow(cells) {
  return cells.map((cell) => {
    if (cell && typeof cell === 'object' && cell.numeric) return String(cell.value);
    return csvCell(cell);
  }).join(',');
}

function csvAmount(cents) {
  return (toInt(cents, 0) / 100).toFixed(2);
}

function txCsvStatus(tx) {
  if (tx.reversedBy) return 'Reversed';
  if (tx.type === 'reversal') return 'Correction';
  if (tx.type === 'opening' || tx.type === 'adjustment') return 'System';
  if (tx.replaces) return 'Corrected';
  return 'Posted';
}

function exportJson() {
  if (!state) return;
  try {
    state.meta.lastBackupAt = nowISO();
    logAudit('export', 'JSON backup exported.');
    saveState();
    const content = JSON.stringify(state, null, 2);
    if (downloadFile(`ledgerwise-backup-${todayISO()}.json`, content, 'application/json;charset=utf-8')) {
      toast('JSON backup downloaded.');
    }
    if (ui.page === 'settings') renderPage();
  } catch (err) {
    toast('The backup could not be created.', 'error');
  }
}

function exportTransactionsCsv() {
  if (!state) return;
  try {
    const header = ['Date', 'Reference', 'Type', 'Description', 'Payee', 'Category', 'Account', 'To account', 'Amount', 'Currency', 'Status', 'Correction of', 'Notes', 'Recorded at'];
    const rows = [csvRow(header)];
    const transactions = state.transactions.slice()
      .sort((a, b) => a.date.localeCompare(b.date) || String(a.ref).localeCompare(String(b.ref)));
    transactions.forEach((tx) => {
      const from = tx.accountId ? accountById(tx.accountId) : null;
      const to = tx.toAccountId ? accountById(tx.toAccountId) : null;
      rows.push(csvRow([
        tx.date,
        tx.ref,
        txKindLabel(tx),
        tx.description,
        tx.payee,
        tx.categoryId ? categoryById(tx.categoryId).name : '',
        from ? from.name : '',
        to ? to.name : '',
        csvNumber(csvAmount(tx.amountCents)),
        state.profile.currency,
        txCsvStatus(tx),
        tx.reverses || tx.replaces || '',
        tx.notes,
        tx.createdAt
      ]));
    });
    logAudit('export', 'Transactions CSV exported.');
    saveState();
    if (downloadFile(`ledgerwise-transactions-${todayISO()}.csv`, `\uFEFF${rows.join('\r\n')}\r\n`, 'text/csv;charset=utf-8')) {
      toast('Transactions CSV downloaded.');
    }
    if (ui.page === 'settings') renderPage();
  } catch (err) {
    toast('The CSV could not be created.', 'error');
  }
}

function exportReportCsv() {
  if (!state) return;
  try {
    const month = ui.month;
    const totals = monthTotals(month);
    const budget = budgetTotals(month);
    const budgetMap = budgetsForMonth(month);
    const savingsRate = totals.income ? safePct(totals.net, totals.income) : 0;
    const lines = [];
    lines.push(csvRow(['Ledgerwise monthly report', monthLabel(month)]));
    lines.push(csvRow(['Generated', dateInputLabel(todayISO())]));
    lines.push(csvRow(['Currency', state.profile.currency]));
    lines.push('');
    lines.push(csvRow(['Summary', 'Amount']));
    lines.push(csvRow(['Income', csvNumber(csvAmount(totals.income))]));
    lines.push(csvRow(['Spending', csvNumber(csvAmount(totals.expense))]));
    lines.push(csvRow(['Kept', csvNumber(csvAmount(totals.net))]));
    lines.push(csvRow(['Savings rate %', csvNumber(savingsRate.toFixed(1))]));
    lines.push(csvRow(['Budgeted spending', csvNumber(csvAmount(budget.spent))]));
    lines.push(csvRow(['Unbudgeted spending', csvNumber(csvAmount(budget.unbudgetedTotal))]));
    lines.push('');
    lines.push(csvRow(['Category', 'Type', 'Amount', 'Share of type %', 'Budget', 'Remaining']));
    const categoryRows = [];
    state.categories.forEach((category) => {
      const amount = totals.byCategory.get(category.id) || 0;
      const limit = budgetMap.get(category.id) || 0;
      if (!amount && !limit) return;
      categoryRows.push({ category, amount, limit });
    });
    categoryRows.sort((a, b) => {
      if (a.category.type !== b.category.type) return a.category.type === 'expense' ? -1 : 1;
      return b.amount - a.amount || a.category.name.localeCompare(b.category.name);
    });
    categoryRows.forEach((row) => {
      const category = row.category;
      const base = category.type === 'income' ? totals.income : totals.expense;
      const share = safePct(row.amount, base);
      const remaining = category.type === 'expense' && row.limit ? row.limit - row.amount : '';
      lines.push(csvRow([
        category.name,
        category.type === 'income' ? 'Income' : 'Expense',
        csvNumber(csvAmount(row.amount)),
        csvNumber(share.toFixed(1)),
        row.limit ? csvNumber(csvAmount(row.limit)) : '',
        remaining === '' ? '' : csvNumber(csvAmount(remaining))
      ]));
    });
    lines.push('');
    lines.push(csvRow(['Notes']));
    lines.push(csvRow(['Transfers, opening balances and equity adjustments are excluded from income and spending.']));
    lines.push(csvRow(['Corrections reverse the original on its own date so periods stay reproducible.']));
    logAudit('export', `Report CSV exported for ${monthLabel(month)}.`);
    saveState();
    if (downloadFile(`ledgerwise-report-${month}.csv`, `\uFEFF${lines.join('\r\n')}\r\n`, 'text/csv;charset=utf-8')) {
      toast('Monthly report downloaded.');
    }
  } catch (err) {
    toast('The report could not be created.', 'error');
  }
}

  ignore: ['running balance', 'closing balance', 'opening balance', 'balance brought forward', 'balance c/f', 'balance', 'fee', 'tax', 'commission', 'currency', 'folio', 'cheque']
};

const IMPORT_CATEGORY_ALIASES = {
  cat_rent: ['rent', 'house rent'],
  cat_utilities: ['kplc', 'electricity', 'water', 'token', 'utility'],
  cat_groceries: ['carrefour', 'naivas', 'quickmart', 'chandarria', 'grocery', 'supermarket', 'market'],
  cat_eating: ['restaurant', 'cafe', 'java', 'artcaffe', 'kfc', 'mcdo', 'pizza', 'eating', 'food'],
  cat_transport: ['matatu', 'taxi', 'uber', 'bolt', 'fuel', 'petrol', 'diesel', 'shell', 'total', 'soco', 'npc', 'bus', 'transnet', 'parking'],
  cat_airtime: ['safaricom', 'airtime', 'topup', 'top up', 'data bundle', 'bundles', 'mtn', 'ahoyk', 'tikus'],
  cat_school: ['school', 'fees', 'college', 'university', 'tuition'],
  cat_health: ['pharmacy', 'clinic', 'hospital', 'medical', 'chemist'],
  cat_fees: ['annual fee', 'sms charge', 'withdrawal fee', 'mcb fee', 'charges', 'stamp duty'],
  cat_business: ['fundingpips', 'goat', 'forex', 'propfirm', 'trading'],
  cat_subscriptions: ['netflix', 'showmax', 'youtube', 'spotify', 'subscription', 'dstv'],
  cat_giving: ['donation', 'harambee', 'offer'],
  cat_salary: ['salary', 'payroll', 'wage'],
  cat_freelance: ['invoice', 'client payment', 'consultancy'],
  cat_gifts_received: ['gift', 'mother', 'father', 'sent you money', 'sent to you']
};

const IMPORT_MONTHS = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, oct: 10, nov: 11, dec: 12 };

function impSel(value, selected) {
  return String(value) === String(selected) ? ' selected' : '';
}

function headerKey(text) {
  return String(text || '').toLowerCase().replace(/[ː:]/g, '').replace(/[^a-z0-9/]+/g, ' ').trim();
}

function scoreHeaderCell(cell, words) {
  const key = headerKey(cell);
  if (!key) return 0;
  let best = 0;
  for (const word of words) {
    if (key === word) best = Math.max(best, 12);
    else if (key.startsWith(word)) best = Math.max(best, 8);
    else if (key.includes(word)) best = Math.max(best, 4);
  }
  return best;
}

function isIgnoredHeader(cell) {
  const key = headerKey(cell);
  return IMPORT_HEADERS.ignore.some((word) => key === word || key.includes(word));
}

function dataCells(matrix, headerIndex) {
  return matrix.slice(headerIndex + 1).filter((row) => row.some((c) => String(c).trim()));
}

function columnRatio(matrix, headerIndex, index, tester) {
  const rows = dataCells(matrix, headerIndex).slice(0, 30);
  if (!rows.length || index < 0) return 0;
  let hit = 0;
  rows.forEach((row) => {
    if (tester(String(row[index] == null ? '' : row[index]))) hit += 1;
  });
  return hit / rows.length;
}

function pickColumn(candidates, words, used) {
  let best = { index: null, score: 0 };
  candidates.forEach((c) => {
    if (c.index == null || used.has(c.index)) return;
    if (isIgnoredHeader(c.cell)) return;
    const base = scoreHeaderCell(c.cell, words);
    // The header has to name the field; the column’s contents only break ties between plausible headers.
    if (!base) return;
    if (base < 12 && !c.bonus) return;
    const score = base + (c.bonus || 0);
    if (score > best.score) best = { index: c.index, score };
  });
  if (best.index != null) used.add(best.index);
  return best.index;
}

function mapHeaderCells(matrix, headerIndex) {
  const cells = matrix[headerIndex] || [];
  const used = new Set();
  const take = (words, tester) => {
    const candidates = cells.map((cell, index) => ({
      index,
      cell: String(cell || ''),
      bonus: tester ? Math.round(columnRatio(matrix, headerIndex, index, tester) * 8) : 0
    }));
    return pickColumn(candidates, words, used);
  };
  const date = take(IMPORT_HEADERS.date, looksLikeStatementDate);
  const out = take(IMPORT_HEADERS.out, looksLikeStatementAmount);
  const inc = take(IMPORT_HEADERS.inc, looksLikeStatementAmount);
  const amount = out == null && inc == null ? take(IMPORT_HEADERS.amount, looksLikeStatementAmount) : null;
  const description = take(IMPORT_HEADERS.description, (v) => !!v.trim() && !looksLikeStatementAmount(v));
  const sign = take(IMPORT_HEADERS.sign);
  const payee = take(IMPORT_HEADERS.payee);
  return { date, out, inc, amount, description, sign, payee, used: [...used] };
}

function guessColumns(matrix) {
  const width = matrix.reduce((max, row) => Math.max(max, row.length), 0);
  const used = new Set();
  const rank = (tester, floor) => {
    let best = { index: null, ratio: 0 };
    for (let i = 0; i < width; i += 1) {
      if (used.has(i)) continue;
      const ratio = columnRatio(matrix, -1, i, tester);
      if (ratio > best.ratio) best = { index: i, ratio };
    }
    if (best.index == null || best.ratio < floor) return null;
    used.add(best.index);
    return best.index;
  };
  const isText = (v) => !!v.trim() && !looksLikeStatementAmount(v) && !looksLikeStatementDate(v);
  const date = rank(looksLikeStatementDate, 0.5);
  const first = rank(looksLikeStatementAmount, 0.5);
  const second = rank(looksLikeStatementAmount, 0.5);
  const pair = first != null && second != null;
  return {
    date,
    out: pair ? first : null,
    inc: pair ? second : null,
    amount: pair ? null : first,
    sign: null,
    payee: null,
    description: rank(isText, 0.4),
    used: [...used]
  };
}

function findImportHeader(matrix) {
  const limit = Math.min(matrix.length, 15);
  let best = { index: -1, score: -1, map: null };
  for (let i = 0; i < limit; i += 1) {
    const cells = matrix[i].map((c) => String(c || '').trim());
    if (!cells.some(Boolean)) continue;
    const map = mapHeaderCells(matrix, i);
    let score = map.used.length * 3;
    const moneyish = cells.filter((c) => looksLikeStatementAmount(c)).length;
    if (moneyish > cells.length / 2) score -= 6;
    if (score > best.score) best = { index: i, score, map };
  }
  if (best.index >= 0 && best.score >= 6) return { index: best.index, map: best.map };
  return { index: -1, map: guessColumns(matrix) };
}

/* ---------- field parsers ---------- */

function looksLikeStatementDate(value) {
  return parseStatementDate(value) != null;
}

function parseStatementDate(raw) {
  const text = String(raw == null ? '' : raw).trim().replace(/^['"]|['"]$/g, '');
  if (!text) return null;
  const isoParts = (y, m, d) => {
    if (!Number.isFinite(y) || !Number.isFinite(m) || !Number.isFinite(d)) return null;
    if (y < 1900 || y > 2100 || m < 1 || m > 12 || d < 1 || d > 31) return null;
    return `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
  };
  const monthFromName = (word) => {
    const key = String(word || '').toLowerCase().slice(0, 3);
    return IMPORT_MONTHS[key] || null;
  };
  let m = text.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/);
  if (m) return isoParts(+m[1], +m[2], +m[3]);
  m = text.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})/);
  if (m) {
    let a = +m[1];
    let b = +m[2];
    let y = +m[3];
    if (y < 100) y += y <= 30 ? 2000 : 1900;
    if (a > 31 || b > 31) return null;
    // Day first is the Kenyan convention; only swap when the second part cannot be a month.
    return b > 12 ? isoParts(y, a, b) : isoParts(y, b, a);
  }
  m = text.match(/^(\d{1,2})[-\s]([A-Za-z]{3,9})[-\s,](\d{2,4})/);
  if (m) {
    let y = +m[3];
    if (y < 100) y += y <= 30 ? 2000 : 1900;
    return isoParts(y, monthFromName(m[2]), +m[1]);
  }
  m = text.match(/^([A-Za-z]{3,9})[-\s](\d{1,2}),?\s*(\d{4})/);
  if (m) return isoParts(+m[3], monthFromName(m[1]), +m[2]);
  if (/^\d{5}(\.\d+)?$/.test(text)) {
    const days = Number(text);
    const d = new Date(Date.UTC(1899, 11, 30) + Math.floor(days) * 86400000);
    return isoParts(d.getUTCFullYear(), d.getUTCMonth() + 1, d.getUTCDate());
  }
  const native = new Date(text);
  if (!Number.isNaN(native.getTime()) && /\d{4}/.test(text)) {
    return isoParts(native.getFullYear(), native.getMonth() + 1, native.getDate());
  }
  return null;
}

function looksLikeStatementAmount(value) {
  return parseStatementAmount(value) != null;
}

function parseStatementAmount(raw) {
  let text = String(raw == null ? '' : raw).trim().replace(/^['"]|['"]$/g, '');
  if (!text) return null;
  if (/\d{1,4}[/.-]\d{1,2}[/.-]\d{1,4}/.test(text)) return null;
  let sign = 1;
  if (/^\(.*\)$/.test(text)) {
    sign = -1;
    text = text.slice(1, -1);
  }
  text = text.replace(/[^\d.,\-+]/g, '');
  if (text.startsWith('-')) { sign = -1; text = text.slice(1); }
  else if (text.startsWith('+')) text = text.slice(1);
  if (!text || /[+-]/.test(text)) return null;
  const digitsOnly = text.replace(/\D/g, '');
  if (!digitsOnly || digitsOnly.length > 14) return null;
  const lastComma = text.lastIndexOf(',');
  const lastDot = text.lastIndexOf('.');
  if (lastComma > -1 && lastDot > -1) {
    const cut = Math.max(lastComma, lastDot);
    const frac = text.slice(cut + 1).replace(/\D/g, '');
    const whole = text.slice(0, cut).replace(/\D/g, '');
    text = `${whole || '0'}.${frac.slice(0, 2)}`;
  } else if (lastComma > -1) {
    const frac = text.slice(lastComma + 1);
    const digits = frac.replace(/\D/g, '');
    const groups = text.split(',').length;
    const thousands = digits.length === 3 && groups > 1 && text.slice(0, lastComma).replace(/\D/g, '').length <= 9;
    text = thousands
      ? text.replace(/,/g, '')
      : `${text.slice(0, lastComma).replace(/\D/g, '') || '0'}.${digits.slice(0, 2)}`;
  } else if (lastDot > -1) {
    const parts = text.split('.');
    if (parts.length > 2) text = `${parts.slice(0, -1).join('')}.${parts[parts.length - 1].slice(0, 2)}`;
  }
  const value = Number(text);
  if (!Number.isFinite(value)) return null;
  const cents = Math.round(value * 100);
  if (!Number.isSafeInteger(cents)) return null;
  return cents * sign;
}

function normaliseStatementDescription(text) {
  return String(text || '').replace(/\s+/g, ' ').trim().slice(0, 140);
}

function descriptionFingerprint(text) {
  return String(text || '').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 40);
}

function importKeyFor(accountId, date, cents, description) {
  return `${accountId}|${date}|${Math.abs(cents)}|${descriptionFingerprint(description)}`;
}

function existingImportKeys() {
  const keys = new Set();
  if (!state) return keys;
  state.transactions.forEach((tx) => {
    if (tx.reversedBy) return;
    if (tx.importKey) keys.add(tx.importKey);
    else if (tx.accountId) {
      keys.add(importKeyFor(tx.accountId, tx.date, tx.amountCents, tx.description));
    }
    if (tx.toAccountId) keys.add(importKeyFor(tx.toAccountId, tx.date, tx.amountCents, tx.description));
  });
  return keys;
}

function suggestImportCategory(text, type) {
  const hay = ` ${String(text || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim().split(' ').filter(Boolean).join(' ')} `;
  if (hay.trim().length < 3) return null;
  let best = null;
  let bestLength = 0;
  for (const cat of categoriesOf(type, false)) {
    for (const word of IMPORT_CATEGORY_ALIASES[cat.id] || []) {
      if (word.length > bestLength && hay.includes(` ${word} `)) {
        best = cat;
        bestLength = word.length;
      }
    }
  }
  if (best) return best;
  for (const cat of categoriesOf(type, false)) {
    const words = cat.name.toLowerCase().replace(/[^a-z0-9]+/g, ' ').split(' ').filter((w) => w.length > 3 && w !== 'and');
    if (words.some((word) => hay.includes(` ${word} `))) return cat;
  }
  return null;
}

/* Internal transfers are read straight off the statement: "M-PESA TO M-SHWARI", "M-SHWARI TO
   M-PESA", "TRANSFER TO EQUITY BANK". His own account names and institutions are matched on
   distinctive tokens so the shouty abbreviations work, and tokens the imported account itself
   carries are ignored — Safaricom appears on nearly every M-Pesa line. */
const STATEMENT_STOP_WORDS = ['to', 'from', 'for', 'the', 'and', 'my', 'by', 'via', 'at', 'on', 'ksh', 'amount', 'balance',
  'paid', 'sent', 'received', 'completed', 'transaction', 'withdrawal', 'withdraw', 'deposit', 'transfer', 'payment',
  'purchase', 'buy', 'goods', 'paybill', 'mpesa', 'pesa', 'mobile', 'money', 'bank', 'cash', 'wallet', 'account',
  'savings', 'loan', 'card'];

function flatWords(value) {
  return String(value || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim().split(' ').filter(Boolean);
}

function accountSearchKeys(account) {
  const keys = [];
  [account.name, account.institution].forEach((value) => {
    const words = flatWords(value);
    const flat = words.join(' ');
    if (flat.length >= 4) keys.push(flat);
    words.forEach((token) => {
      if (token.length >= 3 && !STATEMENT_STOP_WORDS.includes(token)) keys.push(token);
    });
  });
  return keys;
}

function importAccountHits(text) {
  const words = ` ${flatWords(text).join(' ')} `;
  if (words.trim().length < 5) return [];
  const targetId = imp ? imp.accountId : '';
  const target = accountById(targetId);
  const blocked = new Set(target ? accountSearchKeys(target) : []);
  const hits = [];
  activeAccounts().forEach((account) => {
    if (!account || account.archived || account.id === targetId) return;
    let score = 0;
    accountSearchKeys(account).forEach((key) => {
      if (blocked.has(key)) return;
      if (words.includes(` ${key} `) && key.length > score) score = key.length;
    });
    if (score) hits.push({ account, score });
  });
  return hits.sort((a, b) => b.score - a.score);
}

function onlyAccountOfType(type) {
  const list = activeAccounts().filter((acc) => acc.type === type && acc.id !== (imp ? imp.accountId : ''));
  return list.length === 1 ? list[0] : null;
}

/* A line that says what it did but not where it went — "CASH withdrawal by agent" — takes the
   single account of that kind if there is exactly one. Two cash wallets means he chooses. */
function importServiceAccount(text, dir) {
  const flat = flatWords(text).join(' ');
  if (dir === 'out' && /withdraw|tombol|atm/.test(flat)) return onlyAccountOfType('cash');
  if (dir === 'in' && /deposit|pay in|cash in|top up/.test(flat)) return onlyAccountOfType('cash');
  if (/bank transfer|to bank|from bank|mpesa to bank|bank to mpesa/.test(flat)) return onlyAccountOfType('bank');
  return null;
}

function suggestImportTransfer(text, dir) {
  const hits = importAccountHits(text).filter((hit) => dir === 'out' || accountNature(hit.account) === 'asset');
  if (hits.length) return hits[0].account;
  return importServiceAccount(text, dir);
}

/* ---------- file reading ---------- */

function splitLineFlat(line, char) {
  let inQuotes = false;
  let count = 0;
  for (let i = 0; i < line.length; i += 1) {
    const ch = line[i];
    if (ch === '"') {
      if (inQuotes && line[i + 1] === '"') i += 1;
      else inQuotes = !inQuotes;
    } else if (ch === char && !inQuotes) count += 1;
  }
  return count;
}

function detectDelimiter(text) {
  const lines = text.split(/\r?\n/).filter((line) => line.trim()).slice(0, 8);
  const candidates = [',', '\t', ';', '|'];
  let best = { char: ',', score: -1 };
  for (const char of candidates) {
    const counts = lines.map((line) => splitLineFlat(line, char));
    const hits = counts.filter((n) => n > 0).length;
    if (!hits) continue;
    const modal = counts.slice().sort((a, b) => a - b)[Math.floor(counts.length / 2)] || 0;
    const consistent = counts.filter((n) => n === modal).length;
    const score = modal * 2 + consistent * 3 + hits;
    if (modal > 0 && score > best.score) best = { char, score };
  }
  return best.char;
}

function parseDelimited(text, delimiter) {
  const rows = [];
  let row = [];
  let field = '';
  let quoted = false;
  let i = 0;
  const pushField = () => { row.push(field.replace(/\r$/, '')); field = ''; };
  const pushRow = () => { pushField(); rows.push(row); row = []; };
  while (i < text.length) {
    const ch = text[i];
    if (quoted) {
      if (ch === '"') {
        if (text[i + 1] === '"') { field += '"'; i += 2; continue; }
        quoted = false;
        i += 1;
        continue;
      }
      field += ch;
      i += 1;
      continue;
    }
    if (ch === '"' && field === '') { quoted = true; i += 1; continue; }
    if (ch === delimiter) { pushField(); i += 1; continue; }
    if (ch === '\r') { i += 1; continue; }
    if (ch === '\n') { pushRow(); i += 1; continue; }
    field += ch;
    i += 1;
  }
  if (field !== '' || row.length) pushRow();
  return rows.map((cells) => cells.map((c) => c.trim()));
}

/* ---------------------------------------------------------------- PDF reader
   Bank and M-Pesa statements arrive as PDFs whose text is stored as custom
   glyph codes, so generic converters lose the payee names. These helpers read
   the file's own ToUnicode tables, which keeps every word intact.            */

function pdfLatin1(bytes) {
  let out = '';
  for (let i = 0; i < bytes.length; i += 8192) {
    out += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
  }
  return out;
}

async function pdfInflate(bytes) {
  if (typeof DecompressionStream !== 'function') return null;
  for (const format of ['deflate', 'deflate-raw']) {
    try {
      const body = await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream(format))).arrayBuffer();
      return new Uint8Array(body);
    } catch (err) { /* the stream may be raw deflate instead */ }
  }
  return null;
}

async function pdfObjects(text, bytes) {
  const objects = {};
  const re = /(\d+)\s+(\d+)\s+obj\b/g;
  let match;
  while ((match = re.exec(text))) {
    const id = match[1];
    const bodyStart = match.index + match[0].length;
    const end = text.indexOf('endobj', bodyStart);
    if (end < 0) continue;
    const body = text.slice(bodyStart, end);
    const streamAt = body.indexOf('stream');
    const entry = { dict: streamAt >= 0 ? body.slice(0, streamAt) : body, data: null };
    if (streamAt >= 0) {
      let start = bodyStart + streamAt + 6;
      if (text[start] === '\r') start += 1;
      if (text[start] === '\n') start += 1;
      let stop = -1;
      const lengthMatch = entry.dict.match(/\/Length\s+(\d+)\b/);
      if (lengthMatch) {
        const guess = start + Number(lengthMatch[1]);
        if (/^\s*endstream/.test(text.slice(guess, guess + 20))) stop = guess;
      }
      if (stop < 0) {
        const relative = text.indexOf('endstream', start);
        if (relative >= 0 && relative <= end + 40) stop = relative;
      }
      if (stop > start) {
        const raw = bytes.subarray(start, stop);
        entry.data = /FlateDecode/.test(entry.dict) ? await pdfInflate(raw) : raw;
      }
    }
    objects[id] = entry;
  }
  return objects;
}

function pdfCMap(source) {
  const map = Object.create(null);
  const blocks = source.match(/beginbfchar([\s\S]*?)endbfchar|beginbfrange([\s\S]*?)endbfrange/g) || [];
  for (const block of blocks) {
    if (block.indexOf('beginbfchar') === 0) {
      for (const pair of block.match(/<[0-9A-Fa-f]+>\s*<[0-9A-Fa-f]+>/g) || []) {
        const hex = pair.match(/<[0-9A-Fa-f]+>/g);
        if (hex[1].length <= 6) map[parseInt(hex[0].slice(1, -1), 16)] = String.fromCharCode(parseInt(hex[1].slice(1, -1), 16) || 32);
      }
      continue;
    }
    for (const chunk of block.match(/<[0-9A-Fa-f]+>\s*<[0-9A-Fa-f]+>\s*(?:<[0-9A-Fa-f]+>|\[[^\]]*\])/g) || []) {
      const hex = chunk.match(/<[0-9A-Fa-f]+>|\[[\s\S]*\]/g);
      const low = parseInt(hex[0].slice(1, -1), 16);
      const high = parseInt(hex[1].slice(1, -1), 16);
      if (high - low > 65535) continue;
      if (hex[2][0] === '[') {
        const list = hex[2].match(/<[0-9A-Fa-f]+>/g) || [];
        for (let i = 0; i < list.length && low + i <= high; i += 1) {
          map[low + i] = String.fromCharCode(parseInt(list[i].slice(1, -1), 16) || 32);
        }
      } else {
        const base = parseInt(hex[2].slice(1, -1), 16);
        for (let i = 0; low + i <= high; i += 1) map[low + i] = String.fromCharCode(base + i || 32);
      }
    }
  }
  return map;
}

function pdfFonts(objects) {
  const fonts = Object.create(null);
  const cache = Object.create(null);
  for (const obj of Object.values(objects)) {
    if (!obj.dict || !/\/Font\b/.test(obj.dict)) continue;
    const direct = obj.dict.match(/\/Font\s*<<([\s\S]*?)>>/);
    let list = direct ? direct[1] : '';
    if (!list) {
      const ref = obj.dict.match(/\/Font\s+(\d+)\s+\d+\s+R/);
      if (ref && objects[ref[1]]) {
        const nested = objects[ref[1]].dict.match(/<<([\s\S]*)>>/);
        list = nested ? nested[1] : '';
      }
    }
    for (const entry of list.matchAll(/\/([A-Za-z0-9_.]+)\s+(\d+)\s+\d+\s+R/g)) {
      const node = objects[entry[2]];
      if (!node) continue;
      const twoByte = /\/Subtype\s*\/Type0/.test(node.dict) || /\/DescendantFonts/.test(node.dict);
      const ref = node.dict.match(/\/ToUnicode\s+(\d+)\s+\d+\s+R/);
      if (!ref) continue;
      const key = ref[1];
      if (!cache[key]) {
        const source = objects[key] && objects[key].data ? pdfLatin1(objects[key].data) : '';
        cache[key] = /beginbfchar|beginbfrange/.test(source) ? pdfCMap(source) : null;
      }
      if (cache[key]) fonts[entry[1]] = { map: cache[key], twoByte };
    }
  }
  return fonts;
}

function pdfUnescape(source) {
  let out = '';
  for (let i = 0; i < source.length; i += 1) {
    if (source[i] !== '\\') { out += source[i]; continue; }
    const next = source[i + 1];
    if (next === 'n' || next === 'r' || next === 't' || next === 'b' || next === 'f') {
      out += JSON.parse(`"\\${next}"`);
      i += 1;
    } else if (next === '\\') { out += '\\'; i += 1; }
    else if (next === '(') { out += '('; i += 1; }
    else if (next === ')') { out += ')'; i += 1; }
    else if (next >= '0' && next <= '7') {
      let octal = '';
      let k = i + 1;
      while (k < source.length && octal.length < 3 && source[k] >= '0' && source[k] <= '7') { octal += source[k]; k += 1; }
      out += String.fromCharCode(parseInt(octal, 8) & 255);
      i = k - 1;
    } else if (next === '\n' || next === '\r') {
      i += 1;
      if (source[i + 1] === '\n' && next === '\r') i += 1;
    } else { out += next; i += 1; }
  }
  return out;
}

function pdfGlyphText(raw, font) {
  if (!font || !font.map) return '';
  const map = font.map;
  const step = font.twoByte ? 2 : 1;
  let out = '';
  for (let i = 0; i + step <= raw.length; i += step) {
    const code = step === 2
      ? ((raw.charCodeAt(i) & 255) << 8) | (raw.charCodeAt(i + 1) & 255)
      : raw.charCodeAt(i) & 255;
    const ch = map[code];
    out += ch === undefined ? (code === 0 ? ' ' : '') : ch;
  }
  return out;
}

const PDF_TOKEN_RE = /\[((?:[^\[\]]*\[[^\]]*\][^\[\]]*)*)\]|BT|ET|Tj|TJ|\/([A-Za-z0-9_.]+)\s+[\d.]+\s+Tf|(-?[\d.]+)\s+(-?[\d.]+)\s+(-?[\d.]+)\s+(-?[\d.]+)\s+(-?[\d.]+)\s+(-?[\d.]+)\s+Tm|(-?[\d.]+)\s+(-?[\d.]+)\s+TD|(-?[\d.]+)\s+(-?[\d.]+)\s+Td|T\*|\(((?:\\.|[^\\()])*)\)|<([0-9A-Fa-f\s]*)>/g;

function pdfRuns(content, fonts) {
  const runs = [];
  let font = null;
  let x = 0;
  let y = 0;
  let cell = null;
  const push = (raw) => {
    const text = pdfGlyphText(raw, font);
    if (!text) return;
    if (cell && cell.x === x && cell.y === y) cell.text += text;
    else { cell = { x, y, text }; runs.push(cell); }
  };
  let match;
  PDF_TOKEN_RE.lastIndex = 0;
  while ((match = PDF_TOKEN_RE.exec(content))) {
    if (match[1] !== undefined) {
      for (const piece of match[1].match(/\(((?:\\.|[^\\()])*)\)|<([0-9A-Fa-f\s]*)>/g) || []) {
        if (piece[0] === '(') push(pdfUnescape(piece.slice(1, -1)));
        else push(pdfHexText(piece.slice(1, -1)));
      }
      continue;
    }
    if (match[2]) { font = fonts[match[2]] || font; continue; }
    if (match[3]) { x = Math.round(Number(match[7])); y = Math.round(Number(match[8])); cell = null; continue; }
    if (match[9]) { x = Math.round(x + Number(match[9])); y = Math.round(y + Number(match[10])); cell = null; continue; }
    if (match[11]) { x = Math.round(x + Number(match[11])); y = Math.round(y + Number(match[12])); cell = null; continue; }
    if (match[13] !== undefined) { push(pdfUnescape(match[13])); continue; }
    if (match[14] !== undefined) { push(pdfHexText(match[14])); continue; }
    if (match[0] === 'T*' || match[0] === 'BT' || match[0] === 'ET') cell = null;
  }
  return runs;
}

function pdfHexText(hex) {
  const clean = hex.replace(/[^0-9A-Fa-f]/g, '');
  let out = '';
  for (let i = 0; i + 2 <= clean.length; i += 2) out += String.fromCharCode(parseInt(clean.substr(i, 2), 16));
  return out;
}

async function pdfStatementCells(bytes) {
  const text = pdfLatin1(bytes);
  if (!/^\s*%PDF-/.test(text)) return null;
  if (typeof DecompressionStream !== 'function') return null;
  const objects = await pdfObjects(text, bytes);
  const fonts = pdfFonts(objects);
  const ids = Object.keys(objects)
    .filter((id) => objects[id].data && /FlateDecode/.test(objects[id].dict))
    .filter((id) => {
      const source = pdfLatin1(objects[id].data);
      return /Tj|TJ/.test(source) && !/beginbfchar|beginbfrange/.test(source);
    })
    .sort((a, b) => Number(a) - Number(b));
  const cells = [];
  ids.forEach((id, index) => {
    const source = pdfLatin1(objects[id].data);
    for (const run of pdfRuns(source, fonts)) cells.push({ page: index + 1, x: run.x, y: run.y, text: run.text });
  });
  return cells.length ? cells : null;
}

const PDF_TIME_RE = /^\d{4}-\d{2}-\d{2}\s+\d{1,2}:\d{2}:\d{2}$/;
const PDF_MONEY_RE = /^[+-]?[\d,]+(\.\d{1,2})?$/;

function pdfStatementCents(raw) {
  const digits = String(raw).replace(/,/g, '').replace(/^\+/, '').trim();
  if (!/^-?\d+(\.\d+)?$/.test(digits)) return null;
  return Math.round(Number(digits) * 100);
}

function pdfStatementBands(cells) {
  const groups = new Map();
  for (const cell of cells) {
    const trimmed = cell.text.trim();
    if (!trimmed) continue;
    const key = `${cell.page}|${Math.round(cell.y)}`;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push({ x: Math.round(cell.x), text: trimmed });
  }
  const bands = [];
  for (const [key, list] of groups) {
    const [page, y] = key.split('|').map(Number);
    list.sort((a, b) => a.x - b.x);
    bands.push({ page, y, cells: list });
  }
  bands.sort((a, b) => a.page - b.page || b.y - a.y);
  return bands;
}

/* Every detail line carries exactly one completion timestamp, so the timestamp
   anchors a record and any following text-only band is a wrapped description. */
function pdfStatementRecords(bands) {
  const records = [];
  let current = null;
  let insideDetails = false;
  for (const band of bands) {
    const joined = band.cells.map((c) => c.text).join(' ');
    if (!insideDetails) {
      if (/DETAILED\s+STATEMENT/i.test(joined)) insideDetails = true;
      continue;
    }
    const timeIndex = band.cells.findIndex((c) => PDF_TIME_RE.test(c.text));
    if (timeIndex >= 0) {
      current = {
        receipt: band.cells.slice(0, timeIndex).map((c) => c.text).join(' ').trim(),
        datetime: band.cells[timeIndex].text,
        status: '',
        details: [],
        paidInCents: null,
        withdrawnCents: null,
        balanceCents: null
      };
      records.push(current);
      const amounts = [];
      for (const cell of band.cells.slice(timeIndex + 1)) {
        const flat = cell.text.replace(/\s/g, '');
        if (PDF_MONEY_RE.test(flat)) { amounts.push(flat); continue; }
        if (/^(completed|pending|failed|reversed|cancelled)$/i.test(cell.text)) { current.status = cell.text; continue; }
        current.details.push(cell.text);
      }
      if (amounts.length) {
        current.balanceCents = pdfStatementCents(amounts[amounts.length - 1]);
        for (const raw of amounts.slice(0, -1)) {
          const value = pdfStatementCents(raw);
          if (!value) continue;
          if (value < 0) current.withdrawnCents = Math.abs(value);
          else current.paidInCents = value;
        }
      }
      continue;
    }
    if (!current) continue;
    for (const cell of band.cells) {
      const flat = cell.text.replace(/\s/g, '');
      if (PDF_MONEY_RE.test(flat)) continue;
      if (/^(completed|pending|failed|reversed|cancelled)$/i.test(cell.text)) continue;
      current.details.push(cell.text);
    }
  }
  return records
    .map((record) => ({
      ...record,
      details: record.details.join(' ').replace(/\\/g, ' ').replace(/\s+/g, ' ').trim()
    }))
    .filter((record) => record.datetime && (record.paidInCents || record.withdrawnCents));
}

function triggerStatementPicker() {
  const input = document.getElementById('import-statement-file');
  if (!input) {
    toast('The statement import control is unavailable. Reload the page and try again.', 'error');
    return;
  }
  input.value = '';
  input.click();
}

async function readImportStatementFile(file) {
  if (!file) return;
  if (/\.xlsx?$/i.test(file.name)) {
    toast('Excel files cannot be read here. In Excel use File → Save As → CSV, then import that file.', 'error');
    return;
  }
  if (/\.pdf$/i.test(file.name) || file.type === 'application/pdf') {
    await readImportStatementPdf(file);
    return;
  }
  if (file.size > IMPORT_MAX_BYTES) {
    toast('That statement is too large to import here (limit 4 MB).', 'error');
    return;
  }
  let text = '';
  try {
    text = await file.text();
  } catch (err) {
    toast('The file could not be read.', 'error');
    return;
  }
  text = text.replace(/^/, '');
  if (!text.trim()) {
    toast('That file looks empty.', 'error');
    return;
  }
  const delimiter = detectDelimiter(text);
  const matrix = parseDelimited(text, delimiter).filter((row) => row.some((c) => String(c).trim()));
  if (matrix.length < 2) {
    toast('No statement rows were found. Check that the file is a CSV or TSV export.', 'error');
    return;
  }
  if (matrix.length > IMPORT_MAX_ROWS) {
    toast(`That statement has more than ${IMPORT_MAX_ROWS.toLocaleString('en-GB')} rows. Split it into smaller date ranges.`, 'error');
    return;
  }
  const header = findImportHeader(matrix);
  const keepAccount = imp && imp.accountId ? imp.accountId : '';
  const delimiterNames = { ',': 'comma', '\t': 'tab', ';': 'semicolon', '|': 'pipe' };
  imp = {
    step: 2,
    mode: 'file',
    fileName: String(file.name || 'statement').slice(0, 80),
    fileBytes: file.size,
    delimiter,
    delimiterLabel: delimiterNames[delimiter] || 'unknown',
    matrix,
    headerIndex: header.index,
    hasHeader: header.index >= 0,
    map: header.map,
    accountId: accountById(keepAccount) ? keepAccount : '',
    rows: [],
    filter: 'all',
    page: 0,
    bulk: { expense: '', income: '' },
    batch: uid('imp'),
    skipped: 0
  };
  if (!imp.accountId) {
    const first = spendableAccounts()[0] || activeAccounts().find((acc) => accountNature(acc) === 'asset');
    imp.accountId = first ? first.id : '';
  }
  buildImportRows();
  if (!imp.rows.length) {
    toast(`No usable rows found in ${imp.fileName}. Open the Columns step and map the date and amount yourself.`, 'error');
    imp.step = 2;
  }
  if (!activeModal) openImportModal(imp.accountId);
  else renderImportStep();
}

/* The M-Pesa PDF layout is fixed, so its columns are known rather than guessed:
   Receipt No. | Completion Time | Details | Status | Paid In | Withdrawn | Balance */
async function readImportStatementPdf(file) {
  const keepAccount = imp && imp.accountId && accountById(imp.accountId) ? imp.accountId : '';
  if (typeof DecompressionStream !== 'function') {
    toast('This browser cannot open PDF statements. Update the browser, or import a CSV instead.', 'error');
