/* ---------------------------------------------------------------
   Generic helpers
   --------------------------------------------------------------- */
function esc(value) {
  return String(value == null ? '' : value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function uid(prefix = 'id') {
  const rand = (globalThis.crypto && crypto.randomUUID)
    ? crypto.randomUUID().replace(/-/g, '').slice(0, 12)
    : Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-5);
  return `${prefix}_${rand}`;
}

function clamp(n, min, max) {
  return Math.min(max, Math.max(min, n));
}

function toInt(value, fallback = 0) {
  const n = Number(value);
  return Number.isFinite(n) ? Math.round(n) : fallback;
}

function sum(arr) {
  return arr.reduce((total, n) => total + n, 0);
}

function plural(n, one, many) {
  return n === 1 ? one : (many || `${one}s`);
}

function todayISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function nowISO() {
  return new Date().toISOString();
}

function parseDate(iso) {
  const [y, m, d] = String(iso).split('-').map(Number);
  return new Date(y, (m || 1) - 1, d || 1, 12, 0, 0, 0);
}

function isoFromDate(date) {
  return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
}

function addDays(iso, days) {
  const d = parseDate(iso);
  d.setDate(d.getDate() + Number(days));
  return isoFromDate(d);
}

function addMonths(iso, months) {
  const d = parseDate(iso);
  const day = d.getDate();
  d.setDate(1);
  d.setMonth(d.getMonth() + Number(months));
  const dim = new Date(d.getFullYear(), d.getMonth() + 1, 0, 12).getDate();
  d.setDate(Math.min(day, dim));
  return isoFromDate(d);
}

function advanceDate(iso, frequency) {
  switch (frequency) {
    case 'weekly': return addDays(iso, 7);
    case 'biweekly': return addDays(iso, 14);
    case 'yearly': return addMonths(iso, 12);
    case 'monthly':
    default: return addMonths(iso, 1);
  }
}

function monthOf(iso) {
  return String(iso || todayISO()).slice(0, 7);
}

function currentMonthKey() {
  return monthOf(todayISO());
}

function monthStart(key) {
  return `${key}-01`;
}

function daysInMonth(key) {
  const [y, m] = key.split('-').map(Number);
  return new Date(y, m, 0, 12).getDate();
}

function monthEnd(key) {
  return `${key}-${String(daysInMonth(key)).padStart(2, '0')}`;
}

function addMonthsKey(key, months) {
  return monthOf(addMonths(`${key}-01`, months));
}

function monthLabel(key, short = false) {
  const [y, m] = key.split('-').map(Number);
  return new Date(y, m - 1, 1, 12).toLocaleDateString('en-GB', {
    month: short ? 'short' : 'long',
    year: 'numeric'
  });
}

function monthShort(key) {
  const [y, m] = key.split('-').map(Number);
  return new Date(y, m - 1, 1, 12).toLocaleDateString('en-GB', { month: 'short' });
}

function dateLabel(iso, long = false) {
  const d = parseDate(iso);
  return d.toLocaleDateString('en-GB', long
    ? { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }
    : { day: 'numeric', month: 'short' });
}

function dateInputLabel(iso) {
  const d = parseDate(iso);
  return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
}

function timestampLabel(value) {
  if (!value) return '—';
  const d = new Date(value);
  if (Number.isNaN(d.getTime())) return '—';
  return d.toLocaleString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}

function daysFromToday(iso) {
  const a = parseDate(todayISO()).getTime();
  const b = parseDate(iso).getTime();
  return Math.round((b - a) / 86400000);
}

function dueLabel(iso) {
  const diff = daysFromToday(iso);
  if (diff < 0) return `${Math.abs(diff)} ${plural(Math.abs(diff), 'day')} late`;
  if (diff === 0) return 'Due today';
  if (diff === 1) return 'Due tomorrow';
  return `In ${diff} days`;
}

function inRange(iso, start, end) {
  return iso >= start && iso <= end;
}

function monthsEnding(key, count) {
  const list = [];
  for (let i = count - 1; i >= 0; i -= 1) list.push(addMonthsKey(key, -i));
  return list;
}

function daysLeftInMonth(key) {
  if (key !== currentMonthKey()) return 0;
  return Math.max(0, daysInMonth(key) - Number(todayISO().slice(8, 10)) + 1);
}

function relativeDayLabel(iso) {
  const diff = daysFromToday(iso);
  if (diff === 0) return 'Today';
  if (diff === -1) return 'Yesterday';
  if (diff === 1) return 'Tomorrow';
  return dateLabel(iso);
}

function currencyConfig() {
  return CURRENCIES[(state && state.profile && state.profile.currency) || 'KES'] || CURRENCIES.KES;
}

function currencySymbol() {
  return currencyConfig().symbol;
}

function money(cents, opts = {}) {
  const cur = currencyConfig();
  const value = toInt(cents, 0);
  const negative = value < 0;
  const abs = Math.abs(value);
  if (opts.compact) {
    return `${negative ? '\u2212' : (opts.sign && value > 0 ? '+' : '')}${cur.space ? `${cur.symbol} ` : cur.symbol}${compactNumber(abs)}`;
  }
  const decimals = opts.whole ? 0 : 2;
  const digits = new Intl.NumberFormat(cur.locale, {
    minimumFractionDigits: decimals,
    maximumFractionDigits: decimals
  }).format(abs / 100);
  return `${negative ? '\u2212' : (opts.sign && value > 0 ? '+' : '')}${cur.space ? `${cur.symbol} ` : cur.symbol}${digits}`;
}

function compactNumber(cents) {
  const value = Math.abs(cents) / 100;
  if (value >= 1e9) return `${(value / 1e9).toFixed(value >= 1e10 ? 0 : 1)}b`;
  if (value >= 1e6) return `${(value / 1e6).toFixed(value >= 1e7 ? 0 : 1)}m`;
  if (value >= 10000) return `${Math.round(value / 1000)}k`;
  if (value >= 1000) return `${(value / 1000).toFixed(1)}k`;
  return String(Math.round(value));
}

function amountParts(cents, opts = {}) {
  const cur = currencyConfig();
  const value = toInt(cents, 0);
  return {
    negative: value < 0,
    prefix: `${value < 0 ? '\u2212' : ''}${cur.space ? `${cur.symbol} ` : cur.symbol}`,
    digits: new Intl.NumberFormat(cur.locale, {
      minimumFractionDigits: opts.whole ? 0 : 2,
      maximumFractionDigits: opts.whole ? 0 : 2
    }).format(Math.abs(value) / 100)
  };
}

function parseMoneyInput(raw, opts = {}) {
  const text = String(raw == null ? '' : raw).trim().replace(/[\s,]/g, '');
  if (!text) return null;
  if (!/^-?\d+(\.\d{0,2})?$/.test(text)) return null;
  const negative = text.startsWith('-');
  const cleaned = negative ? text.slice(1) : text;
  const [wholePart, fractionPart = ''] = cleaned.split('.');
  if (!wholePart && !fractionPart) return null;
  const cents = Number(wholePart || '0') * 100 + Number((fractionPart + '00').slice(0, 2));
  if (!Number.isSafeInteger(cents)) return null;
  if (negative && !opts.allowNegative) return null;
  const signed = negative ? -cents : cents;
  if (!opts.allowZero && signed === 0) return null;
  return signed;
}

function inputMoney(cents) {
  const value = toInt(cents, 0) / 100;
  return value.toFixed(2);
}

function percent(value, digits = 0) {
  const n = Number(value);
  if (!Number.isFinite(n)) return '0%';
  return `${n.toFixed(digits)}%`;
}

function safePct(part, whole) {
  if (!whole) return 0;
  return (part / whole) * 100;
}

function firstName(name) {
  return String(name || '').trim().split(/\s+/)[0] || 'there';
}

function initials(name) {
  const parts = String(name || '').trim().split(/\s+/).filter(Boolean);
  if (!parts.length) return 'L';
  return (parts[0][0] + (parts[1] ? parts[1][0] : '')).toUpperCase();
}

function greeting() {
  const hour = new Date().getHours();
  if (hour < 12) return 'Good morning';
  if (hour < 17) return 'Good afternoon';
  return 'Good evening';
}

function normaliseCategory(raw, fallbackType = 'expense') {

  if (!name) return null;

    name,
    type,
    group: GROUPS[raw.group] ? raw.group : (type === 'income' ? 'other_income' : 'other'),
    color: /^#[0-9a-f]{6}$/i.test(String(raw.color || '')) ? raw.color : CATEGORY_COLORS[0],
    archived: !!raw.archived
  };
}

function normaliseAccount(raw) {
  if (!raw || typeof raw !== 'object') return null;
  const type = ACCOUNT_TYPES[raw.type] ? raw.type : 'bank';
  const name = String(raw.name || '').trim().slice(0, 60);
  if (!name) return null;
  return {
    id: String(raw.id || uid('acc')),
    name,
    type,
    institution: String(raw.institution || '').trim().slice(0, 60),
    openingCents: Math.max(0, toInt(raw.openingCents, 0)),
    openedAt: /^\d{4}-\d{2}-\d{2}$/.test(String(raw.openedAt || '')) ? raw.openedAt : todayISO(),
    spendable: typeof raw.spendable === 'boolean' ? raw.spendable : ACCOUNT_TYPES[type].spendable,
    apr: raw.apr == null ? null : clamp(Number(raw.apr) || 0, 0, 100),
    minPaymentCents: Math.max(0, toInt(raw.minPaymentCents, 0)),
    archived: !!raw.archived,
    createdAt: String(raw.createdAt || nowISO()),
    updatedAt: String(raw.updatedAt || nowISO())
  };
}

function normaliseEntries(raw) {
  if (!Array.isArray(raw) || raw.length < 2) {
    throw new Error('A transaction is missing its journal entries.');
  }
  return raw.map((entry) => {
    if (!entry || typeof entry !== 'object') throw new Error('A journal entry is malformed.');
    const hasAccount = !!entry.accountId;
    const hasCategory = !!entry.categoryId;
    const isEquity = !!entry.equity;
    if ([hasAccount, hasCategory, isEquity].filter(Boolean).length !== 1) {
      throw new Error('A journal entry must reference exactly one ledger account.');
    }
    return {
      accountId: hasAccount ? String(entry.accountId) : null,
      categoryId: hasCategory ? String(entry.categoryId) : null,
      equity: isEquity,
      debitCents: Math.max(0, toInt(entry.debitCents, 0)),
      creditCents: Math.max(0, toInt(entry.creditCents, 0)),
      memo: String(entry.memo || '').slice(0, 120)
    };
  });
}

function normaliseTransaction(raw) {
  if (!raw || typeof raw !== 'object') return null;
  const type = ['income', 'expense', 'transfer', 'opening', 'adjustment', 'reversal'].includes(raw.type) ? raw.type : 'expense';
  const date = /^\d{4}-\d{2}-\d{2}$/.test(String(raw.date || '')) ? raw.date : todayISO();
  const entries = normaliseEntries(raw.entries);
  return {
    id: String(raw.id || uid('txn')),
    ref: String(raw.ref || 'TX-—'),
    type,
    date,
    description: String(raw.description || '').slice(0, 140),
    payee: String(raw.payee || '').slice(0, 100),
    accountId: raw.accountId ? String(raw.accountId) : null,
    toAccountId: raw.toAccountId ? String(raw.toAccountId) : null,
    categoryId: raw.categoryId ? String(raw.categoryId) : null,
    amountCents: Math.max(0, toInt(raw.amountCents, 0)),
    notes: String(raw.notes || '').slice(0, 400),
    entries,
    createdAt: String(raw.createdAt || nowISO()),
    updatedAt: String(raw.updatedAt || raw.createdAt || nowISO()),
    recurringId: raw.recurringId ? String(raw.recurringId) : null,
    reverses: raw.reverses ? String(raw.reverses) : null,
    reversedBy: raw.reversedBy ? String(raw.reversedBy) : null,
    replaces: raw.replaces ? String(raw.replaces) : null,
    source: raw.source ? String(raw.source).slice(0, 30) : null,
    importKey: raw.importKey ? String(raw.importKey).slice(0, 90) : null,
    importReceipt: raw.importReceipt ? String(raw.importReceipt).replace(/[^A-Za-z0-9]/g, '').slice(0, 16) : null,
    importBatch: raw.importBatch ? String(raw.importBatch).slice(0, 40) : null
  };
}

function normaliseRecurring(raw) {
  if (!raw || typeof raw !== 'object') return null;
  const kind = ['income', 'expense', 'transfer'].includes(raw.kind) ? raw.kind : 'expense';
  const name = String(raw.name || '').trim().slice(0, 80);
  if (!name) return null;
  const frequency = FREQUENCIES[raw.frequency] ? raw.frequency : 'monthly';
  const nextDate = /^\d{4}-\d{2}-\d{2}$/.test(String(raw.nextDate || '')) ? raw.nextDate : todayISO();
  return {
    id: String(raw.id || uid('bill')),
    name,
    kind,
    accountId: raw.accountId ? String(raw.accountId) : null,
    toAccountId: raw.toAccountId ? String(raw.toAccountId) : null,
    categoryId: raw.categoryId ? String(raw.categoryId) : null,
    amountCents: Math.max(0, toInt(raw.amountCents, 0)),
    frequency,
    nextDate,
    active: raw.active !== false,
    notes: String(raw.notes || '').slice(0, 200),
    createdAt: String(raw.createdAt || nowISO())
  };
}

function normaliseGoal(raw) {
  if (!raw || typeof raw !== 'object') return null;
  const name = String(raw.name || '').trim().slice(0, 80);
  if (!name) return null;
  const contributions = Array.isArray(raw.contributions) ? raw.contributions.map((c) => ({
    id: String((c && c.id) || uid('gol')),
    date: /^\d{4}-\d{2}-\d{2}$/.test(String((c && c.date) || '')) ? c.date : todayISO(),
    amountCents: toInt(c && c.amountCents, 0),
    note: String((c && c.note) || '').slice(0, 140)
  })).filter((c) => c.amountCents !== 0) : [];
  return {
    id: String(raw.id || uid('goal')),
    name,
    targetCents: Math.max(0, toInt(raw.targetCents, 0)),
    targetDate: /^\d{4}-\d{2}-\d{2}$/.test(String(raw.targetDate || '')) ? raw.targetDate : null,
    color: /^#[0-9a-f]{6}$/i.test(String(raw.color || '')) ? raw.color : '#b3874a',
    note: String(raw.note || '').slice(0, 240),
    contributions,
    archived: !!raw.archived,
    createdAt: String(raw.createdAt || nowISO())
  };
}

function normaliseState(raw) {
  if (!raw || typeof raw !== 'object' || Array.isArray(raw)) {
    throw new Error('That file does not contain a Ledgerwise ledger.');
  }
  const currency = CURRENCIES[raw.profile && raw.profile.currency] ? raw.profile.currency : 'KES';
  const config = CURRENCIES[currency];

  const suppliedCategories = Array.isArray(raw.categories)
    ? raw.categories.map((c) => normaliseCategory(c)).filter(Boolean)
    : [];
  const byId = new Map(defaultCategories().map((c) => [c.id, c]));
  suppliedCategories.forEach((c) => byId.set(c.id, c));
  const categories = [...byId.values()];

  const budgets = Array.isArray(raw.budgets) ? raw.budgets.map((b) => {
    if (!b || !/^\d{4}-\d{2}$/.test(String(b.month || ''))) return null;
    return {
      month: b.month,
      categoryId: String(b.categoryId || ''),
      limitCents: Math.max(0, toInt(b.limitCents, 0))
    };
  }).filter((b) => b && b.categoryId) : [];

  const seenBudgets = new Set();
  const cleanBudgets = budgets.filter((b) => {
    const key = `${b.month}|${b.categoryId}`;
    if (seenBudgets.has(key)) return false;
    seenBudgets.add(key);
    return true;
  });

  const audit = Array.isArray(raw.audit) ? raw.audit.slice(0, 300).map((a) => ({
    id: String((a && a.id) || uid('aud')),
    at: String((a && a.at) || nowISO()),
    action: String((a && a.action) || 'event').slice(0, 40),
    text: String((a && a.text) || '').slice(0, 200)
  })) : [];

  return {
    version: APP_VERSION,
    createdAt: String(raw.createdAt || nowISO()),
    updatedAt: String(raw.updatedAt || nowISO()),
    meta: {
      demo: !!(raw.meta && raw.meta.demo),
      lastBackupAt: raw.meta && raw.meta.lastBackupAt ? String(raw.meta.lastBackupAt) : null,
      onboardedAt: String((raw.meta && raw.meta.onboardedAt) || nowISO()),
      app: APP_NAME
    },
    profile: {
      name: String((raw.profile && raw.profile.name) || '').trim().slice(0, 80),
      currency,
      locale: config.locale,
      savingsTargetPct: clamp(Number(raw.profile && raw.profile.savingsTargetPct) || 0, 0, 80),
      bufferCents: Math.max(0, toInt(raw.profile && raw.profile.bufferCents, defaultBufferCents(currency))),
      safeWindowDays: [7, 14, 30].includes(Number(raw.profile && raw.profile.safeWindowDays))
        ? Number(raw.profile.safeWindowDays) : 14
    },
    accounts: Array.isArray(raw.accounts) ? raw.accounts.map(normaliseAccount).filter(Boolean) : [],
    categories,
    transactions: Array.isArray(raw.transactions) ? raw.transactions.map(normaliseTransaction).filter(Boolean) : [],
    budgets: cleanBudgets,
    recurring: Array.isArray(raw.recurring) ? raw.recurring.map(normaliseRecurring).filter(Boolean) : [],
    goals: Array.isArray(raw.goals) ? raw.goals.map(normaliseGoal).filter(Boolean) : [],
    audit
  };
}

function saveState() {
  if (!state) return false;
  let localOk = true;
  try {
    state.updatedAt = nowISO();
    localStorage.setItem(DB_KEY, JSON.stringify(state));
    ui.lastSaved = state.updatedAt;
  } catch (err) {
    localOk = false;
    if (typeof cloudLedgerChanged !== 'function' && typeof toast === 'function') {
      toast('Could not save. Browser storage may be full or blocked.', 'error');
    }
  }
  const cloudActive = typeof cloudLedgerChanged === 'function' && cloudLedgerChanged();
  return localOk || !!cloudActive;
}

function loadState() {
  try {
    const raw = localStorage.getItem(DB_KEY);
    if (!raw) return null;
    return normaliseState(JSON.parse(raw));
  } catch (err) {
    loadError = err;
    try {
      localStorage.setItem(`${DB_KEY}_corrupt_${Date.now()}`, localStorage.getItem(DB_KEY) || '');
    } catch (e) { /* storage unavailable */ }
    return null;
  }
}

function logAudit(action, text) {
  if (!state) return;
  state.audit.unshift({
    id: uid('aud'),
    at: nowISO(),
    action: String(action || 'event').slice(0, 40),
    text: String(text || '').slice(0, 200)
  });
  state.audit = state.audit.slice(0, 300);
}

/* ---------------------------------------------------------------
   Lookups
   --------------------------------------------------------------- */
function accountById(id) {
  return (state && state.accounts.find((a) => a.id === id)) || null;
}

function categoryById(id) {
  return (state && state.categories.find((c) => c.id === id))
    || { id, name: 'Uncategorised', type: 'expense', group: 'other', color: '#9a958b', archived: true };
}

function categoriesOf(type, includeArchived = false) {
  return state.categories
    .filter((c) => c.type === type && (includeArchived || !c.archived))
    .sort((a, b) => {
      const orderA = GROUPS[a.group] ? GROUPS[a.group].order : 99;
      const orderB = GROUPS[b.group] ? GROUPS[b.group].order : 99;
      return orderA - orderB || a.name.localeCompare(b.name);
    });
}

function groupLabel(key) {
  return GROUPS[key] ? GROUPS[key].label : 'Other';
}

function accountNature(account) {
  return account && ACCOUNT_TYPES[account.type] ? ACCOUNT_TYPES[account.type].nature : 'asset';
}

function accountTypeLabel(account) {
  return account && ACCOUNT_TYPES[account.type] ? ACCOUNT_TYPES[account.type].label : 'Account';
}

function activeAccounts(includeArchived = false) {
  return state.accounts.filter((a) => includeArchived || !a.archived);
}

function spendableAccounts() {
  return activeAccounts().filter((a) => accountNature(a) === 'asset' && a.spendable);
}

/* ---------------------------------------------------------------
   Ledger engine
   --------------------------------------------------------------- */
function accountBalance(accountId, asOf = null) {
  const acc = accountById(accountId);
  if (!acc) return 0;
  const sign = accountNature(acc) === 'asset' ? 1 : -1;
  let balance = 0;
  for (const tx of state.transactions) {
    if (asOf && tx.date > asOf) continue;
    for (const entry of tx.entries) {
      if (entry.accountId !== accountId) continue;
      balance += sign * (entry.debitCents - entry.creditCents);
    }
  }
  return balance;
}

function accountTotals(asOf = null) {
  let assets = 0;
  let liabilities = 0;
  for (const acc of state.accounts) {
    const balance = accountBalance(acc.id, asOf);
    if (accountNature(acc) === 'asset') assets += balance;
    else liabilities += balance;
  }
  return { assets, liabilities, net: assets - liabilities };
}

function accountLastActivity(accountId) {
  let last = null;
  for (const tx of state.transactions) {
    if (tx.type === 'reversal') continue;
    if (tx.entries.some((e) => e.accountId === accountId)) {
      if (!last || tx.date > last) last = tx.date;
    }
  }
  return last;
}

function nextReference(prefix, dateISO) {
  const year = String(dateISO || todayISO()).slice(0, 4);
  const pattern = new RegExp(`^${prefix}-${year}-(\\d+)$`);
  let max = 0;
  for (const tx of state.transactions) {
    const match = pattern.exec(tx.ref || '');
    if (match) max = Math.max(max, Number(match[1]));
  }
  return `${prefix}-${year}-${String(max + 1).padStart(4, '0')}`;
}

function validateLedgerEntries(entries, type) {
  if (!Array.isArray(entries) || entries.length < 2) {
    throw new Error('Every transaction needs at least two journal entries.');
  }
  let debits = 0;
  let credits = 0;
  for (const entry of entries) {
    if (!entry || typeof entry !== 'object') throw new Error('A journal entry is malformed.');
    const refs = [!!entry.accountId, !!entry.categoryId, !!entry.equity].filter(Boolean).length;
    if (refs !== 1) throw new Error('A journal entry must reference exactly one ledger account.');
    const debit = toInt(entry.debitCents, 0);
    const credit = toInt(entry.creditCents, 0);
    if (debit < 0 || credit < 0) throw new Error('Journal amounts cannot be negative.');
    if ((debit > 0 && credit > 0) || (debit === 0 && credit === 0)) {
      throw new Error('Each journal line must have either a debit or a credit.');
    }
    if (entry.accountId && !accountById(entry.accountId)) throw new Error('A journal entry points to a missing account.');
    if (entry.categoryId && !state.categories.some((c) => c.id === entry.categoryId)) {
      throw new Error('A journal entry points to a missing category.');
    }
    debits += debit;
    credits += credit;
  }
  if (debits !== credits) throw new Error('Journal does not balance: debits and credits must be equal.');
  if (type === 'expense' && !entries.some((e) => e.categoryId && categoryById(e.categoryId).type === 'expense')) {
    throw new Error('An expense needs an expense category.');
  }
  if (type === 'income' && !entries.some((e) => e.categoryId && categoryById(e.categoryId).type === 'income')) {
    throw new Error('Income needs an income category.');
  }
  return { debits, credits };
}

function makeEntry(parts) {
  return {
    accountId: parts.accountId || null,
    categoryId: parts.categoryId || null,
    equity: !!parts.equity,
    debitCents: Math.max(0, toInt(parts.debitCents, 0)),
    creditCents: Math.max(0, toInt(parts.creditCents, 0)),
    memo: String(parts.memo || '').slice(0, 120)
  };
}

function buildTransactionEntries(draft) {
  const amount = toInt(draft.amountCents, 0);
  if (amount <= 0) throw new Error('Enter an amount greater than zero.');
  const kind = draft.type;
  const account = accountById(draft.accountId);
  if (!account) throw new Error('Choose an account.');
  if (account.archived) throw new Error('That account is archived.');

  if (kind === 'expense') {
    const category = categoryById(draft.categoryId);
    if (!draft.categoryId || category.type !== 'expense') throw new Error('Choose an expense category.');
    return [
      makeEntry({ categoryId: category.id, debitCents: amount, memo: category.name }),
      makeEntry({ accountId: account.id, creditCents: amount, memo: account.name })
    ];
  }
  if (kind === 'income') {
    const category = categoryById(draft.categoryId);
    if (!draft.categoryId || category.type !== 'income') throw new Error('Choose an income category.');
    if (accountNature(account) !== 'asset') throw new Error('Income can only be received into a cash, bank, mobile or savings account.');
    return [
      makeEntry({ accountId: account.id, debitCents: amount, memo: account.name }),
      makeEntry({ categoryId: category.id, creditCents: amount, memo: category.name })
    ];
  }
  if (kind === 'transfer') {
    const to = accountById(draft.toAccountId);
    if (!to) throw new Error('Choose the destination account.');
    if (to.id === account.id) throw new Error('Choose two different accounts.');
    if (to.archived) throw new Error('That destination account is archived.');
    return [
      makeEntry({ accountId: to.id, debitCents: amount, memo: to.name }),
      makeEntry({ accountId: account.id, creditCents: amount, memo: account.name })
    ];
  }
  throw new Error('Unknown transaction type.');
}

function postTransaction(draft) {
  const cleanDraft = {
    type: draft.type,
    date: /^\d{4}-\d{2}-\d{2}$/.test(draft.date || '') ? draft.date : todayISO(),
    description: String(draft.description || '').trim().slice(0, 140) || 'Transaction',
    payee: String(draft.payee || '').trim().slice(0, 100),
    accountId: draft.accountId || null,
    toAccountId: draft.toAccountId || null,
    categoryId: draft.categoryId || null,
    amountCents: toInt(draft.amountCents, 0),
    notes: String(draft.notes || '').trim().slice(0, 400),
    recurringId: draft.recurringId || null,
    source: draft.source || null
  };
  const entries = buildTransactionEntries(cleanDraft);
  validateLedgerEntries(entries, cleanDraft.type);
  const prefix = 'TX';
  const tx = {
    id: uid('txn'),
    ref: nextReference(prefix, cleanDraft.date),
    ...cleanDraft,
    entries,
    createdAt: nowISO(),
    updatedAt: nowISO(),
    reverses: null,
    reversedBy: null,
    replaces: draft.replaces || null
  };
  state.transactions.push(tx);
  return tx;
}

function openingEntries(account, amountCents) {
  const amount = Math.max(0, toInt(amountCents, 0));
  if (amount === 0) return [];
  if (accountNature(account) === 'asset') {
    return [
      makeEntry({ accountId: account.id, debitCents: amount, memo: 'Opening balance' }),
      makeEntry({ equity: true, creditCents: amount, memo: 'Opening balance equity' })
    ];
  }
  return [
    makeEntry({ accountId: account.id, creditCents: amount, memo: 'Opening balance' }),
    makeEntry({ equity: true, debitCents: amount, memo: 'Opening balance equity' })
  ];
}

function createOpeningTransaction(account, date) {
  const amount = Math.max(0, toInt(account.openingCents, 0));
  if (!amount) return null;
  const entries = openingEntries(account, amount);
  const tx = {
    id: uid('txn'),
    ref: nextReference('OB', date),
    type: 'opening',
    date,
    description: `Opening balance — ${account.name}`,
    payee: account.institution || '',
    accountId: account.id,
    toAccountId: null,
    categoryId: null,
    amountCents: amount,
    notes: 'Opening balance posted against opening equity.',
    entries,
    createdAt: nowISO(),
    updatedAt: nowISO(),
    recurringId: null,
    reverses: null,
    reversedBy: null,
    replaces: null,
    source: 'opening'
  };
  validateLedgerEntries(entries, 'opening');
  state.transactions.push(tx);
  return tx;
}

function postOpeningCorrection(account, newOpeningCents) {
  const current = Math.max(0, toInt(account.openingCents, 0));
  const next = Math.max(0, toInt(newOpeningCents, 0));
  if (current === next) return null;

  if (current === 0) {
    account.openingCents = next;
    const tx = createOpeningTransaction(account, account.openedAt || todayISO());
    if (!tx) account.openingCents = current;
    return tx;
  }

  const diff = next - current;
  const amount = Math.abs(diff);
  const debitAccount = (diff > 0) === (accountNature(account) === 'asset');
  const entries = [
    debitAccount
      ? makeEntry({ accountId: account.id, debitCents: amount, memo: `Opening restated to ${money(next)}` })
      : makeEntry({ accountId: account.id, creditCents: amount, memo: `Opening restated to ${money(next)}` }),
    debitAccount
      ? makeEntry({ equity: true, creditCents: amount, memo: 'Opening balance equity' })
      : makeEntry({ equity: true, debitCents: amount, memo: 'Opening balance equity' })
  ];
  validateLedgerEntries(entries, 'opening');
  const date = todayISO();
  const tx = {
    id: uid('txn'),
    ref: nextReference('OB', date),
    type: 'opening',
    date,
    description: `Opening balance correction — ${account.name}`,
    payee: account.institution || '',
    accountId: account.id,
    toAccountId: null,
    categoryId: null,
    amountCents: amount,
    notes: `Opening balance corrected from ${money(current)} to ${money(next)}. The original opening entries are untouched.`,
    entries,
    createdAt: nowISO(),
    updatedAt: nowISO(),
    recurringId: null,
    reverses: null,
    reversedBy: null,
    replaces: null,
    source: 'opening-correction'
  };
  state.transactions.push(tx);
  account.openingCents = next;
  return tx;
}

function accountDeletionImpact(id) {
  const account = accountById(id);
  if (!account) return null;
  const transactions = state.transactions.filter((tx) => tx.accountId === id
    || tx.toAccountId === id
    || tx.entries.some((entry) => entry.accountId === id));
  const rules = state.recurring.filter((rule) => rule.accountId === id || rule.toAccountId === id);
  const collateral = new Map();
  transactions.forEach((tx) => {
    tx.entries.forEach((entry) => {
      if (!entry.accountId || entry.accountId === id) return;
      const other = accountById(entry.accountId);
      if (!other) return;
      const sign = accountNature(other) === 'asset' ? 1 : -1;
      // Removing the entry takes its contribution back out, so the surviving balance moves the other way.
      collateral.set(other.id, (collateral.get(other.id) || 0) - sign * (entry.debitCents - entry.creditCents));
    });
  });
  return {
    account,
    transactions,
    rules,
    collateral: [...collateral.entries()]
      .map(([otherId, delta]) => ({ account: accountById(otherId), delta }))
      .filter((row) => row.account && row.delta !== 0)
  };
}

function deleteAccountForever(id) {
  const impact = accountDeletionImpact(id);
  if (!impact) throw new Error('That account no longer exists.');
  const snapshot = {
    accounts: state.accounts,
    transactions: state.transactions,
    recurring: state.recurring
  };
  const problemsBefore = integrityReport().problems.length;
  const doomed = new Set(impact.transactions.map((tx) => tx.id));
  const doomedRules = new Set(impact.rules.map((rule) => rule.id));
  state.transactions = state.transactions.filter((tx) => !doomed.has(tx.id));
  state.recurring = state.recurring.filter((rule) => !doomedRules.has(rule.id));
  state.accounts = state.accounts.filter((acc) => acc.id !== id);
  const report = integrityReport();
  if (report.problems.length > problemsBefore) {
    state.accounts = snapshot.accounts;
    state.transactions = snapshot.transactions;
    state.recurring = snapshot.recurring;
    throw new Error('Removing that account would leave the journal inconsistent, so nothing was deleted. Reconcile or correct the affected entries first.');
  }
  return {
    account: impact.account,
    removed: impact.transactions.length,
    rules: impact.rules.length,
    collateral: impact.collateral
  };
}

function openDeleteAccountModal(id) {
  const impact = accountDeletionImpact(id);
  if (!impact) {
    toast('That account no longer exists.', 'error');
    return;
  }
  const { account, transactions, rules, collateral } = impact;
  const balance = accountBalance(account.id);
  const hasOpening = transactions.some((tx) => tx.type === 'opening');
  const balanceNote = balance
    ? ` and ${accountNature(account) === 'asset' ? 'a current balance of' : 'an outstanding balance of'} ${esc(money(balance))}`
    : '';
  const rows = [
    `<li><strong>${transactions.length}</strong> ${plural(transactions.length, 'posted entry', 'posted entries')}${hasOpening ? ' including its opening balance' : ''}${balanceNote}.</li>`
  ];
  if (rules.length) {
    rows.push(`<li><strong>${rules.length}</strong> recurring ${rules.length === 1 ? 'bill or transfer' : 'bills or transfers'}${rules.length === 1 ? ` — “${esc(rules[0].name)}” will be removed, so it stops generating entries.` : ' will be removed, so they stop generating entries.'}</li>`);
  }
  if (collateral.length) {
    rows.push(`<li>Transfers that touched this account are removed too, so ${collateral.length} ${plural(collateral.length, 'other balance moves', 'other balances move')}: ${collateral.map((row) => `${esc(row.account.name)} ${row.delta > 0 ? '+' : '−'}${esc(money(Math.abs(row.delta)))}`).join(', ')}.</li>`);
  }
  openModal({
    title: `Delete ${account.name}?`,
    subtitle: 'The account and everything posted through it is removed. Net worth and every other balance recalculate from what is left.',
    size: 'sm',
    body: `<ul style="margin:0;padding-left:20px;font-size:12px;line-height:1.7;color:var(--ink-soft)">${rows.join('')}</ul>
      <div class="info-note rose" style="margin-top:14px">${icon('alert', 15)}<span>This cannot be undone. If you only want it out of the way, <strong>archive</strong> it instead — history and net worth stay intact.</span></div>
      <div class="button-row" style="margin-top:12px"><button type="button" class="link-btn" data-act="export-json">Export a backup first ${icon('download', 12)}</button></div>
      <form id="delete-account-form" data-form="delete-account" data-id="${esc(account.id)}" novalidate style="margin-top:16px">
        <div class="field">
          <label class="label" for="delete-account-confirm">Type <strong>${esc(account.name)}</strong> to confirm</label>
          <input class="input" id="delete-account-confirm" name="confirmation" autocomplete="off" placeholder="${esc(account.name)}" data-autofocus>
        </div>
        <div id="form-error" class="error-text" role="alert"></div>
      </form>`,
    foot: `<button type="button" class="btn btn-ghost" data-act="delete-account-cancel" data-id="${esc(account.id)}" style="margin-right:auto">Back to the account</button>
      <button type="submit" class="btn btn-danger" form="delete-account-form">Delete account and ${transactions.length} ${plural(transactions.length, 'entry', 'entries')}</button>`
  });
}

function submitDeleteAccount(form) {
  const id = form.dataset.id || '';
  const account = accountById(id);
  if (!account) {
    closeModal();
    toast('That account no longer exists.', 'error');
    return;
  }
  const typed = formValue(form, 'confirmation').trim();
  if (typed.toLowerCase() !== account.name.trim().toLowerCase()) {
    showFormError(form, `Type the account name exactly: ${account.name}`);
    return;
  }
  const snapshot = {
    accounts: state.accounts,
    transactions: state.transactions,
    recurring: state.recurring
  };
  const result = deleteAccountForever(id);
  const detail = result.rules ? ` and ${result.rules} ${plural(result.rules, 'recurring rule')}` : '';
  if (!persist('account', `Deleted account ${result.account.name} with ${result.removed} entries${detail}.`)) {
    state.accounts = snapshot.accounts;
    state.transactions = snapshot.transactions;
    state.recurring = snapshot.recurring;
    showFormError(form, 'The deletion could not be saved. Nothing was removed — try again.');
    return;
  }
  closeModal();
  refresh(`${result.account.name} deleted. ${result.removed} ${plural(result.removed, 'entry', 'entries')} removed and balances recalculated.`);
}

function reverseEntries(entries) {
  return entries.map((entry) => ({
    ...entry,
    debitCents: entry.creditCents,
    creditCents: entry.debitCents
  }));
}

function reverseTransaction(tx, reason) {
  if (!tx) throw new Error('Transaction not found.');
  if (tx.reversedBy) throw new Error('This transaction has already been reversed.');
  if (tx.type === 'opening' || tx.type === 'adjustment' || tx.type === 'reversal') {
    throw new Error('System entries are corrected through the account, not edited here.');
  }
  const reversal = {
    id: uid('txn'),
    ref: nextReference('RV', tx.date),
    type: 'reversal',
    date: tx.date,
    description: `Reversal — ${tx.description}`,
    payee: tx.payee,
    accountId: tx.accountId,
    toAccountId: tx.toAccountId,
    categoryId: tx.categoryId,
    amountCents: tx.amountCents,
    notes: String(reason || '').slice(0, 300),
    entries: reverseEntries(tx.entries),
    createdAt: nowISO(),
    updatedAt: nowISO(),
    recurringId: null,
    reverses: tx.id,
    reversedBy: null,
    replaces: null,
    source: 'correction'
  };
  validateLedgerEntries(reversal.entries, 'reversal');
  tx.reversedBy = reversal.id;
  tx.updatedAt = nowISO();
  state.transactions.push(reversal);
  return reversal;
}

function replaceTransaction(tx, draft) {
  if (!tx) throw new Error('Transaction not found.');
  if (tx.reversedBy) throw new Error('This transaction has already been corrected.');
  const cleanDraft = { ...draft, replaces: tx.id };
  const entries = buildTransactionEntries(cleanDraft);
  validateLedgerEntries(entries, cleanDraft.type);
  const reversal = reverseTransaction(tx, 'Replaced by a corrected entry.');
  const prefix = 'TX';
  const replacement = {
    id: uid('txn'),
    ref: nextReference(prefix, cleanDraft.date),
    type: cleanDraft.type,
    date: /^\d{4}-\d{2}-\d{2}$/.test(cleanDraft.date || '') ? cleanDraft.date : todayISO(),
    description: String(cleanDraft.description || '').trim().slice(0, 140) || 'Transaction',
    payee: String(cleanDraft.payee || '').trim().slice(0, 100),
    accountId: cleanDraft.accountId || null,
    toAccountId: cleanDraft.toAccountId || null,
    categoryId: cleanDraft.categoryId || null,
    amountCents: toInt(cleanDraft.amountCents, 0),
    notes: String(cleanDraft.notes || '').trim().slice(0, 400),
    entries,
    createdAt: nowISO(),
    updatedAt: nowISO(),
    recurringId: cleanDraft.recurringId || null,
    reverses: null,
    reversedBy: null,
    replaces: tx.id,
    source: 'correction'
  };
  state.transactions.push(replacement);
  return { reversal, replacement };
}

function voidTransaction(tx) {
  const reversal = reverseTransaction(tx, 'Transaction voided.');
  return reversal;
}

function postReconciliationAdjustment(account, statementCents, note) {
  const current = accountBalance(account.id);
  const diff = toInt(statementCents, 0) - current;
  if (diff === 0) return null;
  const amount = Math.abs(diff);
  const up = diff > 0;
  let entries;
  if (accountNature(account) === 'asset') {
    entries = up
      ? [makeEntry({ accountId: account.id, debitCents: amount, memo: 'Reconciliation increase' }), makeEntry({ equity: true, creditCents: amount, memo: 'Reconciliation adjustment' })]
      : [makeEntry({ accountId: account.id, creditCents: amount, memo: 'Reconciliation decrease' }), makeEntry({ equity: true, debitCents: amount, memo: 'Reconciliation adjustment' })];
  } else {
    entries = up
      ? [makeEntry({ accountId: account.id, creditCents: amount, memo: 'Reconciliation increase' }), makeEntry({ equity: true, debitCents: amount, memo: 'Reconciliation adjustment' })]
      : [makeEntry({ accountId: account.id, debitCents: amount, memo: 'Reconciliation decrease' }), makeEntry({ equity: true, creditCents: amount, memo: 'Reconciliation adjustment' })];
  }
  validateLedgerEntries(entries, 'adjustment');
  const tx = {
    id: uid('txn'),
    ref: nextReference('ADJ', todayISO()),
    type: 'adjustment',
    date: todayISO(),
    description: `Balance adjustment — ${account.name}`,
    payee: account.institution || '',
    accountId: account.id,
    toAccountId: null,
    categoryId: null,
    amountCents: amount,
    notes: String(note || '').trim().slice(0, 300) || `Statement balance ${money(statementCents)}; ledger balance ${money(current)}.`,
    entries,
    createdAt: nowISO(),
    updatedAt: nowISO(),
    recurringId: null,
    reverses: null,
    reversedBy: null,
    replaces: null,
    source: 'reconciliation'
  };
  state.transactions.push(tx);
  return tx;
}

/* ---------------------------------------------------------------
   Reporting helpers
   --------------------------------------------------------------- */
function entryAmountForCategory(entry, category) {
  if (!category) return 0;
  return category.type === 'expense'
    ? entry.debitCents - entry.creditCents
    : entry.creditCents - entry.debitCents;
}

function categoryTotal(categoryId, start, end) {
  const category = categoryById(categoryId);
  let total = 0;
  for (const tx of state.transactions) {
    if (start && tx.date < start) continue;
    if (end && tx.date > end) continue;
    for (const entry of tx.entries) {
      if (entry.categoryId === categoryId) total += entryAmountForCategory(entry, category);
    }
  }
  return total;
}

function categoryTotalForMonth(categoryId, month) {
  return categoryTotal(categoryId, monthStart(month), monthEnd(month));
}

function monthTotals(month) {
  const start = monthStart(month);
  const end = monthEnd(month);
  let income = 0;
  let expense = 0;
  const byCategory = new Map();
  for (const tx of state.transactions) {
    if (tx.date < start || tx.date > end) continue;
    for (const entry of tx.entries) {
      if (!entry.categoryId) continue;
      const category = categoryById(entry.categoryId);
      const amount = entryAmountForCategory(entry, category);
      if (category.type === 'income') income += amount;
      else if (category.type === 'expense') {
        expense += amount;
        byCategory.set(category.id, (byCategory.get(category.id) || 0) + amount);
      }
    }
  }
  return { income, expense, net: income - expense, byCategory };
}

function budgetsForMonth(month) {
  const map = new Map();
  for (const budget of state.budgets) {
    if (budget.month === month && budget.limitCents > 0) map.set(budget.categoryId, budget.limitCents);
  }
  return map;
}

function setBudget(month, categoryId, limitCents) {
  const existing = state.budgets.find((b) => b.month === month && b.categoryId === categoryId);
  const limit = Math.max(0, toInt(limitCents, 0));
  if (!limit) {
    state.budgets = state.budgets.filter((b) => !(b.month === month && b.categoryId === categoryId));
    return;
  }
  if (existing) existing.limitCents = limit;
  else state.budgets.push({ month, categoryId, limitCents: limit });
}

function budgetTotals(month) {
  const budgets = budgetsForMonth(month);
  const totals = monthTotals(month);
  let limit = 0;
  let spent = 0;
  const rows = [];
  for (const [categoryId, limitCents] of budgets) {
    const category = categoryById(categoryId);
    const spentCents = totals.byCategory.get(categoryId) || 0;
    limit += limitCents;
    spent += spentCents;
    rows.push({ category, limitCents, spentCents, remainingCents: limitCents - spentCents });
  }
  rows.sort((a, b) => {
    const ga = GROUPS[a.category.group] ? GROUPS[a.category.group].order : 99;
    const gb = GROUPS[b.category.group] ? GROUPS[b.category.group].order : 99;
    return ga - gb || a.category.name.localeCompare(b.category.name);
  });
  const unbudgeted = [...totals.byCategory.entries()]
    .filter(([categoryId]) => !budgets.has(categoryId) && categoryById(categoryId).type === 'expense')
    .map(([categoryId, spentCents]) => ({ category: categoryById(categoryId), spentCents }))
    .sort((a, b) => b.spentCents - a.spentCents);
  return {
    month,
    rows,
    limit,
    spent,
    remaining: limit - spent,
    unbudgeted,
    unbudgetedTotal: sum(unbudgeted.map((u) => u.spentCents)),
    pct: safePct(spent, limit)
  };
}

function copyBudgets(fromMonth, toMonth) {
  const source = state.budgets.filter((b) => b.month === fromMonth && b.limitCents > 0);
  state.budgets = state.budgets.filter((b) => b.month !== toMonth);
  source.forEach((b) => state.budgets.push({ month: toMonth, categoryId: b.categoryId, limitCents: b.limitCents }));
  return source.length;
}

function activeRecurring() {
  return state.recurring.filter((r) => r.active);
}

function occurrencesThrough(rule, throughDate, cap = 40) {
  const dates = [];
  let next = rule.nextDate;
  let guard = 0;
  while (next <= throughDate && guard < cap) {
    dates.push(next);
    next = advanceDate(next, rule.frequency);
    guard += 1;
  }
  return dates;
}

function upcomingRules(days = 14) {
  const today = todayISO();
  const through = addDays(today, days);
  const list = [];
  for (const rule of activeRecurring()) {
    const dates = occurrencesThrough(rule, through);
    dates.forEach((date) => {
      list.push({ rule, dueDate: date, overdue: date < today });
    });
  }
  list.sort((a, b) => a.dueDate.localeCompare(b.dueDate));
  return list;
}

function nextRuleOccurrence(rule) {
  return rule ? { rule, dueDate: rule.nextDate, overdue: rule.nextDate < todayISO() } : null;
}

function ruleLeavesSpendable(rule) {
  if (!rule || rule.kind === 'income') return false;
  const source = accountById(rule.accountId);
  if (!source || accountNature(source) !== 'asset' || !source.spendable) return false;
  if (rule.kind === 'transfer') {
    const destination = accountById(rule.toAccountId);
    if (!destination) return false;
    const staysSpendable = accountNature(destination) === 'asset' && destination.spendable;
    if (staysSpendable) return false;
  }
  return true;
}

function monthlyRuleAmount(rule) {
  if (rule.frequency === 'weekly') return rule.amountCents * 52 / 12;
  if (rule.frequency === 'biweekly') return rule.amountCents * 26 / 12;
  if (rule.frequency === 'yearly') return rule.amountCents / 12;
  return rule.amountCents;
}

function recurringMonthlyLoad() {
  let total = 0;
  for (const rule of activeRecurring()) {
    if (!ruleLeavesSpendable(rule)) continue;
    total += monthlyRuleAmount(rule);
  }
  return Math.round(total);
}

function recurringMonthlyIncome() {
  let total = 0;
  for (const rule of activeRecurring()) {
    if (rule.kind !== 'income') continue;
    total += monthlyRuleAmount(rule);
  }
  return Math.round(total);
}

function goalSaved(goal) {
  return sum(goal.contributions.map((c) => c.amountCents));
}

function activeGoals() {
  return state.goals.filter((g) => !g.archived);
}

function reservedForGoals() {
  return activeGoals().reduce((total, goal) => total + Math.max(0, goalSaved(goal)), 0);
}

function safeToSpend() {
  const today = todayISO();
  const through = addDays(today, state.profile.safeWindowDays);
  const accounts = spendableAccounts();
  const liquid = accounts.reduce((total, acc) => total + accountBalance(acc.id), 0);
  let bills = 0;
  const billRows = [];
  for (const rule of activeRecurring()) {
    if (!ruleLeavesSpendable(rule)) continue;
    const dates = occurrencesThrough(rule, through);
    dates.forEach((dueDate) => {
      bills += rule.amountCents;
      billRows.push({ rule, dueDate, amountCents: rule.amountCents, overdue: dueDate < today });
    });
  }
  billRows.sort((a, b) => a.dueDate.localeCompare(b.dueDate));
  const reserved = reservedForGoals();
  const buffer = Math.max(0, toInt(state.profile.bufferCents, 0));
  return {
    liquid,
    bills,
    reserved,
    buffer,
    safe: liquid - bills - reserved - buffer,
    accounts,
    billRows,
    window: state.profile.safeWindowDays,
    through
  };
}

function monthlyCashflow(months) {
  return months.map((month) => {
    const totals = monthTotals(month);
    return { month, income: totals.income, expense: totals.expense, net: totals.net };
  });
}

function netWorthSeries(months) {
  return months.map((month) => {
    const asOf = month === currentMonthKey() ? todayISO() : monthEnd(month);
    return { month, value: accountTotals(asOf).net };
  });
}

function spendingByCategory(month, limit = 8) {
  const totals = monthTotals(month);
  const rows = [...totals.byCategory.entries()]
    .map(([categoryId, spentCents]) => ({ category: categoryById(categoryId), spentCents }))
    .filter((row) => row.spentCents > 0)
    .sort((a, b) => b.spentCents - a.spentCents);
  const top = rows.slice(0, limit);
  const rest = rows.slice(limit);
  if (rest.length) {
    top.push({
      category: { id: 'cat_other', name: 'Everything else', color: '#9a958b', group: 'other' },
      spentCents: sum(rest.map((r) => r.spentCents)),
      combined: true
    });
  }
  return top;
}

function txKindLabel(tx) {
  switch (tx.type) {
    case 'income': return 'Income';
    case 'expense': return 'Expense';
    case 'transfer': return 'Transfer';
    case 'opening': return 'Opening balance';
    case 'adjustment': return 'Balance adjustment';
    case 'reversal': return 'Reversal';
    default: return 'Transaction';
  }
}

function txTitle(tx) {
  if (tx.type === 'opening') return `Opening balance`;
  if (tx.type === 'adjustment') return 'Balance adjustment';
  return tx.payee || tx.description || txKindLabel(tx);
}

function txSubtitle(tx) {
  if (tx.type === 'transfer') {
    const from = accountById(tx.accountId);
    const to = accountById(tx.toAccountId);
    return `${from ? from.name : 'Account'} → ${to ? to.name : 'Account'}`;
  }
  if (tx.type === 'opening' || tx.type === 'adjustment') {
    const account = accountById(tx.accountId);
    return account ? account.name : 'Account';
  }
  if (tx.type === 'reversal') return tx.reverses ? 'Reverses an earlier entry' : 'Reversal';
  const category = tx.categoryId ? categoryById(tx.categoryId) : null;
  const account = tx.accountId ? accountById(tx.accountId) : null;
  return [category && category.name, account && account.name].filter(Boolean).join(' · ');
}

function txSignedAmount(tx) {
  const amount = money(tx.amountCents);
  if (tx.type === 'income') return `+${amount}`;
  if (tx.type === 'expense') return `−${amount}`;
  if (tx.type === 'transfer') return amount;
  if (tx.type === 'adjustment') return amount;
  return amount;
}

function txAmountClass(tx) {
  if (tx.type === 'income') return 'income';
  if (tx.type === 'expense') return 'expense';
  if (tx.type === 'transfer') return 'transfer';
  return '';
}

function visibleTransactions() {
  return state.transactions.filter((tx) => tx.type !== 'reversal');
}

function buildForecast(days) {
  const start = spendableAccounts().reduce((total, acc) => total + accountBalance(acc.id), 0);
  const today = todayISO();
  const through = addDays(today, days);
  const events = [];
  for (const rule of activeRecurring()) {
    const dates = occurrencesThrough(rule, through);
    for (const dueDate of dates) {
      const source = accountById(rule.accountId);
      const destination = rule.toAccountId ? accountById(rule.toAccountId) : null;
      let delta = 0;
      if (rule.kind === 'income') {
        if (source && accountNature(source) === 'asset' && source.spendable) delta += rule.amountCents;
      } else if (rule.kind === 'expense') {
        if (source && accountNature(source) === 'asset' && source.spendable) delta -= rule.amountCents;
      } else if (rule.kind === 'transfer') {
        if (source && accountNature(source) === 'asset' && source.spendable) delta -= rule.amountCents;
        if (destination && accountNature(destination) === 'asset' && destination.spendable) delta += rule.amountCents;
      }
      if (!delta) continue;
      events.push({
        rule,
        dueDate,
        effectiveDate: dueDate < today ? today : dueDate,
        deltaCents: delta,
        overdue: dueDate < today
      });
    }
  }
  events.sort((a, b) => a.effectiveDate.localeCompare(b.effectiveDate) || a.rule.name.localeCompare(b.rule.name));
  const points = [{ date: today, value: start }];
  let running = start;
  for (const event of events) {
    running += event.deltaCents;
    const last = points[points.length - 1];
    if (last.date === event.effectiveDate) last.value = running;
    else points.push({ date: event.effectiveDate, value: running });
  }
  const values = points.map((p) => p.value);
  return {
    start,
    through,
    days,
    points,
    events,
    end: running,
    lowest: Math.min(...values),
    highest: Math.max(...values),
    change: running - start
  };
}

function simulateDebt(extraCents = 0, strategy = 'avalanche') {
  const debts = activeAccounts()
    .filter((acc) => accountNature(acc) === 'liability' && accountBalance(acc.id) > 0)
    .map((acc) => ({
      id: acc.id,
      name: acc.name,
      balance: accountBalance(acc.id),
      apr: Number(acc.apr) || 0,
      minPayment: Math.max(0, toInt(acc.minPaymentCents, 0)),
      original: accountBalance(acc.id)
    }));
  if (!debts.length) return { empty: true, debts: [] };

  const startDebts = debts.map((d) => ({ ...d }));
  let extra = Math.max(0, toInt(extraCents, 0));
  let totalInterest = 0;
  let months = 0;
  const payoffOrder = [];
  const balancesOverTime = [];

  for (let m = 0; m < 600; m += 1) {
    const open = debts.filter((d) => d.balance > 0);
    if (!open.length) break;
    months += 1;

    for (const debt of open) {
      const interest = debt.apr > 0 ? Math.round(debt.balance * (debt.apr / 100 / 12)) : 0;
      debt.balance += interest;
      totalInterest += interest;
    }

    const sorted = [...debts].filter((d) => d.balance > 0).sort((a, b) => {
      if (strategy === 'snowball') return a.balance - b.balance || a.apr - b.apr || a.name.localeCompare(b.name);
      return b.apr - a.apr || a.balance - b.balance || a.name.localeCompare(b.name);
    });

    let left = extra;
    for (const debt of sorted) {
      const minimum = debt.minPayment > 0 ? debt.minPayment : Math.max(1, Math.ceil(debt.balance * 0.02));
      const pay = Math.min(debt.balance, minimum);
      debt.balance -= pay;
      if (debt.balance <= 0) {
        debt.balance = 0;
        if (!payoffOrder.some((d) => d.id === debt.id)) payoffOrder.push({ id: debt.id, name: debt.name });
      }
    }
    for (const debt of sorted) {
      if (left <= 0) break;
      if (debt.balance <= 0) continue;
      const pay = Math.min(debt.balance, left);
      debt.balance -= pay;
      left -= pay;
      if (debt.balance <= 0) {
        debt.balance = 0;
        if (!payoffOrder.some((d) => d.id === debt.id)) payoffOrder.push({ id: debt.id, name: debt.name });
      }
    }

    balancesOverTime.push({
      month: m + 1,
      total: sum(debts.map((d) => d.balance))
    });
  }

  const finished = debts.every((d) => d.balance <= 0);
  return {
    empty: false,
    months,
    finished,
    totalInterest,
    payoffOrder,
    balancesOverTime,
    debts: startDebts,
    monthlyPayment: sum(startDebts.map((d) => d.minPayment)) + extra,
    extraCents: extra,
    strategy
  };
}

function buildInsights(month) {
  const insights = [];
  const totals = monthTotals(month);
  const budget = budgetTotals(month);
  const safe = safeToSpend();
  const overspent = budget.rows.filter((r) => r.spentCents > r.limitCents)
    .sort((a, b) => (b.spentCents - b.limitCents) - (a.spentCents - a.limitCents));
  if (overspent.length) {
    const top = overspent[0];
    insights.push({
      tone: 'alert',
      text: `<strong>${esc(top.category.name)}</strong> is ${money(top.spentCents - top.limitCents)} over its budget with ${daysLeftInMonth(month)} days left.`,
      small: `${overspent.length} budgeted ${plural(overspent.length, 'category', 'categories')} over limit`,
      action: 'budgets'
    });
  } else if (budget.limit > 0) {
    insights.push({
      tone: 'good',
      text: `<strong>Every budgeted category is within its limit.</strong>`,
      small: `${money(budget.remaining)} still unspent of ${money(budget.limit)}`,
      action: 'budgets'
    });
  }
  if (totals.income > 0) {
    const rate = safePct(totals.net, totals.income);
    const target = Number(state.profile.savingsTargetPct) || 0;
    insights.push({
      tone: rate >= target ? 'good' : 'warn',
      text: `<strong>You kept ${percent(rate, 0)} of income</strong> this month${target ? ` against a ${target}% target` : ''}.`,
      small: `${money(totals.income)} in, ${money(totals.expense)} out`,
      action: 'reports'
    });
  }
  if (safe.bills > 0) {
    insights.push({
      tone: safe.safe < 0 ? 'alert' : 'warn',
      text: safe.safe < 0
        ? `<strong>Planned outflows exceed available cash</strong> by ${money(Math.abs(safe.safe))} after your buffer and goals.`
        : `<strong>${money(safe.bills)} of bills are due</strong> in the next ${safe.window} days.`,
      small: safe.safe < 0 ? 'Review bills or move less into goals' : `${money(safe.liquid)} is spendable before reserves`,
      action: 'plan'
    });
  }
  if (reservedForGoals() > 0) {
    insights.push({
      tone: 'neutral',
      text: `<strong>${money(reservedForGoals())}</strong> is earmarked across ${activeGoals().length} active ${plural(activeGoals().length, 'goal')}.`,
      small: 'Reserved money is not counted in safe to spend',
      action: 'plan'
    });
  }
  if (!budget.limit) {
    insights.push({
      tone: 'warn',
      text: '<strong>No budgets set for this month.</strong> Give each category a limit to make spending decisions easier.',
      small: 'Budgets are the plan, not a restriction',
      action: 'budgets'
    });
  }
  if (!insights.length) {
    insights.push({
      tone: 'neutral',
      text: '<strong>Your ledger is quiet.</strong> Add income and spending to see useful patterns here.',
      small: 'Every number will be traceable',
      action: 'transactions'
    });
  }
  return insights.slice(0, 3);
}

function integrityReport() {
  const problems = [];
  let balanced = 0;
  let entryCount = 0;
  for (const tx of state.transactions) {
    try {
      if (!Array.isArray(tx.entries) || tx.entries.length < 2) throw new Error('too few journal entries');
      let debits = 0;
      let credits = 0;
      for (const entry of tx.entries) {
        if (!Number.isInteger(entry.debitCents) || !Number.isInteger(entry.creditCents)) throw new Error('non-integer amount');
        if (entry.debitCents < 0 || entry.creditCents < 0) throw new Error('negative amount');
        if (entry.debitCents > 0 && entry.creditCents > 0) throw new Error('both debit and credit');
        if (entry.debitCents === 0 && entry.creditCents === 0) throw new Error('empty line');
        if (entry.accountId && !accountById(entry.accountId)) throw new Error('missing account');
        if (entry.categoryId && !state.categories.some((c) => c.id === entry.categoryId)) throw new Error('missing category');
        debits += entry.debitCents;
        credits += entry.creditCents;
        entryCount += 1;
      }
      if (debits !== credits) throw new Error(`unbalanced by ${Math.abs(debits - credits)} cents`);
      balanced += 1;
    } catch (err) {
      problems.push(`${tx.ref || 'Transaction'}: ${err.message}`);
    }
  }
  for (const budget of state.budgets) {
    if (!state.categories.some((c) => c.id === budget.categoryId)) {
      problems.push(`Budget for ${budget.month} points to a missing category.`);
    }
  }
  for (const bill of state.recurring) {
    if (!accountById(bill.accountId)) problems.push(`“${bill.name}” points to a missing account.`);
    if (bill.kind === 'transfer' && !accountById(bill.toAccountId)) problems.push(`“${bill.name}” transfer is missing a destination.`);
  }
  for (const goal of state.goals) {
    if (goalSaved(goal) < 0) problems.push(`“${goal.name}” has a negative reserved balance.`);
  }
  const totals = accountTotals();
  let ledgerDebits = 0;
  let ledgerCredits = 0;
  for (const tx of state.transactions) {
    for (const entry of tx.entries) {
      ledgerDebits += entry.debitCents;
      ledgerCredits += entry.creditCents;
    }
  }
  return {
    ok: problems.length === 0,
    problems,
    checked: state.transactions.length,
    balanced,
    entries: entryCount,
    debits: ledgerDebits,
    credits: ledgerCredits,
    netWorth: totals.net,
    accounts: state.accounts.length
  };
}

function storageBytes() {
  try {
    const raw = localStorage.getItem(DB_KEY) || '';
    return new Blob([raw]).size;
  } catch (e) {
    return 0;
  }
}

/* ---------------------------------------------------------------
   Hand-built SVG charts
   --------------------------------------------------------------- */
let chartSeq = 0;

function chartId(prefix) {
  chartSeq += 1;
  return `${prefix}-${chartSeq}`;
}

function chartLabelPoints(points, maxLabels) {
  const n = points.length;
  if (!n) return [];
  if (n <= maxLabels) return points.map((p, i) => ({ ...p, showLabel: true }));
  const shown = new Set();
  for (let i = 0; i < maxLabels; i += 1) {
    shown.add(Math.round(i * (n - 1) / (maxLabels - 1)));
  }
  return points.map((p, i) => ({ ...p, showLabel: shown.has(i) }));
}

function niceMax(value) {
  if (!value || value <= 0) return 100;
  const magnitude = Math.pow(10, Math.floor(Math.log10(value)));
  const normalized = value / magnitude;
  let step;
  if (normalized <= 1) step = 1;
  else if (normalized <= 2) step = 2;
  else if (normalized <= 5) step = 5;
  else step = 10;
  return step * magnitude;
}

function sparkline(values, opts = {}) {
  const width = opts.width || 420;
  const height = opts.height || 64;
  const color = opts.color || '#bfe5cd';
  const numeric = values.map((v) => Number(v) || 0);
  if (!numeric.length) return '';
  const min = Math.min(...numeric);
  const max = Math.max(...numeric);
  const span = max - min || 1;
  const padX = 2;
  const padY = 6;
  const stepX = numeric.length > 1 ? (width - padX * 2) / (numeric.length - 1) : 0;
  const points = numeric.map((v, i) => ({
    x: padX + i * stepX,
    y: padY + (1 - (v - min) / span) * (height - padY * 2)
  }));
  const line = points.map((p, i) => `${i ? 'L' : 'M'}${p.x.toFixed(2)} ${p.y.toFixed(2)}`).join(' ');
  const area = `${line} L${(padX + (numeric.length - 1) * stepX).toFixed(2)} ${height} L${padX} ${height} Z`;
  const gid = chartId('spark');
  return `<svg class="chart-svg" viewBox="0 0 ${width} ${height}" role="img" aria-label="${esc(opts.label || 'Trend line')}" preserveAspectRatio="none">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity=".24"/>
      <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${area}" fill="url(#${gid})"/>
    <path d="${line}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    <circle cx="${points[points.length - 1].x.toFixed(2)}" cy="${points[points.length - 1].y.toFixed(2)}" r="3" fill="${color}"/>
  </svg>`;
}

function lineChart(points, opts = {}) {
  const width = opts.width || 620;
  const height = opts.height || 210;
  const color = opts.color || '#2b6a4b';
  const fill = opts.fill !== false;
  const showGrid = opts.showGrid !== false;
  const showX = opts.showX !== false;
  const showY = opts.showY !== false;
  const maxLabels = opts.maxLabels || 6;
  if (!points || !points.length) {
    return `<div class="chart-empty">${esc(opts.empty || 'No data for this period yet.')}</div>`;
  }
  const pad = {
    top: 12,
    right: 10,
    bottom: showX ? 26 : 8,
    left: showY ? 54 : 8
  };
  const values = points.map((p) => Number(p.value) || 0);
  let min = Math.min(...values);
  let max = Math.max(...values);
  if (opts.includeZero) {
    min = Math.min(0, min);
    max = Math.max(0, max);
  }
  if (min === max) {
    const room = Math.abs(min) * 0.08 || 100;
    min -= room;
    max += room;
  }
  const span = max - min || 1;
  const chartW = width - pad.left - pad.right;
  const chartH = height - pad.top - pad.bottom;
  const stepX = points.length > 1 ? chartW / (points.length - 1) : 0;
  const coords = points.map((p, i) => {
    const value = Number(p.value) || 0;
    return {
      ...p,
      x: pad.left + (points.length > 1 ? i * stepX : chartW / 2),
      y: pad.top + (1 - (value - min) / span) * chartH
    };
  });
  const line = coords.map((p, i) => `${i ? 'L' : 'M'}${p.x.toFixed(2)} ${p.y.toFixed(2)}`).join(' ');
  const bottom = pad.top + chartH;
  const area = `${line} L${coords[coords.length - 1].x.toFixed(2)} ${bottom.toFixed(2)} L${coords[0].x.toFixed(2)} ${bottom.toFixed(2)} Z`;
  const gid = chartId('line');
  const ticks = [max, min + span / 2, min];
  const labels = chartLabelPoints(coords, maxLabels);
  const zeroY = pad.top + (1 - (0 - min) / span) * chartH;
  return `<svg class="chart-svg" viewBox="0 0 ${width} ${height}" role="img" aria-label="${esc(opts.label || 'Line chart')}">
    <defs>
      <linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${color}" stop-opacity=".18"/>
        <stop offset="100%" stop-color="${color}" stop-opacity=".01"/>
      </linearGradient>
    </defs>
    ${showGrid ? ticks.map((tick) => {
      const y = pad.top + (1 - (tick - min) / span) * chartH;
      return `<line x1="${pad.left}" y1="${y.toFixed(2)}" x2="${width - pad.right}" y2="${y.toFixed(2)}" stroke="#ece4d6" stroke-width="1"/>
        <text x="${pad.left - 9}" y="${(y + 3).toFixed(2)}" text-anchor="end" font-size="9" fill="#8b958c" font-family="Inter, sans-serif">${esc(money(tick, { compact: true }))}</text>`;
    }).join('') : ''}
    ${min < 0 && max > 0 ? `<line x1="${pad.left}" y1="${zeroY.toFixed(2)}" x2="${width - pad.right}" y2="${zeroY.toFixed(2)}" stroke="#d3c6b2" stroke-width="1" stroke-dasharray="3 3"/>` : ''}
    ${fill ? `<path d="${area}" fill="url(#${gid})"/>` : ''}
    <path d="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    ${coords.map((p, i) => i === coords.length - 1
      ? `<circle cx="${p.x.toFixed(2)}" cy="${p.y.toFixed(2)}" r="3.2" fill="${color}" stroke="#fffcf6" stroke-width="1.6"><title>${esc(p.label || '')}: ${esc(money(p.value))}</title></circle>`
      : `<circle cx="${p.x.toFixed(2)}" cy="${p.y.toFixed(2)}" r="2.1" fill="${color}" opacity=".55"><title>${esc(p.label || '')}: ${esc(money(p.value))}</title></circle>`
    ).join('')}
    ${showX ? labels.filter((p) => p.showLabel).map((p) => `<text x="${p.x.toFixed(2)}" y="${height - 7}" text-anchor="middle" font-size="9" fill="#8b958c" font-family="Inter, sans-serif">${esc(p.label || '')}</text>`).join('') : ''}
  </svg>`;
}

function cashflowChart(data, opts = {}) {
  const width = opts.width || 640;
  const height = opts.height || 230;
  if (!data || !data.length) {
    return `<div class="chart-empty">${esc(opts.empty || 'No cash flow yet.')}</div>`;
  }
  const pad = { top: 14, right: 8, bottom: 26, left: 52 };
  const chartW = width - pad.left - pad.right;
  const chartH = height - pad.top - pad.bottom;
  const max = niceMax(Math.max(...data.map((d) => Math.max(d.income, d.expense)), 1));
  const groupW = chartW / data.length;
  const barW = Math.min(18, Math.max(7, groupW * .22));
  const gap = Math.max(3, groupW * .05);
  const ticks = [max, max / 2, 0];
  return `<svg class="chart-svg" viewBox="0 0 ${width} ${height}" role="img" aria-label="${esc(opts.label || 'Income and spending by month')}">
    ${ticks.map((tick) => {
      const y = pad.top + (1 - tick / max) * chartH;
      return `<line x1="${pad.left}" y1="${y.toFixed(2)}" x2="${width - pad.right}" y2="${y.toFixed(2)}" stroke="#ece4d6" stroke-width="1"/>
        <text x="${pad.left - 8}" y="${(y + 3).toFixed(2)}" text-anchor="end" font-size="9" fill="#8b958c" font-family="Inter, sans-serif">${esc(money(tick, { compact: true }))}</text>`;
    }).join('')}
    ${data.map((d, i) => {
      const cx = pad.left + groupW * i + groupW / 2;
      const inH = Math.max(2, (d.income / max) * chartH);
      const outH = Math.max(2, (d.expense / max) * chartH);
      const inX = cx - barW - gap / 2;
      const outX = cx + gap / 2;
      return `<g>
        <rect x="${inX.toFixed(2)}" y="${(pad.top + chartH - inH).toFixed(2)}" width="${barW.toFixed(2)}" height="${inH.toFixed(2)}" rx="3" fill="#245a40"><title>${esc(d.label || monthShort(d.month))} income: ${esc(money(d.income))}</title></rect>
        <rect x="${outX.toFixed(2)}" y="${(pad.top + chartH - outH).toFixed(2)}" width="${barW.toFixed(2)}" height="${outH.toFixed(2)}" rx="3" fill="#d3b39d"><title>${esc(d.label || monthShort(d.month))} spending: ${esc(money(d.expense))}</title></rect>
        <text x="${cx.toFixed(2)}" y="${height - 7}" text-anchor="middle" font-size="9" fill="#8b958c" font-family="Inter, sans-serif">${esc(d.label || monthShort(d.month))}</text>
      </g>`;
    }).join('')}
  </svg>`;
}

function debtChart(series, opts = {}) {
  if (!series || !series.length) return `<div class="chart-empty">No payoff schedule.</div>`;
  const points = series.map((p, i) => ({
    label: `${i + 1} ${plural(i + 1, 'month')}`,
    value: p.total
  }));
  return lineChart(points, {
    ...opts,
    width: opts.width || 520,
    height: opts.height || 170,
    color: opts.color || '#a2645c',
    includeZero: true,
    maxLabels: 5,
    label: 'Debt balance over time'
  });
}

function monthSwitch() {
  return `<div class="month-switch" role="group" aria-label="Choose month">

}

function isSelected(value, current) {
  return String(value) === String(current) ? ' selected' : '';
}

function statusBadge(text, tone) {
  return `<span class="badge badge-${tone || 'neutral'}">${esc(text)}</span>`;
}

function accountSubtitle(account) {
  const type = accountTypeLabel(account);
  return account.institution ? `${type} · ${account.institution}` : type;
}

function accountBalanceClass(account) {
  const balance = accountBalance(account.id);
  return balance < 0 ? 'negative' : '';
}

function txCategoryName(tx) {
  if (tx.type === 'transfer') return 'Transfer';
  if (tx.type === 'opening') return 'Opening equity';
  if (tx.type === 'adjustment') return 'Equity adjustment';
  if (tx.type === 'reversal') return 'Correction';
  return tx.categoryId ? categoryById(tx.categoryId).name : 'Uncategorised';
}

function txCategoryColor(tx) {
  if (tx.type === 'transfer') return 'var(--sky)';
  if (tx.type === 'opening' || tx.type === 'adjustment') return 'var(--brass)';
  if (tx.type === 'reversal') return 'var(--negative)';
  return tx.categoryId ? categoryById(tx.categoryId).color : '#9a958b';
}

function txAccountName(tx) {
  if (tx.type === 'transfer') {
    const from = accountById(tx.accountId);
    const to = accountById(tx.toAccountId);
    return `${from ? from.name : 'Account'} → ${to ? to.name : 'Account'}`;
  }
  const account = tx.accountId ? accountById(tx.accountId) : null;
  return account ? account.name : '—';
}

function txLedgerHint(tx) {
  if (tx.notes) return tx.notes;
  if (tx.type === 'transfer' || tx.type === 'opening' || tx.type === 'adjustment' || tx.type === 'reversal') {
    return txSubtitle(tx);
  }
  return tx.payee && tx.description && tx.description !== tx.payee ? tx.description : '';
}

function txSort(a, b) {
  return b.date.localeCompare(a.date) || String(b.createdAt).localeCompare(String(a.createdAt));
}

function recentTransactions(limit) {
  return state.transactions
    .filter((tx) => tx.type !== 'reversal')
    .slice()
    .sort(txSort)
    .slice(0, limit);
}

function txRowIcon(tx) {
  if (tx.type === 'income') return { name: 'arrow-down-right', cls: '' };
  if (tx.type === 'transfer') return { name: 'arrow-right-left', cls: 'sky' };
  if (tx.type === 'opening') return { name: 'database', cls: 'brass' };
  if (tx.type === 'adjustment') return { name: 'rotate-ccw', cls: 'brass' };
  if (tx.type === 'reversal') return { name: 'rotate-ccw', cls: 'rose' };
  return { name: 'arrow-up-right', cls: 'brass' };
}

function setupCard(monthBudget) {
  const hasAccount = activeAccounts().length > 0;
  const hasEntry = visibleTransactions().length > 0;
  const hasBudget = monthBudget.limit > 0;
  if (hasAccount && hasEntry && hasBudget) return '';
  const step = (done, number, title, copy, action, label) => `<div class="setup-step ${done ? 'done' : ''}">
    <span class="step-no">${done ? icon('check', 12) : number}</span>
    <div>
      <strong>${esc(title)}</strong>
      <p>${esc(copy)}</p>
      ${done ? '' : `<button type="button" class="link-btn" data-act="${action}">${esc(label)} ${icon('arrow-right', 12)}</button>`}
    </div>
  </div>`;
  return `<section class="card setup-card" aria-label="Set up your ledger">
    <div class="setup-head">
      <div>
        <div class="eyebrow">A good beginning</div>
        <h2 style="margin-top:8px">Set up your ledger</h2>
        <p class="page-sub" style="margin-top:5px">Three small steps turn an empty page into a useful picture of your money.</p>
      </div>
    </div>
    <div class="setup-steps">
      ${step(hasAccount, '1', 'Add an account', 'M-Pesa, a bank account, cash or savings.', 'add-account', 'Add account')}
      ${step(hasEntry, '2', 'Record an entry', 'Income, spending, or a transfer between accounts.', 'add-tx', 'Add transaction')}
      ${step(hasBudget, '3', 'Set a monthly limit', 'Give your main spending categories a plan.', 'edit-budget', 'Build a budget')}
    </div>
  </section>`;
}

function renderOverview() {
  const month = ui.month;
  const totals = monthTotals(month);
  const budget = budgetTotals(month);
  const safe = safeToSpend();
  const months = monthsEnding(month, 6);
  const balances = activeAccounts().slice().sort((a, b) => accountBalance(b.id) - accountBalance(a.id));
  const assetCount = balances.filter((acc) => accountNature(acc) === 'asset').length;
  const totalHeld = balances.reduce((sum, acc) => sum + (accountNature(acc) === 'liability' ? 0 : accountBalance(acc.id)), 0);

  const safeMeterPct = safe.liquid > 0 ? clamp((Math.max(0, safe.safe) / safe.liquid) * 100, 0, 100) : 0;
  const safeMeterClass = safe.safe < 0 ? 'over' : safe.safe < safe.liquid * 0.2 ? 'warn' : '';

  const cashflow = monthlyCashflow(months).map((row) => ({ ...row, label: monthShort(row.month) }));
  const topBudgets = budget.rows.slice()
    .sort((a, b) => b.spentCents - a.spentCents || b.limitCents - a.limitCents)
    .slice(0, 5);

  const recent = recentTransactions(6);
  const upcoming = upcomingRules(14).filter((row) => row.rule.kind !== 'income').slice(0, 5);
  const insights = buildInsights(month);
  const actionLabel = {
    budgets: 'Open budgets', reports: 'Open reports', plan: 'Open plan', transactions: 'Open activity'
  };
  const insightIcon = { alert: 'alert', warn: 'alert', good: 'check-circle', neutral: 'sparkle' };

  const budgetBars = topBudgets.map((row) => {
    const pct = clamp(safePct(row.spentCents, row.limitCents), 0, 100);

    return `<div>
      <div class="mini-bar-top">

/* --------------------------------------------------------------- transactions */

function activeFilterCount() {
  const f = ui.txFilters;
  return [f.q.trim() !== '', f.type !== 'all', f.account !== 'all', f.category !== 'all', f.corrections].filter(Boolean).length;
}

function filteredTransactions() {
  const f = ui.txFilters;
  const query = f.q.trim().toLowerCase();
  return state.transactions.filter((tx) => {
    if (!f.corrections && tx.type === 'reversal') return false;
    if (f.type !== 'all' && tx.type !== f.type) return false;
    if (f.account !== 'all' && !tx.entries.some((entry) => entry.accountId === f.account)) return false;
    if (f.category !== 'all' && !tx.entries.some((entry) => entry.categoryId === f.category)) return false;
    if (query) {
      const haystack = [
        tx.description, tx.payee, tx.notes, tx.ref,
        tx.categoryId ? categoryById(tx.categoryId).name : '',
        txAccountName(tx)
      ].join(' ').toLowerCase();
      if (!haystack.includes(query)) return false;
    }
    return true;
  }).sort(txSort);
}

function transactionLedgerMarkup() {
  const all = filteredTransactions();
  const perPage = 12;
  const totalPages = Math.max(1, Math.ceil(all.length / perPage));
  if (ui.txFilters.page > totalPages) ui.txFilters.page = totalPages;
  if (ui.txFilters.page < 1) ui.txFilters.page = 1;
  const start = (ui.txFilters.page - 1) * perPage;
  const rows = all.slice(start, start + perPage);

  if (!rows.length) {
    const filtered = activeFilterCount() > 0;
    return `<div class="ledger"><div class="empty" style="padding:46px 24px">
      <div class="empty-icon">${icon('search', 20)}</div>
      <h3>${filtered ? 'No entries match those filters' : 'Your ledger is ready'}</h3>
      <p>${filtered ? 'Try a different search, account or category.' : 'Record income, spending or a transfer. Each entry will be balanced and editable through a correction.'}</p>
      ${filtered
        ? `<button class="btn btn-secondary btn-sm" data-act="clear-filters">Clear filters</button>`
        : `<button class="btn btn-primary btn-sm" data-act="add-tx">Add your first transaction</button>`}
    </div></div>`;
  }

  const rowsHtml = rows.map((tx) => {
    const date = parseDate(tx.date);
    const showYear = String(date.getFullYear()) !== String(new Date().getFullYear());
    const isCorrection = tx.type === 'reversal';
    const reversed = !!tx.reversedBy;
    const corrected = !!tx.replaces;
    return `<button type="button" class="ledger-row" data-act="open-tx" data-id="${esc(tx.id)}">
      <span class="tx-date"><span>${esc(monthShort(tx.date))}${showYear ? ` ${date.getFullYear()}` : ''}</span><strong>${date.getDate()}</strong></span>
      <span class="tx-main">
        <strong>${esc(txTitle(tx))}${reversed ? ' <span class="void-mark">· reversed</span>' : ''}${corrected ? ' <span class="void-mark" style="color:var(--brass-deep)">· correction</span>' : ''}${isCorrection ? ' <span class="void-mark">· correction</span>' : ''}</strong>
        <small>${[esc(txLedgerHint(tx)), tx.ref ? esc(tx.ref) : ''].filter(Boolean).join(' · ')}</small>
        <span class="tx-mobile-meta">${esc(txCategoryName(tx))} · ${esc(txAccountName(tx))}</span>
      </span>
      <span class="tx-cat"><span class="cat-dot" style="background:${txCategoryColor(tx)}"></span><span>${esc(txCategoryName(tx))}</span></span>
      <span class="tx-acct">${esc(txAccountName(tx))}</span>
      <span class="tx-amount ${esc(txAmountClass(tx))}">${esc(txSignedAmount(tx))}</span>
    </button>`;
  }).join('');

  return `<div class="ledger">
    <div class="ledger-head"><span>Date</span><span>Entry</span><span>Category</span><span>Account</span><span>Amount</span></div>
    ${rowsHtml}
    <div class="ledger-foot">
      <span>Showing ${start + 1}–${Math.min(all.length, start + perPage)} of ${all.length} ${plural(all.length, 'entry', 'entries')}</span>
      <div class="pagination">
        <button type="button" data-act="tx-page" data-page="${ui.txFilters.page - 1}" ${ui.txFilters.page <= 1 ? 'disabled' : ''} aria-label="Previous page">${icon('chevron-left', 14)}</button>
        <span>Page ${ui.txFilters.page} / ${totalPages}</span>
        <button type="button" data-act="tx-page" data-page="${ui.txFilters.page + 1}" ${ui.txFilters.page >= totalPages ? 'disabled' : ''} aria-label="Next page">${icon('chevron-right', 14)}</button>
      </div>
    </div>
  </div>`;
}

function refreshTxList() {
  const wrap = document.getElementById('tx-ledger-wrap');

function categoryFilterOptions(selected) {
