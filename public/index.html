      toast(`Added ${account.name}. The overdraft lines now post to it.`, 'success');
      return true;
    }
    case 'imp-next':
      if (imp.step === 1 && !imp.fileName) { toast('Choose a statement file first.', 'error'); return true; }
      if (imp.step === 1 && !imp.accountId) { toast('Choose the account the statement belongs to.', 'error'); return true; }
      if (imp.step === 2 && !imp.rows.length) { toast('No rows were recognised. Map the date and amount columns yourself.', 'error'); return true; }
      imp.step = Math.min(3, imp.step + 1);
      imp.page = 0;
      renderImportStep();
      return true;
    case 'imp-back':
      if (imp.step === 1) { closeModal(); imp = null; return true; }
      imp.step = imp.cols && imp.step === 3 ? 1 : Math.max(1, imp.step - 1);
      renderImportStep();
      return true;
    case 'imp-page': {
      const page = Number(target.dataset.page);
      if (Number.isFinite(page)) {
        imp.page = Math.max(0, page);
        renderImportStep();
      }
      return true;
    }
    case 'imp-bulk': {
      const applied = applyBulkCategory();
      if (!applied) toast('Pick a category to fill with first.', 'error');
      else renderImportStep();
      return true;
    }
    case 'imp-commit':
      commitImport();
      return true;
    default:
      return false;
  }
}

function applyBulkCategory() {
  const expense = imp.bulk.expense;
  const income = imp.bulk.income;
  let applied = 0;
  importVisibleRows().forEach((row) => {
    if (row.kind === 'transfer') return;
    if (row.categoryId) return;
    if (row.kind === 'income' && income) { row.categoryId = income; applied += 1; }
    else if (row.kind !== 'income' && expense) { row.categoryId = expense; applied += 1; }
  });
  return applied;
}

function handleImportChange(element) {
  if (!imp) return;
  const kind = element.dataset.imp;
  if (kind === 'smstext') {
    imp.smsText = element.value;
    imp.smsError = null;
    renderImportStep();
    return;
  }
  if (kind !== 'filter') { imp.error = null; imp.textError = null; }
  const index = element.dataset.row != null ? Number(element.dataset.row) : null;
  if (kind === 'account') {
    imp.accountId = element.value;
    buildImportRows();
    renderImportStep();
    return;
  }
  if (kind === 'map') {
    applyImportMap();
    renderImportStep();
    return;
  }
  if (kind === 'filter') {
    imp.filter = element.value;
    imp.page = 0;
    renderImportStep();
    return;
  }
  if (kind === 'bulk-expense' || kind === 'bulk-income') {
    imp.bulk[kind === 'bulk-expense' ? 'expense' : 'income'] = element.value;
    return;
  }
  if (!Number.isFinite(index)) return;
  const row = imp.rows.find((r) => r.index === index);
  if (!row) return;
  if (kind === 'include') row.include = element.checked;
  else if (kind === 'date') {
    if (/^\d{4}-\d{2}-\d{2}$/.test(element.value)) {
      row.date = element.value;
      row.dateGuessed = false;
      annotateImportChain(imp.rows);
    }
  } else if (kind === 'kind') {
    const allowed = importKindsFor(row);
    if (!allowed.includes(element.value)) return;
    if (element.value !== row.kind) {
      row.kind = element.value;
      row.categoryId = null;
      row.otherAccountId = null;
      row.autoCategory = false;
      row.autoTransfer = false;
    }
  } else if (kind === 'category') row.categoryId = element.value || null;
  else if (kind === 'other') row.otherAccountId = element.value || null;
  /* A row the importer excluded on its own comes back the moment he gives it what it was
     missing; a row he unticked himself stays unticked. */
  if (kind === 'include') row.autoExclude = false;
  else if (row.autoExclude) {
    row.include = true;
    row.autoExclude = false;
  }
  patchImportRow(index);
}

/* Categories are his job later, in the transaction editor — an import must still balance, so
   an unclassified row lands in Uncategorised (expense) or Other income rather than blocking. */
function fallbackImportCategory(kind) {
  const preferred = kind === 'income' ? ['cat_other_income', 'cat_side'] : ['cat_other', 'cat_business'];
  for (const id of preferred) {
    const cat = categoryById(id);
    if (cat && !cat.archived) return id;
  }
  const list = categoriesOf(kind === 'income' ? 'income' : 'expense');
  const byName = list.find((cat) => /uncategoris|other income|^other$/i.test(cat.name));
  return byName ? byName.id : (list[0] ? list[0].id : null);
}

/* The plain arithmetic he asked for: this account goes down, that one goes up. A liability
   moves the other way — money paid into it is debt he owes less of. */
function importMovementText(row, target) {
  const amount = money(row.cents, { whole: false });
  if (row.kind === 'transfer') {
    const other = accountById(row.otherAccountId);
    const otherName = other ? other.name : 'another account';
    const liability = other && accountNature(other) !== 'asset';
    const owe = liability ? 'owe ' : '';
    if (row.dir === 'out') {
      return `${esc(target.name)} −${esc(amount)} → ${esc(otherName)} ${owe}${liability ? '−' : '+'}${esc(amount)}`;
    }
    return `${esc(otherName)} ${owe}${liability ? '+' : '−'}${esc(amount)} → ${esc(target.name)} +${esc(amount)}`;
  }
  return row.dir === 'in' ? `${esc(target.name)} +${esc(amount)}` : `${esc(target.name)} −${esc(amount)}`;
}

function importMovements() {
  const deltas = new Map();
  const target = accountById(imp.accountId);
  if (!target) return deltas;
  imp.rows.filter(importRowEligible).forEach((row) => {
    const sign = row.dir === 'in' ? 1 : -1;
    const push = (account, cents) => {
      if (!account) return;
      const nature = accountNature(account);
      // A liability balance is what he owes, so money leaving it reduces the debt.
      const delta = nature === 'asset' ? cents : -cents;
      deltas.set(account.id, (deltas.get(account.id) || 0) + delta);
    };
    if (row.kind === 'transfer') {
      const other = accountById(row.otherAccountId);
      push(target, sign * row.cents);
      push(other, -sign * row.cents);
    } else {
      push(target, sign * row.cents);
    }
  });
  return deltas;
}

function importMovementMarkup() {
  const deltas = importMovements();
  if (!deltas.size) return '';
  const parts = [];
  deltas.forEach((cents, id) => {
    if (!cents) return;
    const account = accountById(id);
    if (!account) return;
    const liability = accountNature(account) !== 'asset';
    parts.push(`<span>${esc(account.name)} <strong class="${cents > 0 ? 'pos' : 'neg'}">${liability ? 'owe ' : ''}${cents > 0 ? '+' : '−'}${esc(money(Math.abs(cents), { whole: false }))}</strong></span>`);
  });
  if (!parts.length) return '';
  /* A statement prints what the wallet held, never what the facility owed when the window opened,
     so a slice that repays more than it shows borrowing leaves the overdraft account holding a
     credit. Naming that before he posts beats explaining a strange balance after. */
  const credit = [...deltas.entries()].filter(([id, cents]) => {
    const acc = accountById(id);
    return !!acc && accountNature(acc) !== 'asset' && accountBalance(id) + cents < 0;
  });
  const creditNote = credit.length
    ? `<p class="tiny">${credit.map(([id, cents]) => `${esc(money(Math.abs(accountBalance(id) + cents), { whole: false }))} short on ${esc(accountById(id).name)}`).join('; ')}. `
      + `This file repays more on the overdraft than it shows borrowing, because part of that debt was already open before ${esc(imp.statementFrom || 'the first row')} and a statement never prints it. `
      + 'Post it, then set what you owed the day before the first row on the Accounts page so the ledger and the phone agree.</p>'
    : '';
  return `<div class="imp-movement"><span class="label">Effect once posted</span>${parts.join('')}${creditNote}</div>`;
}

function importDraft(row, target) {
  const base = {
    date: row.date,
    description: row.description,
    payee: '',
    notes: `Imported from ${imp.fileName}.`,
    source: 'import',
    amountCents: row.cents,
    accountId: target.id
  };
  if (row.kind === 'transfer') {
    return row.dir === 'out'
      ? { ...base, type: 'transfer', toAccountId: row.otherAccountId }
      : { ...base, type: 'transfer', accountId: row.otherAccountId, toAccountId: target.id };
  }
  return { ...base, type: row.dir === 'in' ? 'income' : 'expense', categoryId: row.categoryId || fallbackImportCategory(row.dir === 'in' ? 'income' : 'expense') };
}

/* Why Post refused. Toasts alone were invisible while the modal was open, so the reason is
   also written into the review screen itself and only clears once he edits a row. */
function importBlockReason() {
  const live = imp.rows.filter((row) => !row.dup);
  const blocked = live.filter((row) => row.include).map((row) => ({ row, why: importRowError(row) })).filter((item) => item.why);
  if (blocked.length) {
    const first = blocked[0];
    return `${blocked.length} ${plural(blocked.length, 'row')} still need${blocked.length === 1 ? 's' : ''} a decision. `
      + `The first is “${esc(first.row.description.slice(0, 60))}” — ${esc(first.why.toLowerCase())}. `
      + 'Fill that in, or untick the rows you are not ready for.';
  }
  const excluded = imp.rows.filter((row) => !row.include && !row.dup);
  if (excluded.length) {
    return `All ${imp.rows.length} ${plural(imp.rows.length, 'row')} are excluded or already in your ledger, so there is nothing to post. `
      + `Use the “Excluded (${excluded.length})” filter to bring them back — overdraft lines stay out until a liability account exists, and the button above the table adds one.`;
  }
  return 'Every row in this file is already in your ledger, so there is nothing to post. Importing the same statement twice is blocked on purpose.';
}

function commitImport() {
  const target = accountById(imp.accountId);
  if (!target) {
    imp.error = 'That account no longer exists. Close the importer and pick the account again.';
    renderImportStep();
    return;
  }
  const eligible = imp.rows.filter(importRowEligible);
  if (!eligible.length) {
    imp.error = importBlockReason();
    toast('Nothing to post — the reason is shown in the review table.', 'error');
    renderImportStep();
    return;
  }
  const snapshot = state.transactions.slice();
  const batch = uid('imp');
  const keys = existingImportKeys();
  const baselineProblems = integrityReport().problems.length;
  let posted = 0;
  try {
    eligible.sort((a, b) => a.date.localeCompare(b.date) || a.source - b.source);
    eligible.forEach((row) => {
      const key = importKeyFor(target.id, row.date, row.cents, row.fingerprint || row.description);
      if (keys.has(key)) return;
      const tx = postTransaction(importDraft(row, target));
      tx.importKey = key;
      tx.importBatch = batch;
      /* Keeping the code the statement printed is what lets a later export hand back the very
         lines this came from, so pasting that file again is a duplicate, not a second copy. */
      if (row.receipt) tx.importReceipt = row.receipt;
      keys.add(key);
      posted += 1;
    });
    if (!posted) throw new Error('every row was already in the ledger');
    const problems = integrityReport().problems.length;
    if (problems > baselineProblems) {
      const added = problems - baselineProblems;
      throw new Error(`${added} new ${plural(added, 'journal problem')} appeared in the ledger`);
    }
  } catch (err) {
    state.transactions = snapshot;
    imp.error = `Import stopped — ${esc(err.message)}. Nothing was saved, so no balance changed.`;
    toast('Import stopped — the reason is shown in the review table.', 'error');
    renderImportStep();
    return;
  }
  const saved = persist('import', `${posted} ${plural(posted, 'entry', 'entries')} imported from ${imp.fileName} into ${target.name}.`);
  const fileName = imp.fileName;
  imp = null;
  closeModal();
  if (!saved) {
    state.transactions = snapshot;
    saveState();
    toast('The browser could not save the import. Nothing was kept.', 'error');
    return;
  }
  refresh(`${posted} ${plural(posted, 'entry', 'entries')} imported from ${fileName} and balances recalculated.`);
}

/* --------------------------------------------------------------- JSON restore */

function triggerImportPicker() {
  pendingImport = null;
  const input = document.getElementById('import-file');
  if (!input) {
    toast('The import control is unavailable. Reload the page and try again.', 'error');
    return;
  }
  input.value = '';
  input.click();
}

function inspectImport(next) {
  const accountIds = new Set(next.accounts.map((acc) => acc.id));
  const categoryIds = new Set(next.categories.map((cat) => cat.id));
  let unbalanced = 0;
  let missing = 0;
  next.transactions.forEach((tx) => {
    let debits = 0;
    let credits = 0;
    tx.entries.forEach((entry) => {
      debits += entry.debitCents;
      credits += entry.creditCents;
      if (entry.accountId && !accountIds.has(entry.accountId)) missing += 1;
      if (entry.categoryId && !categoryIds.has(entry.categoryId)) missing += 1;
    });
    if (debits !== credits) unbalanced += 1;
  });
  next.recurring.forEach((rule) => {
    if (rule.accountId && !accountIds.has(rule.accountId)) missing += 1;
    if (rule.toAccountId && !accountIds.has(rule.toAccountId)) missing += 1;
    if (rule.categoryId && !categoryIds.has(rule.categoryId)) missing += 1;
  });
  const budgetMissing = next.budgets.filter((budget) => !categoryIds.has(budget.categoryId)).length;
  return { unbalanced, missing: missing + budgetMissing };
}

async function readImportFile(file) {
  if (!file) return;
  if (file.size > 8 * 1024 * 1024) {
    toast('That backup is too large to import here (limit 8 MB).', 'error');
    return;
  }
  let text = '';
  try {
    text = await file.text();
  } catch (err) {
    toast('The file could not be read.', 'error');
    return;
  }
  let raw = null;
  try {
    raw = JSON.parse(text);
  } catch (err) {
    toast('That file is not valid JSON.', 'error');
    return;
  }
  let next = null;
  try {
    next = normaliseState(raw);
  } catch (err) {
    toast(err.message || 'That file is not a Ledgerwise backup.', 'error');
    return;
  }
  const issues = inspectImport(next);
  pendingImport = next;
  const summary = `<div class="explain-rows" style="margin-bottom:14px">
    <div class="explain-row"><span>Workspace</span><strong>${esc(next.profile.name || 'Untitled ledger')}</strong></div>
    <div class="explain-row"><span>Currency</span><span>${esc(next.profile.currency)}</span></div>
    <div class="explain-row"><span>Accounts</span><span class="mono">${next.accounts.length}</span></div>
    <div class="explain-row"><span>Journal entries</span><span class="mono">${next.transactions.length}</span></div>
    <div class="explain-row"><span>Budgeted months</span><span class="mono">${new Set(next.budgets.map((budget) => budget.month)).size}</span></div>
    <div class="explain-row"><span>Recurring rules</span><span class="mono">${next.recurring.length}</span></div>
    <div class="explain-row"><span>Goals</span><span class="mono">${next.goals.length}</span></div>
  </div>
  ${(issues.unbalanced || issues.missing) ? `<div class="info-note rose">${icon('alert', 15)}<span>This file has ${issues.unbalanced} unbalanced ${plural(issues.unbalanced, 'entry', 'entries')} and ${issues.missing} missing ${plural(issues.missing, 'reference')}. It can be imported, but run the integrity check before relying on the figures.</span></div>` : `<div class="info-note forest">${icon('check-circle', 15)}<span>Journal entries balance and every reference resolves.</span></div>`}
  <p style="margin-top:14px">Restoring replaces your private cloud ledger and the cache in this browser, then syncs the restored copy to your other devices.</p>`;
  openConfirm({
    title: 'Restore this backup?',
    subtitle: 'Review the file before replacing this workspace.',
    body: summary,
    warning: 'Everything currently in your cloud ledger will be replaced. Export a backup first if you might need it.',
    action: 'confirm-import',
    confirmLabel: 'Restore backup',
    danger: true
  });
}

/* --------------------------------------------------------------- budget copy */

function requestCopyBudgets(from) {
  const sourceMonth = /^\d{4}-\d{2}$/.test(String(from || '')) ? from : addMonthsKey(ui.month, -1);
  const toMonth = ui.month;
  if (sourceMonth === toMonth) {
    toast('Choose a different month to copy from.', 'info');
    return;
  }
  const sourceCount = state.budgets.filter((budget) => budget.month === sourceMonth && budget.limitCents > 0).length;
  if (!sourceCount) {
    toast(`There are no limits in ${monthLabel(sourceMonth)} to copy.`, 'info');
    return;
  }
  const targetCount = state.budgets.filter((budget) => budget.month === toMonth && budget.limitCents > 0).length;
  if (targetCount) {
    openConfirm({
      title: 'Replace this month’s plan?',
      subtitle: `${monthLabel(sourceMonth)} to ${monthLabel(toMonth)}`,
      body: `<strong>${monthLabel(toMonth)}</strong> already has ${targetCount} ${plural(targetCount, 'limit')}. Copying the ${monthLabel(sourceMonth)} plan will replace them. Other months are not affected.`,
      warning: 'The existing limits for this month will be overwritten.',
      action: 'confirm-copy-budgets',
      from: sourceMonth,
      to: toMonth,
      confirmLabel: 'Replace plan'
    });
    return;
  }
  performCopyBudgets(sourceMonth, toMonth);
}

function performCopyBudgets(from, to) {
  if (!state) return;
  const sourceCount = state.budgets.filter((budget) => budget.month === from && budget.limitCents > 0).length;
  if (!sourceCount) {
    toast(`There are no limits in ${monthLabel(from)} to copy.`, 'info');
    return;
  }
  const count = copyBudgets(from, to);
  if (!persist('budget', `Copied ${count} limits from ${monthLabel(from)} to ${monthLabel(to)}.`)) return;
  if (document.getElementById('modal-layer')) closeModal();
  refresh(`${count} ${plural(count, 'limit')} copied to ${monthLabel(to)}.`);
}

/* --------------------------------------------------------------- recurring actions */

function markRulePaid(id) {
  const rule = state ? state.recurring.find((row) => row.id === id) : null;
  if (!rule) {
    toast('That recurring rule no longer exists.', 'error');
    return;
  }
  try {
    const today = todayISO();
    const draft = {
      type: rule.kind,
      date: today,
      accountId: rule.accountId,
      amountCents: rule.amountCents,
      description: rule.name,
      payee: '',
      notes: rule.notes || 'Recorded from a scheduled rule.',
      recurringId: rule.id,
      source: 'recurring'
    };
    if (rule.kind === 'transfer') draft.toAccountId = rule.toAccountId;
    else draft.categoryId = rule.categoryId;
    const tx = postTransaction(draft);
    let next = advanceDate(rule.nextDate, rule.frequency);
    let guard = 0;
    while (next <= today && guard < 240) {
      next = advanceDate(next, rule.frequency);
      guard += 1;
    }
    rule.nextDate = next;
    if (!persist('rule', `Recorded ${rule.name} · ${money(tx.amountCents)} · next due ${next}.`)) return;
    refresh(`${rule.name} recorded. Next due ${dateLabel(next)}.`);
  } catch (err) {
    toast(err.message || 'Could not record this rule.', 'error');
  }
}

function skipRule(id) {
  const rule = state ? state.recurring.find((row) => row.id === id) : null;
  if (!rule) {
    toast('That recurring rule no longer exists.', 'error');
    return;
  }
  try {
    const today = todayISO();
    let next = advanceDate(rule.nextDate, rule.frequency);
    let guard = 0;
    while (next <= today && guard < 240) {
      next = advanceDate(next, rule.frequency);
      guard += 1;
    }
    rule.nextDate = next;
    if (!persist('rule', `Skipped ${rule.name} · next due ${next}.`)) return;
    refresh(`Skipped. ${rule.name} is next due ${dateLabel(next)}.`, 'info');
  } catch (err) {
    toast(err.message || 'Could not skip this rule.', 'error');
  }
}

function toggleRule(id) {
  const rule = state ? state.recurring.find((row) => row.id === id) : null;
  if (!rule) {
    toast('That recurring rule no longer exists.', 'error');
    return;
  }
  rule.active = !rule.active;
  if (!persist('rule', `${rule.active ? 'Resumed' : 'Paused'} ${rule.name}.`)) return;
  refresh(rule.active ? `${rule.name} resumed.` : `${rule.name} paused.`, 'info');
}

function requestDeleteRule(id) {
  const rule = state ? state.recurring.find((row) => row.id === id) : null;
  if (!rule) {
    toast('That recurring rule no longer exists.', 'error');
    return;
  }
  openConfirm({
    title: 'Delete this recurring rule?',
    subtitle: rule.name,
    body: `<strong>${esc(rule.name)}</strong> (${esc(money(rule.amountCents))}, ${esc(FREQUENCIES[rule.frequency].short.toLowerCase())}) will be removed from your plan. Entries already posted from it stay in the ledger.`,
    warning: 'This removes the template only. It cannot be undone.',
    action: 'confirm-delete-rule',
    id: rule.id,
    confirmLabel: 'Delete rule',
    danger: true
  });
}

function confirmDeleteRule(id) {
  const index = state ? state.recurring.findIndex((row) => row.id === id) : -1;
  if (index < 0) {
    closeModal();
    toast('That recurring rule no longer exists.', 'error');
    return;
  }
  const [rule] = state.recurring.splice(index, 1);
  if (!persist('rule', `Deleted recurring rule ${rule.name}.`)) return;
  closeModal();
  refresh(`${rule.name} deleted.`);
}

/* --------------------------------------------------------------- other actions */

function removeBudget(categoryId) {
  if (!categoryId) return;
  const category = categoryById(categoryId);
  setBudget(ui.month, categoryId, 0);
  if (!persist('budget', `Removed the ${monthLabel(ui.month)} limit for ${category.name}.`)) return;
  closeModal();
  refresh(`Limit removed from ${category.name}.`, 'info');
}

function toggleCategory(id) {
  const category = state ? state.categories.find((cat) => cat.id === id) : null;
  if (!category) return;
  category.archived = !category.archived;
  if (!persist('category', `${category.archived ? 'Archived' : 'Restored'} category ${category.name}.`)) return;
  refresh(category.archived ? `${category.name} archived.` : `${category.name} restored.`, 'info');
}

function setDebtStrategy(target) {
  const form = target.closest('form[data-form="debt-plan"]');
  const value = target.dataset.value === 'snowball' ? 'snowball' : 'avalanche';
  if (!form) return;
  const hidden = form.querySelector('input[name="strategy"]');
  if (hidden) hidden.value = value;
  ui.debtStrategy = value;
  submitForm(form);
}

function setForecastRange(days) {
  if (![30, 60, 90].includes(days)) return;
  ui.forecastDays = days;
  renderPage();
}

async function resetWorkspace(form) {
  const confirmation = formValue(form, 'confirmation').trim().toUpperCase();
  if (confirmation !== 'RESET') {
    showFormError(form, 'Type RESET exactly to confirm.');
    return;
  }
  const submit = document.querySelector('button[form="reset-form"]');
  if (typeof cloudDeleteLedger === 'function') {
    if (submit) {
      submit.disabled = true;
      submit.textContent = 'Erasing your ledger…';
    }
    try {
      await cloudDeleteLedger();
    } catch (err) {
      if (submit) {
        submit.disabled = false;
        submit.textContent = 'Erase & start over';
      }
      showFormError(form, err && err.message ? err.message : 'The cloud ledger could not be erased. Try again.');
      return;
    }
  }
  try {
    localStorage.removeItem(DB_KEY);
  } catch (err) { /* The cloud copy is already gone; the cache is not used at startup. */ }
  state = null;
  pendingImport = null;
  loadError = null;
  resetWorkspaceUi();
  closeModal();
  clearRouteHash();
  showWelcome();
  scrollTop();
  toast('Workspace erased. Start a new ledger whenever you are ready.', 'info');
  requestAnimationFrame(() => {
    const input = document.getElementById('welcome-name');
    if (input) input.focus({ preventScroll: true });
  });
}

/* --------------------------------------------------------------- form handlers */

function handleWelcomeForm(form) {
  const name = formValue(form, 'name').trim().slice(0, 80);
  const currency = formValue(form, 'currency');
  const mode = formValue(form, 'mode') === 'demo' ? 'demo' : 'fresh';
  if (!CURRENCIES[currency]) {
    showFormError(form, 'Choose a supported currency.');
    return;
  }
  if (typeof cloudArchiveLocalCandidate === 'function') cloudArchiveLocalCandidate();
  let next = null;
  try {
    if (mode === 'demo') {
      next = seedDemo(name);
    } else {
      next = makeCleanState({ name, currency });
      state = next;
      logAudit('workspace', `Workspace created in ${currency}.`);
    }
    state = next;
  } catch (err) {
    state = null;
    showFormError(form, err.message || 'The workspace could not be created.');
    return;
  }
  loadError = null;
  resetWorkspaceUi();
  const saved = saveState();
  showApp();
  syncHash(false);
  renderPage();
  scrollTop();
  if (!saved) {
    toast('The workspace is open in this tab, but the browser could not save it. Export a backup before closing.', 'error');
    return;
  }
  toast(mode === 'demo'
    ? 'Demo workspace ready. Sample data, all editable.'
    : 'Your ledger is ready. Add an account to begin.', mode === 'demo' ? 'info' : 'success');
}

function handleTxForm(form) {
  const id = form.dataset.id || '';
  const type = formValue(form, 'tx-type');
  if (!['expense', 'income', 'transfer'].includes(type)) throw new Error('Choose a transaction type.');
  const amount = parseMoneyInput(formValue(form, 'amount'));
  if (amount == null || amount <= 0) throw new Error('Enter an amount greater than zero.');
  const date = formValue(form, 'date');
  if (!validISODate(date)) throw new Error('Choose a valid date.');
  if (date > todayISO()) throw new Error('Transactions cannot be dated in the future. Use a scheduled rule for planned money.');
  const accountId = formValue(form, 'accountId');
  if (!accountId || !accountById(accountId)) throw new Error('Choose an account.');
  const payee = formValue(form, 'payee').trim();
  const enteredDescription = formValue(form, 'description').trim();
  const notes = formValue(form, 'notes').trim();
  let categoryId = null;
  let toAccountId = null;
  if (type === 'transfer') {
    toAccountId = formValue(form, 'toAccountId');
    if (!toAccountId) throw new Error('Choose a destination account.');
  } else {
    categoryId = formValue(form, 'categoryId');
    if (!categoryId) throw new Error('Choose a category.');
  }
  const category = categoryId ? categoryById(categoryId) : null;
  const fallback = type === 'transfer' ? 'Transfer' : (category ? category.name : 'Transaction');
  const draft = {
    type,
    date,
    accountId,
    toAccountId,
    categoryId,
    amountCents: amount,
    description: enteredDescription || fallback,
    payee,
    notes
  };

  if (id) {
    const tx = state.transactions.find((row) => row.id === id);
    if (!tx) throw new Error('That transaction no longer exists.');
    const result = replaceTransaction(tx, draft);
    if (!persist('correct', `Corrected ${tx.ref}; replacement ${result.replacement.ref}.`)) return;
    closeModal();
    refresh('Correction posted. The original and its reversal stay in the ledger.');
    return;
  }

  const tx = postTransaction(draft);
  if (!persist('transaction', `Posted ${tx.ref} · ${tx.description} · ${money(tx.amountCents)}.`)) return;
  closeModal();
  refresh('Transaction posted.');
}

function handleAccountForm(form) {
  const id = form.dataset.id || '';
  const editing = id ? accountById(id) : null;
  if (id && !editing) throw new Error('That account no longer exists.');
  const name = formValue(form, 'name').trim();
  if (!name) throw new Error('Give the account a name.');
  if (name.length > 60) throw new Error('Account names are limited to 60 characters.');
  const requestedType = formValue(form, 'type');
  if (!ACCOUNT_TYPES[requestedType]) throw new Error('Choose an account type.');
  const hasEntries = editing
    ? state.transactions.some((tx) => tx.entries.some((entry) => entry.accountId === editing.id))
    : false;
  const type = editing && hasEntries ? editing.type : requestedType;
  const duplicate = state.accounts.find((acc) => acc.id !== id && acc.name.trim().toLowerCase() === name.toLowerCase());
  if (duplicate) throw new Error('An account with that name already exists.');
  const institution = formValue(form, 'institution').trim().slice(0, 60);
  const spendable = formChecked(form, 'spendable');
  const archived = editing ? formChecked(form, 'archived') : false;
  const liability = accountNature({ type }) === 'liability';
  let apr = null;
  let minPaymentCents = 0;
  if (liability) {
    const aprRaw = formValue(form, 'apr').trim();
    const aprValue = aprRaw === '' ? 0 : Number(aprRaw);
    if (!Number.isFinite(aprValue) || aprValue < 0 || aprValue > 100) throw new Error('Enter an annual interest rate between 0 and 100.');
    apr = Math.round(aprValue * 10) / 10;
    const minRaw = formValue(form, 'minPayment').trim();
    const minPayment = minRaw ? parseMoneyInput(minRaw, { allowZero: true }) : 0;
    if (minPayment == null || minPayment < 0) throw new Error('Enter a valid minimum payment.');
    minPaymentCents = minPayment;
  }

  if (editing) {
    if (archived && !editing.archived) {
      const used = accountRuleUseCount(editing.id);
      if (used) throw new Error(`This account is used by ${used} active ${plural(used, 'rule')}. Pause or edit those rules before archiving it.`);
    }
    const openingRaw = formValue(form, 'opening').trim();
    let correction = null;
    const previousOpening = Math.max(0, toInt(editing.openingCents, 0));
    if (openingRaw !== '') {
      const nextOpening = parseMoneyInput(openingRaw, { allowZero: true });
      if (nextOpening == null || nextOpening < 0) throw new Error('Enter a valid opening balance.');
      correction = postOpeningCorrection(editing, nextOpening);
    }
    editing.name = name;
    editing.institution = institution;
    editing.type = type;
    editing.spendable = spendable;
    editing.archived = archived;
    editing.apr = apr;
    editing.minPaymentCents = minPaymentCents;
    editing.updatedAt = nowISO();
    if (!persist('account', correction
      ? `Corrected ${name} opening balance from ${money(previousOpening)} to ${money(editing.openingCents)}.`
      : `Updated account ${name}.`)) return;
    closeModal();
    refresh(correction
      ? `Opening balance corrected. A balancing entry of ${money(Math.abs(editing.openingCents - previousOpening))} was posted against opening equity.`
      : 'Account updated.');
    return;
  }

  const openedAt = formValue(form, 'openedAt') || todayISO();
  if (!validISODate(openedAt)) throw new Error('Choose a valid opening date.');
  if (openedAt > todayISO()) throw new Error('An account cannot open in the future.');
  const openingRaw = formValue(form, 'opening').trim();
  const openingCents = openingRaw ? parseMoneyInput(openingRaw, { allowZero: true }) : 0;
  if (openingCents == null || openingCents < 0) throw new Error('Enter a valid opening balance.');
  const account = {
    id: uid('acc'),
    name,
    type,
    institution,
    openingCents,
    openedAt,
    spendable,
    apr,
    minPaymentCents,
    archived: false,
    createdAt: nowISO(),
    updatedAt: nowISO()
  };
  state.accounts.push(account);
  createOpeningTransaction(account, openedAt);
  if (!persist('account', `Added account ${name} with opening balance ${money(openingCents)}.`)) return;
  closeModal();
  refresh('Account added.');
}

function handleReconcileForm(form) {
  const account = accountById(form.dataset.id);
  if (!account) throw new Error('That account no longer exists.');
  const statement = parseMoneyInput(formValue(form, 'statement'), { allowZero: true, allowNegative: true });
  if (statement == null) throw new Error('Enter the statement balance.');
  const tx = postReconciliationAdjustment(account, statement, formValue(form, 'note'));
  if (!tx) {
    closeModal();
    toast('The ledger already matches that balance. No adjustment was posted.', 'info');
    return;
  }
  if (!persist('reconcile', `Reconciled ${account.name} to ${money(statement)}.`)) return;
  closeModal();
  refresh('Adjustment posted to equity.');
}

function handleBudgetForm(form) {
  const inputs = [...form.querySelectorAll('input[name^="budget_"]')];
  if (!inputs.length) throw new Error('There are no budget fields to save.');
  const updates = [];
  inputs.forEach((input) => {
    const categoryId = input.name.slice('budget_'.length);
    if (!state.categories.some((category) => category.id === categoryId)) return;
    const raw = input.value.trim();
    let limitCents = 0;
    if (raw) {
      limitCents = parseMoneyInput(raw, { allowZero: true });
      if (limitCents == null || limitCents < 0) throw new Error('Enter valid monthly limits (numbers only).');
    }
    updates.push([categoryId, limitCents]);
  });
  updates.forEach(([categoryId, limitCents]) => setBudget(ui.month, categoryId, limitCents));
  const count = updates.filter(([, limitCents]) => limitCents > 0).length;
  if (!persist('budget', `Updated the ${monthLabel(ui.month)} budget (${count} limits).`)) return;
  closeModal();
  refresh(count
    ? `Budget saved for ${monthLabel(ui.month)}.`
    : `Budget cleared for ${monthLabel(ui.month)}.`, count ? 'success' : 'info');
}

function handleRuleForm(form) {
  const id = form.dataset.id || '';
  const editing = id ? state.recurring.find((rule) => rule.id === id) : null;
  if (id && !editing) throw new Error('That recurring rule no longer exists.');
  const kind = formValue(form, 'rule-kind');
  if (!['expense', 'income', 'transfer'].includes(kind)) throw new Error('Choose a rule type.');
  const name = formValue(form, 'name').trim();
  if (!name) throw new Error('Give the rule a name.');
  if (name.length > 80) throw new Error('Rule names are limited to 80 characters.');
  const amount = parseMoneyInput(formValue(form, 'amount'));
  if (amount == null || amount <= 0) throw new Error('Enter an amount greater than zero.');
  const frequency = formValue(form, 'frequency');
  if (!FREQUENCIES[frequency]) throw new Error('Choose a frequency.');
  const nextDate = formValue(form, 'nextDate');
  if (!validISODate(nextDate)) throw new Error('Choose a valid next date.');
  const accountId = formValue(form, 'accountId');
  const account = accountById(accountId);
  if (!account) throw new Error('Choose an account.');
  if (account.archived) throw new Error('That account is archived.');
  if (kind !== 'expense' && accountNature(account) !== 'asset') {
    throw new Error('Income and transfers must use a cash, bank, mobile or savings account.');
  }
  let categoryId = null;
  let toAccountId = null;
  if (kind === 'transfer') {
    toAccountId = formValue(form, 'toAccountId');
    const destination = accountById(toAccountId);
    if (!destination) throw new Error('Choose a destination account.');
    if (destination.id === account.id) throw new Error('Choose two different accounts.');
    if (destination.archived) throw new Error('That destination account is archived.');
  } else {
    categoryId = formValue(form, 'categoryId');
    const category = categoryById(categoryId);
    if (!categoryId || !category) throw new Error('Choose a category.');
    if (kind === 'expense' && category.type !== 'expense') throw new Error('Choose an expense category.');
    if (kind === 'income' && category.type !== 'income') throw new Error('Choose an income category.');
  }
  const active = formChecked(form, 'active');
  const notes = formValue(form, 'notes').trim().slice(0, 200);

  if (editing) {
    Object.assign(editing, {
      name, kind, accountId, toAccountId, categoryId,
      amountCents: amount, frequency, nextDate, active, notes
    });
    if (!persist('rule', `Updated recurring rule ${name}.`)) return;
    closeModal();
    refresh('Recurring rule updated.');
    return;
  }

  const rule = {
    id: uid('bill'),
    name, kind, accountId, toAccountId, categoryId,
    amountCents: amount, frequency, nextDate, active, notes,
    createdAt: nowISO()
  };
  state.recurring.push(rule);
  if (!persist('rule', `Added recurring rule ${name}.`)) return;
  closeModal();
  refresh('Recurring rule added.');
}

function handleGoalForm(form) {
  const id = form.dataset.id || '';
  const editing = id ? state.goals.find((goal) => goal.id === id) : null;
  if (id && !editing) throw new Error('That goal no longer exists.');
  const name = formValue(form, 'name').trim();
  if (!name) throw new Error('Give the goal a name.');
  if (name.length > 80) throw new Error('Goal names are limited to 80 characters.');
  const target = parseMoneyInput(formValue(form, 'target'));
  if (target == null || target <= 0) throw new Error('Enter a target greater than zero.');
  const targetDate = formValue(form, 'targetDate');
  if (targetDate && !validISODate(targetDate)) throw new Error('Choose a valid target date.');
  const colorValue = formValue(form, 'color');
  const color = /^#[0-9a-f]{6}$/i.test(colorValue) ? colorValue : '#b3874a';
  const note = formValue(form, 'note').trim().slice(0, 240);
  const archived = editing ? formChecked(form, 'archived') : false;

  if (editing) {
    Object.assign(editing, { name, targetCents: target, targetDate: targetDate || null, color, note, archived });
    if (!persist('goal', `Updated goal ${name}.`)) return;
    closeModal();
    refresh('Goal updated.');
    return;
  }

  state.goals.push({
    id: uid('goal'),
    name,
    targetCents: target,
    targetDate: targetDate || null,
    color,
    note,
    contributions: [],
    archived: false,
    createdAt: nowISO()
  });
  if (!persist('goal', `Created goal ${name}.`)) return;
  closeModal();
  refresh('Goal created.');
}

function handleGoalMoneyForm(form) {
  const goal = state.goals.find((row) => row.id === form.dataset.id);
  if (!goal) throw new Error('That goal no longer exists.');
  const mode = formValue(form, 'goal-money-mode') === 'withdraw' ? 'withdraw' : 'add';
  const amount = parseMoneyInput(formValue(form, 'amount'));
  if (amount == null || amount <= 0) throw new Error('Enter an amount greater than zero.');
  const date = formValue(form, 'date');
  if (!validISODate(date)) throw new Error('Choose a valid date.');
  if (date > todayISO()) throw new Error('Goal contributions cannot be dated in the future.');
  const current = Math.max(0, goalSaved(goal));
  if (mode === 'withdraw' && amount > current) throw new Error('You cannot withdraw more than the amount currently reserved.');
  const note = formValue(form, 'note').trim().slice(0, 140);
  goal.contributions.push({
    id: uid('gol'),
    date,
    amountCents: mode === 'withdraw' ? -amount : amount,
    note
  });
  if (!persist('goal', `${mode === 'withdraw' ? 'Withdrew' : 'Reserved'} ${money(amount)} ${mode === 'withdraw' ? 'from' : 'for'} ${goal.name}.`)) return;
  closeModal();
  refresh(`${money(amount)} ${mode === 'withdraw' ? 'withdrawn from' : 'reserved for'} ${goal.name}.`);
}

function handleCategoryForm(form) {
  const id = form.dataset.id || '';
  const editing = id ? state.categories.find((category) => category.id === id) : null;
  if (id && !editing) throw new Error('That category no longer exists.');
  const name = formValue(form, 'name').trim();
  if (!name) throw new Error('Give the category a name.');
  if (name.length > 60) throw new Error('Category names are limited to 60 characters.');
  const type = formValue(form, 'category-type') === 'income' ? 'income' : 'expense';
  if (editing && type !== editing.type && categoryInUse(editing.id)) {
    throw new Error('This category is already used by entries, budgets or rules, so its type is locked.');
  }
  const validGroups = Object.keys(GROUPS).filter((key) => (type === 'income' ? GROUPS[key].order >= 20 : GROUPS[key].order < 20));
  let group = formValue(form, 'group');
  if (!validGroups.includes(group)) group = type === 'income' ? 'other_income' : 'other';
  const colorValue = formValue(form, 'color');
  const color = /^#[0-9a-f]{6}$/i.test(colorValue) ? colorValue : '#6f8b5d';
  const duplicate = state.categories.find((category) => category.id !== id
    && category.type === type
    && category.name.trim().toLowerCase() === name.toLowerCase());
  if (duplicate) throw new Error('A category with that name already exists.');
  const archived = editing ? formChecked(form, 'archived') : false;

  if (editing) {
    Object.assign(editing, { name, type, group, color, archived });
    if (!persist('category', `Updated category ${name}.`)) return;
    closeModal();
    refresh('Category updated.');
    return;
  }

  state.categories.push({
    id: uid('cat'),
    name,
    type,
    group,
    color,
    archived: false
  });
  if (!persist('category', `Added category ${name}.`)) return;
  closeModal();
  refresh('Category added.');
}

function handleProfileForm(form) {
  const currency = formValue(form, 'currency');
  if (!CURRENCIES[currency]) throw new Error('Choose a supported currency.');
  const locked = state.accounts.length > 0
    || state.transactions.length > 0
    || state.budgets.length > 0
    || state.recurring.length > 0
    || state.goals.length > 0;
  if (locked && currency !== state.profile.currency) {
    throw new Error('Currency is locked once the workspace has financial data.');
  }
  const name = formValue(form, 'name').trim().slice(0, 80);
  const targetRaw = formValue(form, 'savingsTargetPct').trim();
  const target = targetRaw === '' ? 0 : Number(targetRaw);
  if (!Number.isFinite(target) || target < 0 || target > 80) throw new Error('The savings target must be between 0 and 80 percent.');
  const windowDays = Number(formValue(form, 'safeWindowDays'));
  if (![7, 14, 30].includes(windowDays)) throw new Error('Choose a safe-to-spend window.');
  const bufferRaw = formValue(form, 'buffer').trim();
  const buffer = bufferRaw ? parseMoneyInput(bufferRaw, { allowZero: true }) : 0;
  if (buffer == null || buffer < 0) throw new Error('Enter a valid cash cushion.');
  let bufferCents = buffer;
  if (currency !== state.profile.currency) {
    const oldDefault = defaultBufferCents(state.profile.currency);
    if (buffer === oldDefault) bufferCents = defaultBufferCents(currency);
  }
  state.profile.name = name;
  state.profile.currency = currency;
  state.profile.locale = CURRENCIES[currency].locale;
  state.profile.savingsTargetPct = Math.round(target);
  state.profile.bufferCents = bufferCents;
  state.profile.safeWindowDays = windowDays;
  if (!persist('profile', 'Updated profile and planning assumptions.')) return;
  refresh('Settings saved.');
}

function handleDebtPlanForm(form) {
  const raw = formValue(form, 'extra').trim();
  let extra = 0;
  if (raw) {
    extra = parseMoneyInput(raw, { allowZero: true });
    if (extra == null || extra < 0) {
      toast('Enter a valid extra monthly payment.', 'error');
      return;
    }
  }
  ui.debtExtra = raw;
  ui.debtStrategy = formValue(form, 'strategy') === 'snowball' ? 'snowball' : 'avalanche';
  renderPage();
}

function handleFormSubmit(form) {
  const name = form.dataset.form;
  try {
    switch (name) {
      case 'welcome': handleWelcomeForm(form); break;
      case 'tx': handleTxForm(form); break;
      case 'account': handleAccountForm(form); break;
      case 'delete-account': submitDeleteAccount(form); break;
      case 'reconcile': handleReconcileForm(form); break;
      case 'budget': handleBudgetForm(form); break;
      case 'rule': handleRuleForm(form); break;
      case 'goal': handleGoalForm(form); break;
      case 'goal-money': handleGoalMoneyForm(form); break;
      case 'category': handleCategoryForm(form); break;
      case 'profile': handleProfileForm(form); break;
      case 'debt-plan': handleDebtPlanForm(form); break;
      case 'reset': resetWorkspace(form); break;
      case 'cloud-auth': submitCloudAuth(form); break;
      case 'cloud-password-reset': submitCloudPasswordReset(form); break;
      case 'cloud-delete': submitCloudDelete(form); break;
      default:
        console.warn('[Ledgerwise] No handler for form:', name);
    }
  } catch (err) {
    if (err instanceof TypeError || err instanceof ReferenceError || err instanceof RangeError) console.error(err);
    else console.warn('[Ledgerwise] Form not saved:', err.message);
    showFormError(form, err.message || 'Something went wrong while saving.');
  }
}

/* --------------------------------------------------------------- action dispatch */

function handleAction(action, target, event) {
  if (typeof action === 'string' && action.indexOf('imp-') === 0 && handleImportAction(action, target)) return;
  const id = target.dataset.id || '';
  switch (action) {
    case 'go':
      if (event) event.preventDefault();
      navigate(target.dataset.page || 'overview');
      return;
    case 'open-nav': openNav(); return;
    case 'close-nav': closeNav(); return;
    case 'add-tx':
      openTxModal({ accountId: target.dataset.account || '', type: target.dataset.type || undefined });
      return;
    case 'open-tx': openTxDetail(id); return;
    case 'edit-tx': openTxModal({ id }); return;
    case 'tx-type': setTxType(target.dataset.type || 'expense'); return;
    case 'void-tx': {
      const tx = state ? state.transactions.find((row) => row.id === id) : null;
      if (!tx) return;
      openConfirm({
        title: 'Void this entry?',
        subtitle: tx.ref,
        body: `<strong>${esc(tx.description || txKindLabel(tx))}</strong> for <strong>${esc(money(tx.amountCents))}</strong> on ${esc(dateInputLabel(tx.date))} will stay in the ledger. A balancing reversal is posted on the same date, so reports cancel the entry in the right period.`,
        warning: 'Voiding cannot be undone. Post a new entry if the money movement did happen.',
        action: 'confirm-void',
        id: tx.id,
        confirmLabel: 'Void entry',
        danger: true
      });
      return;
    }
    case 'confirm-void': {
      const tx = state ? state.transactions.find((row) => row.id === id) : null;
      if (!tx) {
        closeModal();
        toast('That transaction no longer exists.', 'error');
        return;
      }
      try {
        const reversal = voidTransaction(tx);
        if (!persist('correct', `Voided ${tx.ref} with reversal ${reversal.ref}.`)) return;
        closeModal();
        refresh('Entry voided. The reversal is visible under Corrections.');
      } catch (err) {
        showConfirmError(err.message || 'This entry could not be voided.');
      }
      return;
    }
    case 'month-prev':
      ui.month = addMonthsKey(ui.month, -1);
      renderPage();
      return;
    case 'month-next':
      ui.month = addMonthsKey(ui.month, 1);
      renderPage();
      return;
    case 'month-this':
      ui.month = currentMonthKey();
      renderPage();
      return;
    case 'copy-budgets': requestCopyBudgets(target.dataset.from); return;
    case 'confirm-copy-budgets':
      performCopyBudgets(target.dataset.from, target.dataset.to || ui.month);
      return;
    case 'edit-budget': openBudgetEditor(id || null); return;
    case 'remove-budget': removeBudget(id); return;
    case 'toggle-archived':
      ui.showArchivedAccounts = !ui.showArchivedAccounts;
      renderPage();
      return;
    case 'add-account': openAccountModal(); return;
    case 'set-theme': setThemeChoice(target.dataset.choice); renderPage(); return;
    case 'edit-account': openAccountModal(id); return;
    case 'delete-account': openDeleteAccountModal(id); return;
    case 'delete-account-cancel': closeModal(); openAccountModal(id); return;
    case 'reconcile-account': openReconcileModal(id); return;
    case 'plan-tab':
      if (!PLAN_TABS.includes(target.dataset.tab)) return;
      ui.planTab = target.dataset.tab;
      syncHash(true);
      renderPage();
      return;
    case 'add-bill': openRuleModal(null, target.dataset.kind || 'expense'); return;
    case 'edit-bill': openRuleModal(id); return;
    case 'rule-paid': markRulePaid(id); return;
    case 'rule-skip': skipRule(id); return;
    case 'rule-toggle': toggleRule(id); return;
    case 'delete-rule': requestDeleteRule(id); return;
    case 'confirm-delete-rule': confirmDeleteRule(id); return;
    case 'add-goal': openGoalModal(); return;
    case 'edit-goal': openGoalModal(id); return;
    case 'goal-money': openGoalMoneyModal(id); return;
    case 'goal-money-mode': setGoalMoneyMode(target.dataset.mode || 'add'); return;
    case 'goal-color': {
      const input = document.getElementById('goal-color');
      if (input && target.dataset.color) input.value = target.dataset.color;
      return;
    }
    case 'add-category': openCategoryModal(); return;
    case 'edit-category': openCategoryModal(id); return;
    case 'toggle-category': toggleCategory(id); return;
    case 'category-type': setCategoryTypeUI(target.dataset.type || 'expense', false); return;
    case 'rule-kind': setRuleKindUI(target.dataset.kind || 'expense'); return;
    case 'debt-strategy': setDebtStrategy(target); return;
    case 'forecast-range': setForecastRange(Number(target.dataset.days)); return;
    case 'export-json': exportJson(); return;
    case 'export-csv': exportTransactionsCsv(); return;
    case 'export-report': exportReportCsv(); return;
    case 'print': window.print(); return;
    case 'import-json': triggerImportPicker(); return;
    case 'import-statement': imp = null; openImportModal(id); return;
    case 'mpesa-messages': openMpesaExportModal(id); return;
    case 'mpesa-all': toggleMpesaAll(); return;
    case 'mpesa-download': downloadMpesaMessages(); return;
    case 'confirm-import': confirmImport(); return;
    case 'reset-workspace': openResetModal(); return;
    case 'cloud-signout': cloudRequestSignOut(); return;
    case 'cloud-google-login': startCloudGoogleSignIn(target); return;
    case 'cloud-delete-account': openCloudDeleteModal(); return;
    case 'cloud-legal': openCloudLegal(target.dataset.doc || 'privacy'); return;
    case 'cloud-auth-mode': cloud.pendingEmail = (document.getElementById('cloud-auth-email') || {}).value || cloud.pendingEmail; showAuthSignIn('', target.dataset.mode || 'login'); return;
    case 'cloud-change-email': cloudChangeEmail(); return;
    case 'cloud-retry': cloudRetry(); return;
    case 'cloud-sync-now': cloudSyncNow(); return;
    case 'cloud-conflict-reload': cloudResolveConflict(); return;
    case 'cloud-brand': if (event) event.preventDefault(); return;
    case 'cloud-import-local': cloudImportLocal(); return;
    case 'cloud-download-local': cloudDownloadLocal(); return;
    case 'cloud-dismiss-local': cloudDismissLocal(); return;
    case 'explain': openExplain(target.dataset.kind || 'safe'); return;
    case 'dismiss-demo': ui.demoBannerClosed = true; renderDemoBanner(); return;
    case 'clear-filters': resetTxFilters(); return;
    case 'tx-page': {
      const page = Number(target.dataset.page);
      if (Number.isFinite(page)) {
        ui.txFilters.page = page;
        refreshTxList();
      }
      return;
    }
    case 'close-modal': closeModal(); return;
    default:
      console.warn('[Ledgerwise] Unknown action:', action);
  }
}

function confirmImport() {
  if (!pendingImport) {
    closeModal();
    toast('No backup is waiting to be restored.', 'error');
    return;
  }
  const incoming = pendingImport;
  pendingImport = null;
  state = incoming;
  loadError = null;
  state.updatedAt = nowISO();
  logAudit('import', 'Ledger restored from a JSON backup.');
  const saved = saveState();
  closeModal();
  showApp();
  resetWorkspaceUi();
  syncHash(false);
  renderPage();
  scrollTop();
  toast(saved
    ? 'Backup restored.'
    : 'Backup loaded in this tab, but the browser could not save it. Export immediately.', saved ? 'success' : 'error');
}

/* --------------------------------------------------------------- storage sync */

function handleStorageSync(event) {
  if (event.key !== DB_KEY) return;
  if (event.newValue === null) {
    state = null;
    if (activeModal) closeModal();
    showWelcome();
    toast('This workspace was erased in another tab.', 'info');
    return;
  }
  try {
    const incoming = normaliseState(JSON.parse(event.newValue));
    if (activeModal) {
      closeModal();
      toast('The ledger changed in another tab, so the open dialog was closed to avoid overwriting it.', 'info');
    }
    state = incoming;
    loadError = null;
    showApp();
    applyHash(location.hash);
    renderPage();
    toast('Ledger updated from another tab.', 'info');
  } catch (err) {
    /* A malformed write from another tab should not replace a working ledger. */
  }
}

/* --------------------------------------------------------------- events and boot */

function bindGlobalEvents() {
  document.addEventListener('click', (event) => {
    const element = event.target && event.target.closest ? event.target.closest('[data-act]') : null;
    if (!element) return;
    if (element.disabled || element.getAttribute('aria-disabled') === 'true') return;
    handleAction(element.dataset.act, element, event);
  });

  document.addEventListener('submit', (event) => {
    const form = event.target && event.target.closest ? event.target.closest('form[data-form]') : null;
    if (!form) return;
    event.preventDefault();
    handleFormSubmit(form);
  });

  document.addEventListener('input', (event) => {
    const element = event.target;
    if (!element) return;
    if (element.id === 'tx-search') {
      ui.txFilters.q = element.value;
      ui.txFilters.page = 1;
      refreshTxList();
      updateFilterClear();
    }
    const form = element.closest ? element.closest('form') : null;
    if (form) {
      const error = form.querySelector('.error-text.show');
      if (error) error.classList.remove('show');
    }
  });

  document.addEventListener('change', (event) => {
    const element = event.target;
    if (!element) return;
    if (element.id === 'filter-type' || element.id === 'filter-account' || element.id === 'filter-category') {
      const key = element.id === 'filter-type' ? 'type' : element.id === 'filter-account' ? 'account' : 'category';
      ui.txFilters[key] = element.value;
      ui.txFilters.page = 1;
      refreshTxList();
      updateFilterClear();
      return;
    }
    if (element.id === 'tx-corrections') {
      ui.txFilters.corrections = element.checked;
      ui.txFilters.page = 1;
      refreshTxList();
      updateFilterClear();
      return;
    }
    if (element.id === 'import-file') {
      const file = element.files && element.files[0] ? element.files[0] : null;
      element.value = '';
      if (file) readImportFile(file);
      return;
    }
    if (element.id === 'import-statement-file') {
      const file = element.files && element.files[0] ? element.files[0] : null;
      element.value = '';
      if (file) readImportStatementFile(file);
      return;
    }
    if (element.dataset && element.dataset.imp) handleImportChange(element);
    if (element.dataset && element.dataset.mp) handleMpesaChange(element);
  });

  window.addEventListener('hashchange', handleRouteChange);
  window.addEventListener('popstate', handleRouteChange);
  window.addEventListener('storage', handleStorageSync);

  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape' && !activeModal && ui.navOpen) {
      closeNav();
    }
  });

  const skip = document.querySelector('.skip-link');
  if (skip) {
    skip.addEventListener('click', (event) => {
      event.preventDefault();
      const view = document.getElementById('view');
      if (view) {
        view.focus({ preventScroll: true });
        view.scrollIntoView({ block: 'start' });
      }
    });
  }
}

function enterLedger(loaded) {
  if (!loaded) {
    state = null;
    showWelcome();
    requestAnimationFrame(() => {
      const input = document.getElementById('welcome-name');
      if (input) input.focus({ preventScroll: true });
    });
    return;
  }
  state = loaded;
  loadError = null;
  showApp();
  applyHash(location.hash);
  syncHash(false);
  ui.month = currentMonthKey();
  renderPage();
  scrollTop();
}

function boot() {
  document.body.classList.remove('locked', 'nav-open');
  applyTheme();
  bindGlobalEvents();
  if (typeof startCloudApp === 'function') {
    startCloudApp();
    return;
  }
  enterLedger(loadState());
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot, { once: true });
} else {
  boot();
}

</script>
</body>
</html>
