    if (!activeModal) openImportModal(keepAccount);
    return;
  }
  if (file.size > IMPORT_MAX_BYTES) {
    toast('That PDF is too large to import here (limit 4 MB). Request a shorter date range.', 'error');
    return;
  }
  let cells = null;
  try {
    const bytes = new Uint8Array(await file.arrayBuffer());
    cells = await pdfStatementCells(bytes);
  } catch (err) {
    cells = null;
  }
  if (!cells) {
    toast('That PDF could not be read. If it is a scanned document or a password-protected file, export it as CSV instead.', 'error');
    if (!activeModal) openImportModal(keepAccount);
    return;
  }
  const records = pdfStatementRecords(pdfStatementBands(cells));
  if (!records.length) {
    toast('No M-Pesa transaction table was found in that PDF. It may be a different kind of statement — try the CSV route and map the columns yourself.', 'error');
    if (!activeModal) openImportModal(keepAccount);
    return;
  }
  const matrix = records.map((record) => {
    const [date, time] = record.datetime.split(/\s+/);
    return [
      record.receipt,
      date || '',
      record.details,
      record.status,
      record.paidInCents != null ? (record.paidInCents / 100).toFixed(2) : '',
      record.withdrawnCents != null ? (record.withdrawnCents / 100).toFixed(2) : '',
      record.balanceCents != null ? (record.balanceCents / 100).toFixed(2) : '',
      time || ''
    ];
  });
  imp = {
    step: 3,
    kind: 'pdf',
    mode: 'file',
    fileName: String(file.name || 'statement').slice(0, 80),
    fileBytes: file.size,
    delimiterLabel: 'PDF table',
    matrix,
    headerIndex: -1,
    hasHeader: false,
    map: { date: 1, description: 2, out: 5, inc: 4, amount: null, sign: null, payee: null },
    cols: { receipt: 0, status: 3, balance: 6, time: 7 },
    accountId: keepAccount,
    rows: [],
    filter: 'all',
    page: 0,
    bulk: { expense: '', income: '' },
    batch: uid('imp'),
    skipped: 0,
    statementCents: records[0].balanceCents,
    statementFrom: records[records.length - 1] ? records[records.length - 1].datetime.slice(0, 10) : '',
    statementTo: records[0] ? records[0].datetime.slice(0, 10) : ''
  };
  if (!imp.accountId) {
    const mobile = activeAccounts().find((acc) => /pesa|m-shwari|lipa/i.test(`${acc.name} ${acc.institution || ''}`));
    imp.accountId = mobile ? mobile.id : '';
  }
  buildImportRows();
  if (!imp.rows.length) {
    toast(`No usable rows found in ${imp.fileName}.`, 'error');
    imp.step = 1;
  }
  if (!activeModal) openImportModal(imp.accountId);
  else renderImportStep();
}

function importColumnOptions(index, selected) {
  const header = imp.matrix[imp.headerIndex] || [];
  const width = Math.max(...imp.matrix.map((row) => row.length), 0);
  const out = ['<option value="">Not in this file</option>'];
  for (let i = 0; i < width; i += 1) {
    const title = String(header[i] || '').trim() || `Column ${String.fromCharCode(65 + (i % 26))}${i >= 26 ? i - 25 : ''}`;
    const sample = dataCells(imp.matrix, imp.headerIndex).slice(0, 6)
      .map((row) => String(row[i] || '')).filter(Boolean)[0] || '';
    const label = `${title}${sample && sample !== title ? ` · ${sample.slice(0, 22)}` : ''}`.slice(0, 60);
    out.push(`<option value="${i}"${impSel(i, selected)}>${esc(label)}</option>`);
  }
  return out.join('');
}

/* Confirmation texts are what most people actually keep, so a pasted message is turned into
   one row of the same statement table the file importer reads. Direction comes from the
   wording; a message that does not say which way the money went is refused, not guessed. */
/* A receipt code is ten upper-case alphanumerics and can end in the letters of a currency word
   before its own digits (NQSHPKS331 reads as "KSh331" to a careless pattern). Requiring the
   currency token to start on a non-alphanumeric keeps a code's tail from being taken as money. */
const SMS_AMOUNT_SRC = '(?:^|[^A-Za-z0-9])(?:ksh|kes|ks|sh)\\s*([0-9][0-9,]*(?:\\.[0-9]{1,2})?)';
const SMS_DATE_RE = /\b(\d{1,2}[/.-]\d{1,2}[/.-]\d{2,4})\b/;
const SMS_TIME_RE = /\bat\s+\d{1,2}:\d{2}\s*(?:[ap]\.?m\.?)/i;
const SMS_BALANCE_RE = new RegExp(`balance[^0-9]{0,14}${SMS_AMOUNT_SRC}`, 'i');
const SMS_FEE_RE = new RegExp(`(?:transaction\\s*cost|m-?pesa\\s*(?:fee|charge)|service\\s*charge|\\bfee\\b|stamp\\s*duty)[^0-9]{0,12}${SMS_AMOUNT_SRC}`, 'i');
const SMS_AMOUNT_RE = new RegExp(SMS_AMOUNT_SRC, 'i');
const SMS_AMOUNT_ALL_RE = new RegExp(SMS_AMOUNT_SRC, 'gi');
const SMS_IN_RE = /you have received|have (?:been )?received|credited (?:with|to)|received (?:from|cash|ksh|sh|mobile|money)|money received|gift from|tusime|sent to (?:your|you)|to your (?:m-?pesa|account)|reversal|reversed|refunded|fuliza (?:limit|available)/i;
const SMS_OUT_RE = /you (?:have )?(?:paid|sent|transferred)|gift to|sent to|transferred to|transfer (?:of|to)|paid to|paid for|withdraw|lipa na m-?pesa|paybill|buy goods|\btil\b|money sent|fuliza repayment|deducted|debited|amount you transacted|\bsent\b/i;
/* Safaricom's receiver copy of a gift reads "KSh 1,200 sent to you by …" and trips both
   lists above. Saying the money landed on his side is decisive, so it wins. */
const SMS_STRONG_IN_RE = /sent (?:to )?you|you(?: have)? received|received (?:by|from) you|been credited|credited with|gift from|refunded|reversal/i;
const SMS_FAILED_RE = /failed|cancelled|canceled|not completed|not received|pending|restricted|try again later/i;

/* A receipt code is ten upper-case characters. Safaricom also issues codes with no digit at all
   (UJRJMBQHHB), so a code at the start of a line needs no digit; one in the middle of a sentence
   does, otherwise a merchant's name written in capitals would be read as a second message. */
function smsReceiptSpans(text) {
  const spans = [];
  const re = /\b[A-Z0-9]{10,12}\b/g;
  let found;
  while ((found = re.exec(text)) !== null) {
    const code = found[0];
    const letters = (code.match(/[A-Z]/g) || []).length;
    const digits = (code.match(/\d/g) || []).length;
    if (letters < 3) continue;
    const atLineStart = found.index === 0 || text[found.index - 1] === '\n';
    const afterStop = /[.;:,\n]/.test(text.slice(Math.max(0, found.index - 3), found.index));
    if (!atLineStart && !(afterStop && digits >= 1)) continue;
    spans.push({ index: found.index, code });
  }
  return spans;
}

/* One paste can hold a dozen messages: blank-line separated blocks, one line each, or
   several messages run onto a single line and divided only by their receipt codes. */
function splitSmsMessages(text) {
  const flat = String(text || '').replace(/\r/g, '').trim();
  if (!flat) return [];
  const pieces = [];
  flat.split(/\n\s*\n/).map((block) => block.trim()).filter(Boolean).forEach((para) => {
    const spans = smsReceiptSpans(para);
    if (spans.length > 1) {
      spans.forEach((span, i) => pieces.push(para.slice(span.index, i + 1 < spans.length ? spans[i + 1].index : para.length).trim()));
    } else if (para.split('\n').filter((line) => line.trim()).length > 1) {
      para.split('\n').map((line) => line.trim()).filter(Boolean).forEach((line) => pieces.push(line));
    } else pieces.push(para);
  });
  return pieces.filter(Boolean);
}

/* The narration around a confirmation's real content. Amounts, dates and receipt codes each get
   their own column, so the description is only worth the counterparty and the purpose; everything
   in this list is glue Safaricom puts around them. */
const SMS_GLUE_WORDS = new Set(['a', 'an', 'the', 'and', 'or', 'of', 'on', 'at', 'by', 'to', 'for', 'with',
  'from', 'in', 'into', 'is', 'are', 'am', 'was', 'were', 'be', 'been', 'being', 'have', 'has', 'had',
  'do', 'does', 'did', 'you', 'your', 'yours', 'we', 'our', 'us', 'it', 'its', 'this', 'that', 'will',
  'would', 'shall', 'should', 'can', 'could', 'may', 'might', 'not', 'please', 'thank', 'thanks',
  'new', 'newly', 'currently', 'now', 'today', 'confirmed', 'confirm', 'successfully', 'successful',
  'completed', 'complete', 'sent', 'send', 'sending', 'received', 'receive', 'paid', 'pay', 'paying',
  'credited', 'debited', 'deducted', 'reversed', 'refunded', 'amount', 'balance', 'transaction',
  'cost', 'fee', 'charge', 'service', 'stamp', 'duty', 'mpesa', 'm-pesa', 'safaricom', 'vodacom',
  'account', 'accounts', 'mobile', 'moneyline', 'number', 'phone', 'msisdn', 'using', 'via', 'through',
  'reason', 'remark', 'note', 'message', 'text', 'again', 'just', 'been', 'yours', 'see', 'all',
  'balances', 'invest', 'earn', 'daily', 'interest', 'transact', 'within', 'day', 'more', 'info',
  'details', 'visit', 'click', 'dial', 'get', 'win', 'free', 'bonus', 'sms', 'offer', 'offers']);

function smsDescription(text, receipt) {
  const money = '[0-9][0-9,]*(?:\\.[0-9]{1,2})?';
  let skeleton = ` ${receipt ? text.split(receipt).join(' ') : text} `;
  skeleton = skeleton
    .replace(new RegExp(`(?:new\\s+)?(?:m-?pesa|your\\s+account|account)\\s+balance\\s*(?:\\bis\\b|\\bof\\b|\\bwas\\b|:)?\\s*(?:ksh|kes|sh)?\\s*${money}`, 'gi'), ' ')
    .replace(new RegExp(`(?:transaction\\s*cost|m-?pesa\\s+(?:fee|charge)|service\\s+charge|stamp\\s+duty)(?:\\s*[,;:]\\s*)?(?:\\bof\\b|\\bis\\b|\\bwas\\b)?\\s*(?:ksh|kes|sh)?\\s*${money}`, 'gi'), ' ')
    .replace(new RegExp(`amount\\s+you(?:\\s+(?:can\\s+transact|transacted))(?:\\s+within\\s+the\\s+day)?\\s*(?:\\bis\\b|\\bwas\\b|\\bof\\b|:)?\\s*(?:ksh|kes|sh)?\\s*${money}`, 'gi'), ' ')
    .replace(/https?:\/\/\S+/gi, ' ')
    .replace(/\d{3,4}\*+\d{2,4}/g, ' ')
    .replace(/\b(?:see\s+all|invest\s*&|bofya|sokolora|for\s+more\s+(?:info|details|information)).*$/i, ' ')
    .replace(/\.(?=[A-Za-z])/g, '. ')
    .replace(SMS_DATE_RE, ' ')
    .replace(SMS_TIME_RE, ' ')
    .replace(SMS_AMOUNT_ALL_RE, ' ')
    .replace(/\s+/g, ' ')
    .trim();
  const kept = skeleton.split(' ').map((word) => word.replace(/^[^A-Za-z0-9]+|[^A-Za-z0-9]+$/g, ''))
    .filter((word) => word && !SMS_GLUE_WORDS.has(word.toLowerCase()));
  return (kept.join(' ') || skeleton).slice(0, 140);
}

function parseSmsMessage(block) {
  const text = String(block || '').replace(/\s+/g, ' ').trim();
  if (!text) return null;
  const spans = smsReceiptSpans(text);
  const receipt = spans.length ? spans[0].code : '';
  let working = text;
  let balanceCents = null;
  let feeCents = null;
  const balance = working.match(SMS_BALANCE_RE);
  if (balance) {
    balanceCents = parseStatementAmount(balance[1]);
    working = working.replace(balance[0], ' ');
  }
  const fee = working.match(SMS_FEE_RE);
  if (fee) {
    feeCents = parseStatementAmount(fee[1]);
    working = working.replace(fee[0], ' ');
  }
  const amount = working.match(SMS_AMOUNT_RE);
  const cents = amount ? parseStatementAmount(amount[1]) : null;
  const clock = text.match(SMS_TIME_RE);
  const incoming = SMS_IN_RE.test(text);
  const outgoing = SMS_OUT_RE.test(text);
  const dir = SMS_STRONG_IN_RE.test(text) ? 'in'
    : incoming && !outgoing ? 'in'
      : outgoing && !incoming ? 'out' : null;
  return {
    receipt,
    date: parseStatementDate((text.match(SMS_DATE_RE) || [])[1] || ''),
    time: clock ? clock[0].replace(/^at\s+/i, '').replace(/[.\s]+$/, '').replace(/\s+/g, '').toUpperCase() : '',
    cents,
    feeCents,
    balanceCents,
    dir,
    failed: SMS_FAILED_RE.test(text),
    description: smsDescription(text, receipt),
    raw: text
  };
}

/* Safaricom prints one movement as two texts, the sender's copy and the receiver's copy,
   under the same receipt. Posting both would double the money, so only the first stands.
   A statement of one account is the opposite case: it prints both legs of one event — the
   payment out and the cover that funded it — under the same code, and each leg is a real
   movement, so the caller that knows its text came from a statement asks for both to stay. */
function parseSmsMessages(text, options) {
  const keepEchoes = !!(options && options.keepEchoes);
  const kept = [];
  const seen = new Set();
  let dropped = 0;
  let refused = 0;
  splitSmsMessages(text).forEach((block) => {
    let msg = parseSmsMessage(block);
    if (!msg || msg.cents == null || !msg.cents || !msg.dir) {
      // Enhanced resilient fallback: ensure zero dropped messages
      const raw = String(block || '');
      const amountMatch = raw.match(/(?:Ksh|KES)\.?\s*([0-9,]+(?:\.[0-9]{1,2})?)/i);
      const cents = amountMatch ? parseStatementAmount(amountMatch[1]) : null;
      const receiptMatch = raw.match(/\b([A-Z][A-Z0-9]{9})\b/);
      const receipt = receiptMatch ? receiptMatch[1] : (msg && msg.receipt ? msg.receipt : '');
      const lower = raw.toLowerCase();
      const isIncoming = lower.includes('received') || lower.includes('deposited') || lower.includes('credited');
      const dir = isIncoming ? 'in' : 'out';

      if (cents) {
        msg = {
          receipt: receipt || `SMS-${Date.now().toString(36).toUpperCase()}`,
          date: (msg && msg.date) || todayISO(),
          time: (msg && msg.time) || '',
          cents,
          feeCents: (msg && msg.feeCents) || 0,
          balanceCents: (msg && msg.balanceCents) || null,
          dir,
          failed: false,
          description: (msg && msg.description) || raw.slice(0, 120),
          raw
        };
      } else {
        refused += 1;
        return;
      }
    }
    const key = msg.receipt ? `r:${msg.receipt}` : `${msg.date || '?'}|${msg.time}|${msg.cents}|${msg.dir}`;
    if (!keepEchoes && seen.has(key)) {
      dropped += 1;
      return;
    }
    seen.add(key);
    kept.push(msg);
  });
  return { messages: kept, dropped, refused };
}

function smsStatementMatrix(messages) {
  const groups = messages.slice().sort((a, b) => smsWhen(b).localeCompare(smsWhen(a)));
  const rows = [];
  groups.forEach((msg) => {
    const group = [[
      msg.receipt,
      msg.date || todayISO(),
      msg.description || (msg.receipt || 'Pasted message'),
      msg.failed ? 'Not completed' : 'Completed',
      msg.dir === 'in' ? (msg.cents / 100).toFixed(2) : '',
      msg.dir === 'out' ? (msg.cents / 100).toFixed(2) : '',
      '',
      msg.time
    ]];
    // A separate fee line is taken at the same moment, so the balance the message prints
    // is the balance after both. Putting it on the last line keeps that arithmetic true.
    if (msg.feeCents) {
      group.push([
        msg.receipt,
        msg.date || todayISO(),
        `M-Pesa fee${msg.description ? ` · ${msg.description}` : ''}`.slice(0, 140),
        'Fee',
        '',
        (msg.feeCents / 100).toFixed(2),
        '',
        msg.time
      ]);
    }
    if (msg.balanceCents != null) group[group.length - 1][6] = (msg.balanceCents / 100).toFixed(2);
    group.forEach((row) => rows.push(row));
  });
  return rows;
}

/* `origin` is set when the texts were re-worded from a statement file rather than pasted, so the
   review screen can say where each line came from. */
function readImportSmsText(text, origin) {
  const keepAccount = imp && imp.accountId && accountById(imp.accountId) ? imp.accountId : '';
  const parsed = parseSmsMessages(text, origin ? { keepEchoes: true } : null);
  if (!parsed.messages.length) {
    const why = parsed.refused
      ? `${parsed.refused} ${plural(parsed.refused, 'message')} read, but none said both how much moved and which way. ${
        origin ? 'Use the rows from the file instead — the table below still posts them.' : 'Paste the full text of each message.'}`
      : 'Nothing that looks like an M-Pesa message was found in that text.';
    imp = Object.assign(imp || {}, { smsText: String(text || '').slice(0, 200000), smsError: why, mode: 'sms' });
    toast(why, 'error');
    renderImportStep();
    return;
  }
  const newest = parsed.messages.filter((msg) => msg.balanceCents != null)
    .sort((a, b) => smsWhen(b).localeCompare(smsWhen(a)))[0];
  imp = {
    step: 3,
    kind: 'sms',
    mode: 'sms',
    fileName: origin
      ? `${parsed.messages.length} texts re-worded from ${origin.file}`
      : `${parsed.messages.length} pasted ${plural(parsed.messages.length, 'message')}`,
    delimiterLabel: origin ? 're-worded statement' : 'pasted messages',
    smsText: String(text || '').slice(0, 200000),
    smsDropped: parsed.dropped,
    smsRefused: parsed.refused,
    smsOrigin: origin || null,
    smsRead: parsed.messages.length,
    matrix: smsStatementMatrix(parsed.messages),
    headerIndex: -1,
    hasHeader: false,
    map: { date: 1, description: 2, out: 5, inc: 4, amount: null, sign: null, payee: null },
    cols: { receipt: 0, status: 3, balance: 6, time: 7 },
    accountId: keepAccount,
    rows: [],
    filter: 'all',
    page: 0,
    bulk: { expense: '', income: '' },
    batch: uid('imp'),
    skipped: 0,
    statementFrom: origin ? String(origin.from || '') : '',
    statementTo: origin ? String(origin.to || '') : '',
    statementCents: origin && origin.statementCents != null
      ? origin.statementCents
      : newest ? newest.balanceCents : null
  };
  if (!imp.accountId) {
    const mobile = activeAccounts().find((acc) => /pesa|m-shwari|lipa/i.test(`${acc.name} ${acc.institution || ''}`));
    imp.accountId = mobile ? mobile.id : '';
  }
  buildImportRows();
  if (!activeModal) openImportModal(imp.accountId);
  else renderImportStep();
}

/* ---------------------------------------------------------- M-Pesa message export
   The confirmation text is the most portable form this data has: a file of them pastes back
   through the reader above. So every line written here is built from wording that reader
   accepts — a code at the front, one KSh figure before the counterparty, the direction stated
   once, and the running balance the ledger itself carries. */
const MPEX_LETTERS = 'ACDEFGHJKLMNPQRSTUVWXY';

function mpesaCodeFromSeed(seed) {
  let hash = 5381;
  for (let i = 0; i < seed.length; i++) hash = ((hash * 33) ^ seed.charCodeAt(i)) >>> 0;
  let n = hash;
  const body = [];
  for (let i = 0; i < 7; i++) {
    body.push(MPEX_LETTERS[n % MPEX_LETTERS.length]);
    n = Math.floor(n / MPEX_LETTERS.length) + i * 7 + 11;
  }
  return `${body.join('')}${String(hash % 1000).padStart(3, '0')}`;
}

function mpesaCode(tx) {
  const stored = String(tx.importReceipt || '');
  if (/^[A-Z0-9]{8,16}$/.test(stored) && (stored.match(/[A-Z]/g) || []).length >= 3) return stored;
  return mpesaCodeFromSeed(`${tx.id}|${tx.date}|${tx.amountCents}`);
}

function mpesaAmountText(cents) {
  const cur = currencyConfig();
  const digits = new Intl.NumberFormat(cur.locale, { minimumFractionDigits: 2, maximumFractionDigits: 2 })
    .format(Math.abs(cents) / 100);
  return `${cur.symbol}${digits}`;
}

function mpesaDayText(iso) {
  const parts = String(iso || '').split('-');
  return parts.length === 3 ? `${parts[2]}/${parts[1]}/${parts[0].slice(2)}` : String(iso || '');
}

/* A payee called "SHOP KSh 500" would hand the reader a second amount to choose from.
   The figure the message is about is the one already known, so the name is stripped. */
function mpesaPartyText(raw) {
  return String(raw || '').replace(/(?:ksh|kes|ks|sh)\s*[0-9][0-9,.]*/gi, ' ').replace(/\s+/g, ' ').trim() || 'M-Pesa';
}

function mpesaTxText(tx, account) {
  if (tx.type === 'transfer') {
    const otherId = tx.accountId === account.id ? tx.toAccountId : tx.accountId;
    const other = otherId ? accountById(otherId) : null;
    if (other) return other.name;
    return mpesaPartyText(tx.payee || tx.description);
  }
  return mpesaPartyText(tx.payee || tx.description || (tx.type === 'income' ? 'a deposit' : 'a payment'));
}

/* Walking the account from its first entry, rather than jumping to the middle of history, is
   what makes the last balance printed equal the figure on the Accounts page. Fees are folded
   into the movement they came with, the way one Safaricom message carries both. */
function mpesaRecords(accountId) {
  const account = accountById(accountId);
  if (!account) return [];
  const sign = accountNature(account) === 'asset' ? 1 : -1;
  const touching = state.transactions
    .filter((tx) => tx.entries.some((entry) => entry.accountId === accountId))
    .sort((a, b) => String(a.date).localeCompare(String(b.date))
      || String(a.createdAt || '').localeCompare(String(b.createdAt || ''))
      || String(a.ref || '').localeCompare(String(b.ref || '')));
  let running = 0;
  const records = [];
  touching.forEach((tx) => {
    const delta = tx.entries
      .filter((entry) => entry.accountId === accountId)
      .reduce((sum, entry) => sum + sign * (entry.debitCents - entry.creditCents), 0);
    running += delta;
    const last = records[records.length - 1];
    const isFee = /^m-?pesa fee/i.test(tx.description || '');
    if (isFee && last && last.date === tx.date && Math.sign(last.delta) === Math.sign(delta)) {
      last.feeCents += Math.abs(delta);
      last.balanceCents = running;
      last.folded += 1;
      return;
    }
    if (!delta) return;
    records.push({ tx, date: tx.date, delta, feeCents: 0, balanceCents: running, folded: 0 });
  });
  return records;
}

/* One sentence builder for both directions of this conversion, so a text re-worded from a
   statement table and a text rebuilt from the ledger are the same wording and the reader in
   the wizard cannot tell which one it is holding. */
function mpesaBalancePhrase(account) {
  const raw = `${account ? account.name : ''} ${account && account.institution ? account.institution : ''}`;
  return /m-?pesa|m-?shwari|lipa|fuliza|safaricom/i.test(raw) ? 'New M-PESA balance is' : 'New balance is';
}

function mpesaLineText(opts) {
  const status = opts.status && !/^completed$/i.test(opts.status) ? opts.status : 'Confirmed';
  const amount = mpesaAmountText(opts.cents);
  const lead = opts.dir === 'in' ? `You have received ${amount} from ${opts.party}`
    : opts.transfer ? `${amount} sent to ${opts.party}` : `${amount} paid to ${opts.party}`;
  const balance = opts.balanceCents == null || opts.balanceCents < 0
    ? '' : ` ${opts.phrase || 'New M-PESA balance is'} ${mpesaAmountText(opts.balanceCents)}.`;
  return `${opts.code} ${status}. ${lead} on ${mpesaDayText(opts.date)}${opts.clock ? ` at ${opts.clock}` : ''}.${balance}${
    opts.feeCents ? ` Transaction cost, ${mpesaAmountText(opts.feeCents)}.` : ''
  }`.replace(/\s+/g, ' ').trim();
}

function mpesaMessages(accountId, fromISO, toISO) {
  const account = accountById(accountId);
  if (!account) return { lines: [], records: [], folded: 0, negatives: 0 };
  const all = mpesaRecords(accountId);
  const chosen = all.filter((rec) => (!fromISO || rec.date >= fromISO) && (!toISO || rec.date <= toISO));
  /* Below zero there is no balance to print the way Safaricom prints one, and writing the
     figure without its sign would hand the importer a balance its own arithmetic disproves.
     Those lines go out without a printed balance, so the chain check waits for the next real one. */
  const lines = chosen.map((rec) => mpesaLineText({
    code: mpesaCode(rec.tx),
    cents: Math.abs(rec.delta),
    dir: accountNature(account) === 'asset' && rec.delta > 0 ? 'in' : 'out',
    transfer: rec.tx.type === 'transfer',
    party: mpesaTxText(rec.tx, account),
    date: rec.date,
    balanceCents: rec.balanceCents,
    feeCents: rec.feeCents,
    phrase: mpesaBalancePhrase(account)
  }));
  return {
    lines,
    records: chosen,
    folded: chosen.reduce((sum, rec) => sum + rec.folded, 0),
    printed: chosen.filter((rec) => rec.balanceCents >= 0).length,
    realCodes: chosen.filter((rec) => String(rec.tx.importReceipt || '').length > 0).length,
    negatives: chosen.filter((rec) => rec.balanceCents < 0).length
  };
}

function mpesaClockText(raw) {
  /* A statement prints to the second and a message never does. The second is dropped, not the
     minute: inside one minute it is the printed balances that decide the order, as always. */
  const match = /^(\d{1,2}):(\d{2})(?::\d{2})?\s*([ap])?[m.]?m?\.?$/i.exec(String(raw || '').trim());
  if (!match) return '';
  let hours = Number(match[1]);
  const meridiem = match[3] ? match[3].toLowerCase() : hours >= 12 ? 'p' : 'a';
  if (meridiem === 'p' && hours < 12) hours += 12;
  if (meridiem === 'a' && hours === 12) hours = 0;
  return `${hours % 12 === 0 ? 12 : hours % 12}:${match[2]} ${hours < 12 ? 'AM' : 'PM'}`;
}

/* A statement table says what a confirmation text says, in columns instead of words. Re-wording
   the rows and reading them back puts a file through the same reader the messages from his phone
   use, so one parser and one set of arithmetic rules decide what posts. The balance carried into
   each line is the statement's own printed figure, never a recomputed one — that is what keeps
   the chain check able to catch a wrong row instead of agreeing with itself. */
function statementTexts(rows, accountId) {
  const account = accountById(accountId);
  const phrase = mpesaBalancePhrase(account);
  /* A statement prints newest first, so a charge sits on the line above the payment it belongs
     to. Walking the rows in the order the money actually moved is what lets the charge fold into
     its payment instead of becoming a text about nothing. */
  const isFeeRow = (row) => /^m-?pesa fee/i.test(String(row.description || ''));
  const stampOf = (row) => `${row.date} ${String(statementClock(row)).padStart(4, '0')}`;
  const chrono = (rows || []).map((row, seq) => Object.assign({ seq }, row))
    .sort((a, b) => stampOf(a).localeCompare(stampOf(b)) || (isFeeRow(a) ? 1 : 0) - (isFeeRow(b) ? 1 : 0));
  const groups = [];
  chrono.forEach((row) => {
    const last = groups[groups.length - 1];
    const isFee = isFeeRow(row);
    const delta = row.dir === 'out' ? -row.cents : row.cents;
    const bothBlank = last && last.balanceCents == null && row.balanceCents == null;
    const proved = last && last.date === row.date && last.dir === row.dir && (bothBlank
      || (last.balanceCents != null && row.balanceCents != null && last.balanceCents + delta === row.balanceCents));
    if (isFee && proved) {
      last.feeCents += row.cents;
      if (row.balanceCents != null) last.balanceCents = row.balanceCents;
      last.folded += 1;
      return;
    }
    groups.push({
      seq: row.seq,
      receipt: row.receipt || '',
      date: row.date,
      time: row.time || '',
      status: row.status || '',
      cents: row.cents,
      dir: row.dir,
      transfer: row.kind === 'transfer',
      party: mpesaPartyText(row.description),
      balanceCents: row.balanceCents == null ? null : row.balanceCents,
      feeCents: 0,
      folded: 0
    });
  });
  /* The lines leave in the order the file printed them, so reading them back gives the review
     table the same sequence the rows already had. Folding walks the money in date order; that
     is a reading of the arithmetic, not a licence to reshuffle the statement. */
  const ordered = groups.slice().sort((a, b) => a.seq - b.seq);
  const lines = ordered.map((group) => mpesaLineText({
    code: /^[A-Z0-9]{8,16}$/.test(group.receipt) && (group.receipt.match(/[A-Z]/g) || []).length >= 3
      ? group.receipt
      : mpesaCodeFromSeed(`${accountId}|${group.date}|${group.cents}|${group.party}`),
    cents: group.cents,
    dir: group.dir,
    transfer: group.transfer,
    party: group.party,
    date: group.date,
    clock: mpesaClockText(group.time),
    status: group.status,
    balanceCents: group.balanceCents,
    feeCents: group.feeCents,
    phrase
  }));
  return {
    lines,
    groups,
    folded: groups.reduce((sum, group) => sum + group.folded, 0),
    printed: groups.filter((group) => group.balanceCents != null && group.balanceCents >= 0).length,
    unprinted: groups.filter((group) => group.balanceCents == null).length,
    rows: (rows || []).length
  };
}

let mpex = null;

function mpexDates() {
  const today = todayISO();
  const records = mpesaRecords(mpex.accountId);
  const earliest = records.length ? records[0].date : today;
  const month = addDays(today, -29);
  return { from: mpex.all || month < earliest ? earliest : month, to: today };
}

function mpexBody() {
  const account = accountById(mpex.accountId);
  const result = mpesaMessages(mpex.accountId, mpex.from, mpex.to);
  const options = activeAccounts().filter((acc) => accountNature(acc) === 'asset');
  const shown = result.lines.slice(0, 4).map((line) => esc(line)).join('\n');
  const rest = result.lines.length - 4;
  const notes = [];
  notes.push(result.folded
    ? `${result.folded} ${plural(result.folded, 'charge')} folded into the movement it came with, as one message.`
    : 'No separate charges were folded in.');
  const fresh = result.lines.length - result.realCodes;
  notes.push(!result.lines.length ? '' : !result.realCodes
    ? 'None of these came from a pasted message, so every line is given a code of its own. They keep the same code on every export, but pasting this file back would read as new money.'
    : fresh
    ? `${result.realCodes} ${plural(result.lines.length, 'line')} keep the code the statement printed and the other ${fresh} ${plural(fresh, 'line')} get a fresh one. Pasting this file back into this ledger shows the first group as already posted and the second as new money.`
    : 'Every line carries the code the statement printed, so pasting this file back into this ledger shows them as already posted rather than new money.');
  if (result.negatives) {
    notes.push(`${result.negatives} ${plural(result.negatives, 'movement')} left the account below zero. Safaricom never prints a negative balance, so those lines carry none and the running check resumes at the next line that does.`);
  }
  if (!result.lines.length) {
    notes.push(`Pick a wider range, or press “${mpex.all ? 'Last 30 days only' : 'Every day on record'}”.`);
  }
  return `<p class="modal-intro">Each line is one movement of ${esc(account ? account.name : 'the account')} written the way Safaricom words a confirmation. The balance in every line is this ledger's own running figure, so the last one matches the Accounts page and the whole file pastes back into the importer unchanged.</p>
    <div class="mpex-grid">
      <label class="field"><span class="label">Account</span>
        <select class="select" data-mp="account">
          ${options.map((acc) => `<option value="${esc(acc.id)}"${acc.id === mpex.accountId ? ' selected' : ''}>${esc(acc.name)}</option>`).join('')}
        </select></label>
      <label class="field"><span class="label">From</span><input class="input" type="date" data-mp="from" value="${esc(mpex.from)}"></label>
      <label class="field"><span class="label">To</span><input class="input" type="date" data-mp="to" value="${esc(mpex.to)}"></label>
      <button type="button" class="link-btn" data-act="mpesa-all">${mpex.all ? 'Last 30 days only' : `Every day on record (${result.records.length} ${plural(result.records.length, 'message')})`}</button>
    </div>
    ${result.lines.length
      ? `<pre class="mpex-pre">${shown}${rest > 0 ? `\n\n…and ${rest} more ${plural(rest, 'line')}` : ''}</pre>`
      : '<div class="mpex-pre mpex-none">Nothing on this account in those dates.</div>'}
    <p class="tiny">${notes.filter(Boolean).join(' ')}</p>`;
}

function mpexFoot() {
  const count = mpesaMessages(mpex.accountId, mpex.from, mpex.to).lines.length;
  return `<button type="button" class="btn btn-ghost" data-act="close-modal">Cancel</button>
    <button type="button" class="btn btn-primary" data-act="mpesa-download"${count ? '' : ' disabled'}>${icon('download', 14)} Download ${count} ${plural(count, 'message')}.txt</button>`;
}

function renderMpesaExport() {
  const layer = document.getElementById('modal-layer');
  if (!mpex || !layer || !layer.querySelector('.modal-body')) {
    openMpesaExportModal(mpex ? mpex.accountId : '');
    return;
  }
  const count = mpesaMessages(mpex.accountId, mpex.from, mpex.to).lines.length;
  const head = layer.querySelector('.modal-head p');
  if (head) head.textContent = count
    ? `${count} ${plural(count, 'message')} ready to download`
    : 'Nothing in this range yet — widen the dates.';
  layer.querySelector('.modal-body').innerHTML = mpexBody();
  const foot = layer.querySelector('.modal-foot');
  if (foot) foot.innerHTML = mpexFoot();
}

function handleMpesaChange(element) {
  if (!mpex) return;
  const kind = element.dataset.mp;
  if (kind === 'account') {
    mpex.accountId = element.value;
    const dates = mpexDates();
    mpex.from = dates.from;
    mpex.to = dates.to;
  } else if (kind === 'from' || kind === 'to') {
    mpex[kind] = element.value;
  } else return;
  renderMpesaExport();
}

function toggleMpesaAll() {
  if (!mpex) return;
  mpex.all = !mpex.all;
  const dates = mpexDates();
  mpex.from = dates.from;
  mpex.to = dates.to;
  renderMpesaExport();
}

function openMpesaExportModal(accountId) {
  if (!state) return;
  const options = activeAccounts().filter((acc) => accountNature(acc) === 'asset');
  if (!options.length) {
    toast('This writes messages for accounts that hold money, so loans and cards are out.', 'error');
    return;
  }
  mpex = { accountId: options.some((acc) => acc.id === accountId) ? accountId : options[0].id, all: false, from: '', to: '' };
  const dates = mpexDates();
  mpex.from = dates.from;
  mpex.to = dates.to;
  const count = mpesaMessages(mpex.accountId, mpex.from, mpex.to).lines.length;
  openModal({
    title: 'M-Pesa confirmation texts',
    subtitle: count ? `${count} ${plural(count, 'message')} ready to download` : 'Nothing in this range yet — widen the dates.',
    size: 'lg',
    body: mpexBody(),
    foot: mpexFoot()
  });
}

function downloadMpesaMessages() {
  if (!mpex) return;
  const account = accountById(mpex.accountId);
  const result = mpesaMessages(mpex.accountId, mpex.from, mpex.to);
  if (!account || !result.lines.length) {
    toast('That range has no movements on it yet, so there is nothing to write.', 'error');
    return;
  }
  const slug = String(account.name).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  const name = `mpesa-${slug || 'account'}-${mpex.from}-to-${mpex.to}.txt`;
  if (downloadFile(name, `${result.lines.join('\n')}\n`)) {
    toast(`${result.lines.length} ${plural(result.lines.length, 'message')} saved as ${name}. Paste them back into Import → Paste messages whenever you want.`, 'ok');
  }
}


/* M-Pesa prints the overdraft that funded a payment as its own money-in line under the
   same receipt, and the figure there is only the part that was borrowed: an 800 purchase
   with 300 on Fuliza prints 800 out and 300 in. Borrowing must never reach the ledger as
   income, so the money-in line is routed to a liability account.
   The money-out line of the same pair is the purchase itself: the wallet was empty and stayed
   empty, because the borrowed money went from the facility straight into the till. Reading it as
   a repayment — which is what a transfer to the liability looks like — cancels debt that was
   never taken and charges the wallet for money it never held. */
const OVERDRAFT_LINE_RE = /overdrawn|overdraft|over draw|fuliza/i;
const OVERDRAFT_REPAY_RE = /repayment|repay|recovery/i;
const OVERDRAFT_FEE_RE = /\bfees?\b|charge for|stamp duty/i;
const REVERSAL_RE = /reversal|reversed|refund|cancelled|canceled|failed/i;

function overdraftLender() {
  return activeAccounts().find((acc) => accountNature(acc) !== 'asset'
    && /fuliza|overdraft|overdraw/i.test(`${acc.name} ${acc.institution || ''}`)) || null;
}

/* A cover line with no liability to land on is left out, which is correct arithmetic and
   useless advice mid-import. The fix is one account, so the importer makes it itself: it opens
   on the earliest date in the file, so the first borrowing has somewhere to sit, and it holds
   no opening balance — borrowing and repaying are the only money it should ever see. */
function addOverdraftAccount(rows) {
  if (overdraftLender()) return null;
  const first = (rows || []).map((row) => row.date).filter(Boolean).sort()[0] || todayISO();
  const openedAt = first <= todayISO() ? first : todayISO();
  const account = normaliseAccount({
    name: 'Fuliza overdraft', type: 'overdraft', institution: 'Safaricom',
    openingCents: 0, openedAt, spendable: false, apr: null, minPaymentCents: 0
  });
  if (!account) return null;
  state.accounts.push(account);
  createOpeningTransaction(account, openedAt);
  persist('account', `Added ${account.name} so the overdraft lines in a statement have a liability to post to.`);
  return account;
}

function routeToLender(row, lender, kind) {
  row.overdraft = true;
  row.overdraftKind = kind;
  const chosen = row.otherAccountId ? accountById(row.otherAccountId) : null;
  const target = chosen && accountNature(chosen) !== 'asset' ? chosen : lender;
  if (target) {
    row.kind = 'transfer';
    row.otherAccountId = target.id;
    row.autoTransfer = true;
  } else if (!row.dup) {
    row.include = false;
    row.autoExclude = true;
  }
}

function classifyOverdraftRows(rows) {
  const lender = overdraftLender();
  const feeCategory = suggestImportCategory('bank charges fees', 'expense');
  for (const row of rows) {
    if (!OVERDRAFT_LINE_RE.test(row.description)) continue;
    if (row.dir !== 'out') {
      routeToLender(row, lender, 'cover');
      continue;
    }
    if (OVERDRAFT_REPAY_RE.test(row.description)) {
      routeToLender(row, lender, 'repayment');
      continue;
    }
    if (OVERDRAFT_FEE_RE.test(row.description)) {
      row.overdraft = true;
      row.overdraftKind = 'fee';
      row.kind = 'expense';
      row.otherAccountId = null;
      if (!row.categoryId && feeCategory) {
        row.categoryId = feeCategory.id;
        row.autoCategory = true;
      }
      continue;
    }
    markOverdraftSpend(row, lender);
  }
  pairUnlabelledCover(rows, lender);
}

/* Spending the phone paid for with borrowed money is still spending. It posts against the wallet
   like any other purchase, because the money-in leg of the same receipt already put the borrowed
   figure there — and it needs no liability account to be recognised, since it is not itself a
   movement of the debt. */
function markOverdraftSpend(row, lender) {
  row.overdraft = true;
  row.overdraftKind = 'spend';
  /* A line that names the facility matches the facility by name. That match describes where the
     money came from, not an account he moved it into, and posting it would take the debt back down
     on the same line that put it up. */
  if (lender && row.otherAccountId === lender.id) {
    row.otherAccountId = null;
    row.autoTransfer = false;
  }
  if (row.kind === 'transfer' && row.otherAccountId) return;
  row.kind = 'expense';
  row.otherAccountId = null;
  row.autoTransfer = false;
}

/* A cover line carrying no overdraft wording at all still cannot be income: if it shares
   a receipt and timestamp with a payment and does not exceed it, it is the borrowed part
   of that payment. Reversals are excluded because they reuse the original receipt, and so is
   a line that repeats the payment’s own wording — a statement prints one event on both sides
   under the same code, and the money in that case really did land. */
function pairUnlabelledCover(rows, lender) {
  const groups = new Map();
  for (const row of rows) {
    if (!row.receipt || !row.cents || row.overdraft) continue;
    const key = `${row.receipt}|${row.time || row.date}`;
    const group = groups.get(key) || [];
    group.push(row);
    groups.set(key, group);
  }
  for (const group of groups.values()) {
    const paid = group.filter((row) => row.dir === 'out');
    const covers = group.filter((row) => row.dir === 'in' && !REVERSAL_RE.test(row.description)
      && !coversOwnPayment(row, paid));
    if (!paid.length || !covers.length) continue;
    let room = paid.reduce((sum, row) => sum + row.cents, 0);
    for (const cover of covers) {
      if (cover.cents > room) continue;
      routeToLender(cover, lender, 'cover');
      room -= cover.cents;
    }
  }
}

/* A statement prints one business withdrawal on both sides of a receipt, only adding a
   verification footer to one of the two lines. Borrowed money is never worded like the payment it
   funded, so a match here means the same event twice and the money really did land. */
function coversOwnPayment(row, paid) {
  return paid.some((out) => {
    const a = out.description;
    const b = row.description;
    return a === b || a.startsWith(b) || b.startsWith(a);
  });
}

function statementClock(row) {
  const match = /^(\d{1,2}):(\d{2})\s*([ap])?/.exec(String(row.time || '').toLowerCase());
  if (!match) return 0;
  let hours = Number(match[1]);
  if (match[3] === 'p' && hours < 12) hours += 12;
  if (match[3] === 'a' && hours === 12) hours = 0;
  return hours * 60 + Number(match[2]);
}

/* Messages carry a day and a clock time; a paste covering one afternoon has to be read in the
   order Safaricom sent it, or the printed balances look like they contradict each other. */
function smsWhen(msg) {
  return `${msg.date || todayISO()} ${String(statementClock(msg)).padStart(4, '0')}`;
}

/* The statement's own Balance column is the referee: each printed balance must equal the
   one before it plus money in minus money out. Where it does not, that row is named as the
   break instead of the difference being averaged away over the whole file. */
/* A row that prints no balance — the fee taken inside the message it came with — is read
   together with the next printed balance, because that figure already accounts for both. With
   every balance accounted for, order is not really free: a step can only follow a value of
   exactly (its balance − its movement), and following that pin checks a whole untimed day of
   dozens of rows in one pass. The exhaustive walk is left for the groups with genuine slack. */
function chainSteps(items) {
  const steps = [];
  let delta = 0;
  let pending = [];
  items.forEach((item) => {
    delta += item.delta;
    if (item.balance == null) { pending.push(item); return; }
    steps.push({ delta, balance: item.balance, rows: pending.concat([item]) });
    delta = 0;
    pending = [];
  });
  return { steps, pending };
}

function chainForcedOrder(start, items) {
  const folded = chainSteps(items);
  if (folded.pending.length) return null;
  const options = new Map();
  folded.steps.forEach((step) => {
    const key = step.balance - step.delta;
    const list = options.get(key);
    if (list) list.push(step);
    else options.set(key, [step]);
  });
  const used = folded.steps.map(() => false);
  let steps = 0;
  let outOfBudget = false;
  const walk = (value, depth) => {
    if (depth === folded.steps.length) return true;
    if (++steps > 400) { outOfBudget = true; return false; }
    const candidates = options.get(value);
    if (!candidates) return false;
    for (let i = 0; i < candidates.length; i++) {
      const at = folded.steps.indexOf(candidates[i]);
      if (used[at]) continue;
      used[at] = true;
      const ok = walk(candidates[i].balance, depth + 1);
      used[at] = false;
      if (ok) return true;
    }
    return false;
  };
  const fitted = walk(start, 0);
  return !fitted && outOfBudget ? null : fitted;
}

/* The cheapest reading of a statement is the order it arrived in: money applied line by line,
   each printed balance landing where the line says it does. Only when that fails is the group
   re-ordered, which is what a paste of messages copied out of sequence needs. */
function chainInOrder(start, items) {
  let value = start;
  for (let i = 0; i < items.length; i++) {
    value += items[i].delta;
    if (items[i].balance != null && value !== items[i].balance) return false;
  }
  return true;
}

function chainGroupFits(start, items) {
  if (chainInOrder(start, items)) return true;
  const forced = chainForcedOrder(start, items);
  if (forced !== null) return forced;
  if (items.length > 7) return true;
  const used = items.map(() => false);
  const walk = (value, depth) => {
    if (depth === items.length) return true;
    for (let i = 0; i < items.length; i++) {
      if (used[i]) continue;
      const next = value + items[i].delta;
      if (items[i].balance != null && next !== items[i].balance) continue;
      used[i] = true;
      const ok = walk(next, depth + 1);
      used[i] = false;
      if (ok) return true;
    }
    return false;
  };
  return walk(start, 0);
}

function annotateImportChain(rows) {
  imp.chain = null;
  rows.forEach((row) => { row.chainError = false; });
  const chrono = rows.slice().sort((a, b) => a.date.localeCompare(b.date)
    || statementClock(a) - statementClock(b) || a.source - b.source);
  const groups = [];
  chrono.forEach((row) => {
    const stamp = row.time ? `${row.date} ${statementClock(row)}` : `untimed ${row.date}`;
    const tail = groups[groups.length - 1];
    if (tail && tail.stamp === stamp) tail.rows.push(row);
    else groups.push({ stamp, rows: [row] });
  });
  let last = null;
  let pending = 0;
  let breaks = 0;
  let first = null;
  let openingCents = null;
  let closingCents = null;
  groups.forEach((group) => {
    const items = group.rows.map((row) => ({ row, delta: row.dir === 'in' ? row.cents : -row.cents, balance: row.balanceCents }));
    const printed = items.filter((item) => item.balance != null);
    const total = items.reduce((sum, item) => sum + item.delta, 0);
    if (!printed.length) {
      // Nothing to referee this stretch, so its money waits and is tested against the next
      // printed balance rather than being skipped.
      pending += total;
      return;
    }
    if (last == null) {
      const end = printed.filter((item) => chainGroupFits(item.balance - total, items))[0]
        || printed[printed.length - 1];
      if (openingCents == null) openingCents = end.balance - pending - total;
      last = end.balance;
    } else {
      const start = last + pending;
      const fits = chainGroupFits(start, items);
      if (!fits) {
        printed.forEach((item) => {
          item.row.chainError = true;
          breaks += 1;
          if (!first) first = item.row;
        });
      }
      last = fits ? start + total : printed[printed.length - 1].balance;
    }
    closingCents = last;
    pending = 0;
  });
  if (openingCents == null) return;
  imp.chain = {
    checked: chrono.filter((row) => row.balanceCents != null).length,
    breaks,
    first: first ? { receipt: first.receipt || '', date: first.date, description: first.description } : null,
    openingCents,
    closingCents,
    inCents: rows.filter((row) => row.dir === 'in').reduce((sum, row) => sum + row.cents, 0),
    outCents: rows.filter((row) => row.dir === 'out').reduce((sum, row) => sum + row.cents, 0)
  };
}

function buildImportRows() {
  if (!imp) return;
  if (!imp.matrix || !imp.matrix.length) {
    imp.rows = [];
    imp.skipped = 0;
    return;
  }
  const start = imp.hasHeader ? imp.headerIndex + 1 : 0;
  const map = imp.map;
  const existing = imp.accountId ? existingImportKeys() : new Set();
  const target = accountById(imp.accountId);
  const targetIsAsset = !target || accountNature(target) === 'asset';
  const rows = [];
  let skipped = 0;
  for (let r = start; r < imp.matrix.length; r += 1) {
    const cells = imp.matrix[r];
    if (!cells || !cells.some((c) => String(c).trim())) continue;
    let cents = 0;
    if (map.out != null || map.inc != null) {
      const outv = map.out != null ? parseStatementAmount(cells[map.out]) : null;
      const incv = map.inc != null ? parseStatementAmount(cells[map.inc]) : null;
      // A negative figure in the money-out column is a reversal, so it lands on the other side.
      if (outv != null && outv !== 0) cents = outv < 0 ? Math.abs(outv) : -Math.abs(outv);
      else if (incv != null && incv !== 0) cents = incv < 0 ? -Math.abs(incv) : Math.abs(incv);
    } else if (map.amount != null) {
      cents = parseStatementAmount(cells[map.amount]) || 0;
      if (cents !== 0 && map.sign != null) {
        const flag = headerKey(cells[map.sign]);
        if (/^(c|cr|credit|in|deposit|paid in|lodgement)$/.test(flag)) cents = Math.abs(cents);
        else if (/^(d|dr|debit|out|withdrawal|paid out)$/.test(flag)) cents = -Math.abs(cents);
      }
    }
    if (cents === 0) { skipped += 1; continue; }
    const description = normaliseStatementDescription(
      [map.description != null ? cells[map.description] : '', map.payee != null && map.payee !== map.description ? cells[map.payee] : '']
        .filter(Boolean).join(' · ')
    ) || `Statement row ${r + 1}`;
    const parsedDate = map.date != null ? parseStatementDate(cells[map.date]) : null;
    const row = {
      index: rows.length,
      source: r,
      date: parsedDate || todayISO(),
      dateGuessed: !parsedDate,
      description: description.slice(0, 140),
      cents: Math.abs(cents),
      dir: cents > 0 ? 'in' : 'out',
      kind: cents > 0 ? (targetIsAsset ? 'income' : 'transfer') : 'expense',
      categoryId: null,
      otherAccountId: null,
      include: true,
      dup: false,
      autoCategory: false,
      autoTransfer: false
    };
    if (imp.cols) {
      if (imp.cols.receipt != null) row.receipt = String(cells[imp.cols.receipt] || '').trim().slice(0, 24);
      if (imp.cols.time != null) row.time = String(cells[imp.cols.time] || '').trim().slice(0, 12);
      if (imp.cols.status != null) row.status = String(cells[imp.cols.status] || '').trim().slice(0, 16);
      if (imp.cols.balance != null) row.balanceCents = pdfStatementCents(cells[imp.cols.balance]);
    }
    const fingerprint = row.receipt ? `rcpt ${row.receipt} ${row.time || row.date} ${row.dir}` : row.description;
    row.fingerprint = fingerprint;
    if (existing.has(importKeyFor(imp.accountId, row.date, row.cents, fingerprint))) {
      row.dup = true;
      row.include = false;
    }
    const transfer = suggestImportTransfer(row.description, row.dir);
    if (transfer) {
      row.kind = 'transfer';
      row.otherAccountId = transfer.id;
      row.autoTransfer = true;
    } else if (row.kind !== 'transfer') {
      const suggestion = suggestImportCategory(row.description, row.kind === 'income' ? 'income' : 'expense');
      if (suggestion) {
        row.categoryId = suggestion.id;
        row.autoCategory = true;
      }
    }
    rows.push(row);
  }
  classifyOverdraftRows(rows);
  annotateImportChain(rows);
  imp.rows = rows;
  imp.skipped = skipped;
  imp.page = 0;
}

function importRowError(row) {
  if (!row.cents) return 'No amount';
  if (!/^\d{4}-\d{2}-\d{2}$/.test(row.date)) return 'Date unreadable';
  if (row.kind === 'transfer') {
    if (!row.otherAccountId) return 'Choose the other account';
    if (row.otherAccountId === imp.accountId) return 'Pick an account other than the target';
  }
  return null;
}

function importKindsFor(row) {
  const target = accountById(imp.accountId);
  if (row.dir === 'in' && target && accountNature(target) !== 'asset') return ['transfer'];
  return row.dir === 'in' ? ['income', 'transfer'] : ['expense', 'transfer'];
}

function importRowEligible(row) {
  return row.include && !row.dup && !importRowError(row);
}

function importVisibleRows() {
  const rows = imp.rows;
  if (imp.filter === 'open') return rows.filter((row) => !row.dup && importRowError(row));
  if (imp.filter === 'dup') return rows.filter((row) => row.dup);
  if (imp.filter === 'excluded') return rows.filter((row) => !row.include);
  if (imp.filter === 'overdraft') return rows.filter((row) => row.overdraft);
  if (imp.filter === 'chain') return rows.filter((row) => row.chainError);
  return rows;
}

function importTotals() {
  let included = 0;
  let open = 0;
  let dupes = 0;
  let overdraft = 0;
  let chain = 0;
  let moneyIn = 0;
  let moneyOut = 0;
  (imp && imp.rows ? imp.rows : []).forEach((row) => {
    if (row.dup) dupes += 1;
    if (row.overdraft) overdraft += 1;
    if (row.chainError) chain += 1;
    if (importRowEligible(row)) {
      included += 1;
      if (row.dir === 'in') moneyIn += row.cents;
      else moneyOut += row.cents;
    } else if (row.include && !row.dup && importRowError(row)) open += 1;
  });
  return { included, open, dupes, moneyIn, moneyOut, overdraft, chain };
}

const IMPORT_STEPS = [
  { id: 1, label: '1 · File & account' },
  { id: 2, label: '2 · Columns' },
  { id: 3, label: '3 · Review the money' }
];

function importStepBar() {
  const labels = imp && imp.mode === 'sms'
    ? ['1 · Messages & account', '2 · Columns', '3 · Review the money']
    : null;
  return `<div class="imp-steps">${IMPORT_STEPS.map((step) => `<div class="imp-step${step.id === imp.step ? ' on' : ''}">${esc(labels ? labels[step.id - 1] : step.label)}</div>`).join('')}</div>`;
}

function accountOptions(filterFn, selected, placeholder) {
  const list = state.accounts.filter(filterFn);
  return `${placeholder ? `<option value="">${esc(placeholder)}</option>` : ''}${list.map((acc) => `<option value="${esc(acc.id)}"${impSel(acc.id, selected)}>${esc(acc.name)}${acc.archived ? ' (archived)' : ''}</option>`).join('')}`;
}

function categoryOptionsByType(type, selected, placeholder) {
  const list = categoriesOf(type, false);
  return `${placeholder ? `<option value="">${esc(placeholder)}</option>` : ''}${list.map((cat) => `<option value="${esc(cat.id)}"${impSel(cat.id, selected)}>${esc(cat.name)}</option>`).join('')}`;
}

function importTextsBlock() {
  if (!imp.rows.length) return '';
  const texts = statementTexts(imp.rows, imp.accountId);
  const shown = texts.lines.slice(0, 3).map((line) => esc(line)).join('\n');
  const rest = texts.lines.length - 3;
  const notes = [];
  if (texts.folded) {
    notes.push(`${texts.folded} ${plural(texts.folded, 'charge')} folded into the movement it came with, the way one message carries both.`);
  }
  notes.push(texts.unprinted
    ? `${texts.unprinted} ${plural(texts.unprinted, 'row')} ${texts.unprinted === 1 ? 'has' : 'have'} no balance in the file, so its text prints none and the running check resumes at the next balance the statement does print.`
    : 'Every line carries the balance the statement itself printed, so the running check has something to referee it against.');
  return `<div class="imp-texts">
    <div class="imp-texts-head">
      <div><strong>Or read these rows as confirmation texts</strong>
        <span>${texts.lines.length} ${plural(texts.lines.length, 'text')} built from the table above. Reading them back runs the file through the same reader a pasted message uses, and keeps both legs of a code the statement prints twice.</span></div>
      <button type="button" class="btn btn-secondary btn-sm" data-act="imp-to-text">Re-word and read the ${texts.lines.length} ${plural(texts.lines.length, 'text')}</button>
    </div>
    <pre class="mpex-pre">${shown}${rest > 0 ? `\n\n…and ${rest} more ${plural(rest, 'line')}` : ''}</pre>
    <p class="tiny">${notes.join(' ')}</p>
    ${imp.textError ? `<div class="imp-error"><strong>Not re-worded</strong>${esc(imp.textError)}</div>` : ''}
  </div>`;
}

/* Until a liability account exists, the Fuliza borrowing and repayment lines sit in the Excluded
   filter with a badge saying why. Borrowing is not income, so the money cannot post anywhere
   else — but explaining that is worth less here than fixing it, so the review screen names the
   waiting money and offers the one click that routes all of it. */
function importFulizaBlock() {
  if (overdraftLender()) return '';
  const waiting = imp.rows.filter((row) => row.overdraft && !row.include);
  if (!waiting.length) return '';
  const borrowed = waiting.filter((row) => row.dir === 'in').reduce((sum, row) => sum + row.cents, 0);
  const repaid = waiting.filter((row) => row.dir === 'out').reduce((sum, row) => sum + row.cents, 0);
  const firstDay = waiting.map((row) => row.date).filter(Boolean).sort()[0] || todayISO();
  const target = accountById(imp.accountId);
  return `<div class="imp-texts">
    <div class="imp-texts-head">
      <div><strong>${waiting.length} ${plural(waiting.length, 'overdraft line')} ${waiting.length === 1 ? 'has' : 'have'} nowhere to go</strong>
        <span>${esc(money(borrowed, { whole: false }))} borrowed on Fuliza and ${esc(money(repaid, { whole: false }))} repaid are excluded because no liability account is named yet.</span></div>
      <button type="button" class="btn btn-primary btn-sm" data-act="imp-fuliza">Add the Fuliza overdraft account</button>
    </div>
    <p class="tiny">It opens on ${esc(firstDay)} with nothing in it. The payments the overdraft funded are already in the table as spending; this is where the borrowing and the repayments land — ${esc(target ? target.name : 'the wallet account')} up or down as the statement prints it, the new account carrying what you owe. Rename it later on the Accounts page.</p>
  </div>`;
}

function importStepTwo() {
  const map = imp.map;
  const preview = dataCells(imp.matrix, imp.headerIndex).slice(0, 6);
  const fields = [
    ['date', 'Date'],
    ['description', 'Description'],
    ['out', 'Money out / debit'],
    ['inc', 'Money in / credit'],
    ['amount', 'Amount (single column)'],
    ['sign', 'Dr/Cr indicator'],
    ['payee', 'Payee / reference']
  ];
  const hasPair = map.out != null || map.inc != null;
  return `${importStepBar()}
    <p class="modal-intro">${esc(imp.fileName)} · ${imp.matrix.length} rows read with the <strong>${esc(imp.delimiterLabel)}</strong> separator.${imp.hasHeader ? '' : ' No header row was recognised, so the columns were guessed from their contents — check them below.'}</p>
    <div class="imp-map-grid">
      ${fields.map(([key, label]) => `<label class="field"><span class="label">${esc(label)}</span>
        <select class="select" data-imp="map" data-field="${key}">${importColumnOptions(map[key], map[key])}</select></label>`).join('')}
    </div>
    ${hasPair ? `<div class="info-note forest" style="margin-top:14px">${icon('check-circle', 15)}<span>Money in and money out are separate columns, so each row’s direction comes from whichever one holds a figure. The single Amount column is ignored while both are set.</span></div>` : ''}
    <div class="imp-scroll" style="margin-top:16px">
      <table class="imp-table">
        <thead><tr><th>Date</th><th>Description</th><th class="imp-amt">Money out</th><th class="imp-amt">Money in</th></tr></thead>
        <tbody>${preview.map((cells) => {
          const date = map.date != null ? parseStatementDate(cells[map.date]) : null;
          let out = null;
          let inc = null;
          if (hasPair) {
            const o = map.out != null ? parseStatementAmount(cells[map.out]) : null;
            const i = map.inc != null ? parseStatementAmount(cells[map.inc]) : null;
            if (o) out = Math.abs(o);
            else if (i) inc = Math.abs(i);
          } else if (map.amount != null) {
            const v = parseStatementAmount(cells[map.amount]);
            if (v) (v > 0 ? inc = Math.abs(v) : out = Math.abs(v));
          }
          const description = normaliseStatementDescription(cells[map.description]) || '—';
          return `<tr><td>${esc(date || '—')}${date ? '' : ' <span class="imp-badge warn">unreadable</span>'}</td>
            <td>${esc(description.slice(0, 60))}</td>
            <td class="imp-amt">${out ? esc(money(out)) : ''}</td>
            <td class="imp-amt">${inc ? esc(money(inc)) : ''}</td></tr>`;
        }).join('')}</tbody>
      </table>
    </div>
    ${importTextsBlock()}
    <p class="hint" style="margin-top:12px">${imp.rows.length} statement rows will be offered for categorising. ${imp.skipped ? `${imp.skipped} ${plural(imp.skipped, 'row')} with no readable amount ${imp.skipped === 1 ? 'was' : 'were'} skipped.` : ''}</p>`;
}

function importRowMarkup(row) {
  const error = importRowError(row);
  const isTransfer = row.kind === 'transfer';
  const statement = !!imp.cols;
  const otherAccounts = state.accounts.filter((acc) => !acc.archived && acc.id !== imp.accountId);
  const kindSelect = `<select class="select" data-imp="kind" data-row="${row.index}">
    ${importKindsFor(row).map((kind) => `<option value="${kind}"${impSel(kind, row.kind)}>${kind === 'transfer' ? (row.dir === 'out' ? 'Transfer out' : 'Transfer in') : (kind === 'income' ? 'Income' : 'Expense')}</option>`).join('')}
  </select>`;
  const targetSelect = isTransfer
    ? `<select class="select" data-imp="other" data-row="${row.index}"><option value="">Choose account…</option>${otherAccounts.map((acc) => `<option value="${esc(acc.id)}"${impSel(acc.id, row.otherAccountId)}>${esc(acc.name)}</option>`).join('')}</select>`
    : `<select class="select" data-imp="category" data-row="${row.index}">${categoryOptionsByType(row.kind === 'income' ? 'income' : 'expense', row.categoryId, 'Choose category…')}</select>`;
  const badges = [];
  if (row.dup) badges.push('<span class="imp-badge dup">already in ledger</span>');
  if (row.overdraft) {
    const spend = row.overdraftKind === 'spend';
    const label = row.overdraftKind === 'fee' ? 'overdraft fee · spending'
      : row.overdraftKind === 'repayment' ? (row.otherAccountId ? 'repays the overdraft · not spending' : 'overdraft repayment · pick a liability account')
      : spend ? 'paid with the overdraft · spending, not a repayment'
      : (row.otherAccountId ? 'borrowed · goes to the liability account' : 'borrowed · pick a liability account');
    badges.push(`<span class="imp-badge ${row.otherAccountId || spend || row.overdraftKind === 'fee' ? 'auto' : 'warn'}">${label}</span>`);
  }
  if (!row.include && !row.dup) badges.push(`<span class="imp-badge warn">${row.autoExclude ? 'no liability account to post it to' : 'not selected · tick to post'}</span>`);
  if (row.dateGuessed) badges.push('<span class="imp-badge warn">date guessed</span>');
  if (row.status && !/^completed$/i.test(row.status)) badges.push(`<span class="imp-badge warn">${esc(row.status)}</span>`);
  if (row.chainError) badges.push('<span class="imp-badge warn">balance does not add up here</span>');
  if (row.autoTransfer) badges.push('<span class="imp-badge auto">matched to your account</span>');
  else if (row.autoCategory) badges.push('<span class="imp-badge auto">guessed</span>');
  if (error && !row.dup) badges.push(`<span class="imp-badge warn">${esc(error)}</span>`);
  if (!row.dup && row.kind !== 'transfer' && !row.categoryId) badges.push('<span class="imp-badge">no category yet · set it in Transactions</span>');
  const targetAccount = accountById(imp.accountId);
  const moves = targetAccount ? `<div class="imp-moves">${importMovementText(row, targetAccount)}</div>` : '';
  const checkCell = `<td><input type="checkbox" data-imp="include" data-row="${row.index}"${row.include && !row.dup ? ' checked' : ''}${row.dup ? ' disabled' : ''} aria-label="Include ${esc(row.description)}">${statement && row.receipt ? `<div class="imp-receipt">${esc(row.receipt)}</div>` : ''}</td>`;
  const dateCell = `<td><input type="date" class="input imp-date" data-imp="date" data-row="${row.index}" value="${esc(row.date)}">${statement && row.time ? `<div class="imp-receipt">${esc(row.time)}</div>` : ''}</td>`;
  const descCell = `<td class="imp-desc">${esc(row.description)}<div class="imp-badges">${badges.join('')}</div></td>`;
  const kindCell = `<td>${kindSelect}</td>`;
  const catCell = `<td>${targetSelect}${moves}</td>`;
  const amountCell = `<td class="imp-amt ${row.dir === 'in' ? 'pos' : 'neg'}">${esc(row.dir === 'in' ? '+' : '−')}${esc(money(row.cents, { whole: false }))}</td>`;
  if (!statement) {
    return `<tr data-row="${row.index}" class="${row.include && !row.dup && !error ? '' : 'is-off'}">
      ${checkCell}${dateCell}${descCell}${amountCell}${kindCell}${catCell}
    </tr>`;
  }
  const paidIn = row.dir === 'in' ? `<td class="imp-amt pos">${esc(money(row.cents, { whole: false }))}</td>` : '<td class="imp-amt"></td>';
  const drawn = row.dir === 'out' ? `<td class="imp-amt neg">−${esc(money(row.cents, { whole: false }))}</td>` : '<td class="imp-amt"></td>';
  const balance = row.balanceCents == null ? '<td class="imp-amt"></td>' : `<td class="imp-amt muted">${esc(money(row.balanceCents, { whole: false }))}</td>`;
  return `<tr data-row="${row.index}" class="${row.include && !row.dup && !error ? '' : 'is-off'}">
    ${checkCell}${dateCell}${descCell}${paidIn}${drawn}${balance}${kindCell}${catCell}
  </tr>`;
}

/* What the paste did not turn into a row is said out loud rather than quietly dropped. */
function importSmsReadNote() {
  const bits = [];
  const origin = imp.smsOrigin;
  if (origin) {
    bits.push(`${origin.rows} rows read from ${esc(origin.file)} became ${origin.lines} confirmation texts${
      origin.folded ? `, with ${origin.folded} ${plural(origin.folded, 'charge')} folded in` : ''
    }`);
    bits.push(origin.lost
      ? `${origin.lost} ${plural(origin.lost, 'text')} did not read back, so that money is not in this list — press Back to post the rows from the file instead`
      : 'Every one of them read back, so this list holds the same money the file does');
  }
  if (imp.smsDropped) bits.push(`${imp.smsDropped} ${plural(imp.smsDropped, 'echo', 'echoes')} of the same receipt skipped so nothing posts twice`);
  if (imp.smsRefused) bits.push(`${imp.smsRefused} ${plural(imp.smsRefused, 'message')} not read — the wording did not settle both the amount and the direction`);
  if (!bits.length) bits.push('Every message in the paste became a row');
  return `<div class="imp-reconcile-note">${bits.join('. ')}. ${imp.statementCents == null ? 'None of the texts printed a balance, so nothing was checked against it.' : 'The newest printed balance is checked against your ledger below.'}</div>`;
}

function importReconcileMarkup() {
  const target = accountById(imp.accountId);
  if (!target) return '';
  const chain = imp.chain;
  const ledgerCents = accountBalance(target.id);
  const diff = imp.statementCents == null ? null : imp.statementCents - ledgerCents;
  const closes = !chain || chain.openingCents + chain.inCents - chain.outCents === chain.closingCents;
  const chainBreaks = !!chain && (chain.breaks > 0 || !closes);
  if (diff == null && !chain) return '';
  const ok = (diff == null || Math.abs(diff) <= 50) && !chainBreaks;
  const stats = [];
  if (diff != null) {
    stats.push(`<div><span class="label">Balance per this statement</span><strong>${esc(money(imp.statementCents, { whole: false }))}</strong></div>`);
    stats.push(`<div><span class="label">Balance in ${esc(target.name)}</span><strong>${esc(money(ledgerCents, { whole: false }))}</strong></div>`);
    stats.push(`<div><span class="label">Difference</span><strong class="${diff < 0 ? 'neg' : diff > 0 ? 'pos' : ''}">${esc(money(Math.abs(diff), { whole: false }))}${diff < 0 ? ' short' : diff > 0 ? ' over' : ''}</strong></div>`);
  }
  if (chain) {
    stats.push(`<div><span class="label">Statement arithmetic</span><strong class="${chainBreaks ? 'neg' : 'pos'}">${chainBreaks
      ? `${chain.breaks} ${plural(chain.breaks, 'row')} ${chain.breaks === 1 ? 'does' : 'do'} not add up`
      : `balances on all ${chain.checked} rows`}</strong></div>`);
  }
  const notes = [];
  if (chainBreaks) {
    notes.push(`Working down from ${esc(money(chain.openingCents, { whole: false }))}, the printed balance stops following the money at ${chain.first.receipt ? `receipt ${esc(chain.first.receipt)} on ${esc(chain.first.date)}` : esc(chain.first.date)} — ${esc(chain.first.description.slice(0, 70))}. Use the “Balance breaks” filter to see them.`);
  }
  if (diff != null) {
    notes.push(Math.abs(diff) <= 50
      ? 'The ledger already matches the statement for this account.'
      : `Posting these rows moves the ledger further from the statement by ${esc(money(Math.abs(diff), { whole: false }))}. Post the rows first, then use “${esc(target.name)} → Adjust balance” to bring it in line. Until that is done, the ${esc(target.name)} figure here is not the money you actually hold.`);
  }
  return `<div class="imp-reconcile ${ok ? 'ok' : 'off'}">${stats.join('')}<div class="imp-reconcile-note">${notes.join(' ')}</div></div>`;
}

function importStepThree() {
  const totals = importTotals();
  const visible = importVisibleRows();
  const pages = Math.max(1, Math.ceil(visible.length / IMPORT_PAGE_SIZE));
  if (imp.page > pages - 1) imp.page = pages - 1;
  const slice = visible.slice(imp.page * IMPORT_PAGE_SIZE, imp.page * IMPORT_PAGE_SIZE + IMPORT_PAGE_SIZE);
  const target = accountById(imp.accountId);
  const statement = !!imp.cols;
  const head = statement
    ? '<th></th><th>Date</th><th>Details</th><th class="imp-amt">Paid In</th><th class="imp-amt">Withdrawn</th><th class="imp-amt">Balance</th><th>Kind</th><th>Category / account</th>'
    : '<th></th><th>Date</th><th>Statement description</th><th class="imp-amt">Amount</th><th>Kind</th><th>Category / account</th>';
  const colspan = statement ? 8 : 6;
  return `${importStepBar()}
    <p class="modal-intro">${esc(target ? target.name : 'the account')} · ${imp.rows.length} rows read${imp.statementFrom ? ` from ${esc(imp.statementFrom)} to ${esc(imp.statementTo)}` : ''}. Money that moves between your own accounts is paired automatically — one side down, the other up. Categories are optional here; anything you leave unmarked lands in Uncategorised and you can set it later on the Transactions page. Nothing is written until you press Post.</p>
    ${imp.error ? `<div class="imp-error"><strong>Post refused</strong>${imp.error}</div>` : ''}
    ${imp.kind === 'sms' ? importSmsReadNote() : ''}
    ${imp.kind === 'sms' ? '' : importTextsBlock()}
    ${importFulizaBlock()}
    <div id="imp-money">${importMovementMarkup()}${importReconcileMarkup()}</div>
    <div class="imp-toolbar">
      <label class="field"><span class="label">Show</span>
        <select class="select" data-imp="filter">
          ${[['all', `All rows (${imp.rows.length})`], ['open', `Missing the other account (${totals.open})`], ['dup', `Already in ledger (${totals.dupes})`], ['excluded', `Excluded (${imp.rows.filter((r) => !r.include).length})`],
            ...(totals.overdraft ? [['overdraft', `Overdraft lines (${totals.overdraft})`]] : []),
            ...(totals.chain ? [['chain', `Balance breaks (${totals.chain})`]] : [])]
            .map(([value, label]) => `<option value="${value}"${impSel(value, imp.filter)}>${esc(label)}</option>`).join('')}
        </select></label>
      <label class="field"><span class="label">Fill empty expense categories with</span>
        <select class="select" data-imp="bulk-expense">${categoryOptionsByType('expense', imp.bulk.expense, 'Choose…')}</select></label>
      <label class="field"><span class="label">Fill empty income categories with</span>
        <select class="select" data-imp="bulk-income">${categoryOptionsByType('income', imp.bulk.income, 'Choose…')}</select></label>
      <button type="button" class="btn btn-secondary btn-sm" data-act="imp-bulk">Fill the blanks shown</button>
    </div>
    <div class="imp-scroll">
      <table class="imp-table${statement ? ' imp-stmt' : ''}">
        <thead><tr>${head}</tr></thead>
        <tbody>${slice.length ? slice.map(importRowMarkup).join('') : `<tr><td colspan="${colspan}" class="imp-empty">Nothing to show in this filter.</td></tr>`}</tbody>
      </table>
    </div>
    ${pages > 1 ? `<div class="imp-pager">
      <button type="button" class="btn btn-quiet btn-xs" data-act="imp-page" data-page="${imp.page - 1}"${imp.page <= 0 ? ' disabled' : ''}>Previous</button>
      <span>Page ${imp.page + 1} of ${pages}</span>
      <button type="button" class="btn btn-quiet btn-xs" data-act="imp-page" data-page="${imp.page + 1}"${imp.page >= pages - 1 ? ' disabled' : ''}>Next</button>
    </div>` : ''}
    <div class="imp-totals" id="imp-summary">${importSummaryMarkup(totals)}</div>`;
}

function importSummaryMarkup(totals) {
  return `<span><strong>${totals.included}</strong> ${plural(totals.included, 'row will', 'rows will')} post</span>
    <span>Money in <strong class="pos">${esc(money(totals.moneyIn))}</strong></span>
    <span>Money out <strong class="neg">${esc(money(totals.moneyOut))}</strong></span>
    ${totals.open ? `<span class="warn">${totals.open} ${plural(totals.open, 'row needs', 'rows need')} a choice</span>` : ''}
    ${totals.dupes ? `<span>${totals.dupes} ${plural(totals.dupes, 'duplicate skipped', 'duplicates skipped')}</span>` : ''}`;
}

function importStepMarkup() {
  if (imp.step === 1) return importStepOne();
  if (imp.step === 2) return importStepTwo();
  return importStepThree();
}

function importFootMarkup() {
  const totals = importTotals();
  if (imp.step === 1) {
    return `<button type="button" class="btn btn-ghost" data-act="close-modal">Cancel</button>
      <button type="button" class="btn btn-primary" data-act="${imp.mode === 'sms' ? 'imp-sms-parse' : 'imp-next'}">${imp.mode === 'sms' ? 'Read the messages' : 'Read columns'}</button>`;
  }
  if (imp.step === 2) {
    return `<button type="button" class="btn btn-ghost" data-act="imp-back">Back</button>
      <button type="button" class="btn btn-primary" data-act="imp-next">Review the money (${imp.rows.length} ${plural(imp.rows.length, 'row')})</button>`;
  }
  if (!totals.included) {
    return `<button type="button" class="btn btn-ghost" data-act="imp-back">Back</button>
      <span class="imp-foot-hint">Nothing ready to post</span>
      <button type="button" class="btn btn-ghost" data-act="imp-commit">Why can't I post?</button>`;
  }
  return `<button type="button" class="btn btn-ghost" data-act="imp-back">Back</button>
    <span class="imp-foot-hint">${totals.included} ${plural(totals.included, 'row')} ready</span>
    <button type="button" class="btn btn-primary" data-act="imp-commit">${icon('check', 14)} Post ${totals.included} ${plural(totals.included, 'entry', 'entries')}</button>`;
}

function impHeadCopy() {
  if (imp.step === 1) return imp.mode === 'sms' ? 'Paste the messages you received and choose the account they belong to.' : 'Pick the statement file and the account it belongs to.';
  if (imp.step === 2) return 'Tell the importer which columns hold the date, the description and the money.';
  return 'Choose a category, or mark the row as a transfer between your own accounts.';
}

function bindImportDrop() {
  const zone = document.getElementById('imp-drop');
  if (!zone) return;
  ['dragover', 'dragenter'].forEach((name) => zone.addEventListener(name, (event) => {
    event.preventDefault();
    zone.classList.add('is-over');
  }));
  ['dragleave', 'drop'].forEach((name) => zone.addEventListener(name, (event) => {
    event.preventDefault();
    zone.classList.remove('is-over');
  }));
  zone.addEventListener('drop', (event) => {
    const file = event.dataTransfer && event.dataTransfer.files && event.dataTransfer.files[0];
    if (file) readImportStatementFile(file);
  });
}

function openImportModal(accountId) {
  if (!state) return;
  if (!state.accounts.filter((acc) => !acc.archived).length) {
    toast('Create an account before importing a statement.', 'error');
    return;
  }
  if (!imp) imp = {};
  imp.accountId = accountId || imp.accountId || '';
  if (!imp.accountId) {
    const first = spendableAccounts()[0] || activeAccounts().find((acc) => accountNature(acc) === 'asset');
    imp.accountId = first ? first.id : state.accounts[0].id;
  }
  if (!imp.step) imp.step = 1;
  openModal({
    title: 'Import a bank or M-Pesa statement',
    subtitle: impHeadCopy(),
    size: 'xl',
    body: importStepMarkup(),
    foot: importFootMarkup(),
    onReady: bindImportDrop
  });
}

function renderImportStep() {
  const layer = document.getElementById('modal-layer');
  if (!layer || !imp) {
    openImportModal(imp ? imp.accountId : '');
    return;
  }
  const body = layer.querySelector('.modal-body');
  const foot = layer.querySelector('.modal-foot');
  const subtitle = layer.querySelector('.modal-head p');
  if (body) body.innerHTML = importStepMarkup();
  if (foot) foot.innerHTML = importFootMarkup();
  if (subtitle) subtitle.textContent = impHeadCopy();
  bindImportDrop();
}

function patchImportRow(index) {
  const layer = document.getElementById('modal-layer');
  if (!layer || !imp) return;
  const row = imp.rows.find((r) => r.index === index);
  const cell = layer.querySelector(`tr[data-row="${index}"]`);
  if (row && cell) cell.outerHTML = importRowMarkup(row);
  const banner = layer.querySelector('.imp-error');
  if (banner && !imp.error) banner.remove();
  else if (banner && imp.error) banner.innerHTML = `<strong>Post refused</strong>${imp.error}`;
  const money = layer.querySelector('#imp-money');
  if (money) money.innerHTML = `${importMovementMarkup()}${importReconcileMarkup()}`;
  const summary = document.getElementById('imp-summary');
  if (summary) summary.innerHTML = importSummaryMarkup(importTotals());
  const foot = layer.querySelector('.modal-foot');
  if (foot) foot.innerHTML = importFootMarkup();
}

function applyImportMap() {
  const root = document.getElementById('modal-layer');
  if (!root || !imp) return;
  const read = (field) => {
    const select = root.querySelector(`select[data-field="${field}"]`);
    if (!select) return null;
    return select.value === '' ? null : Number(select.value);
  };
  imp.map = {
    date: read('date'),
    description: read('description'),
    out: read('out'),
    inc: read('inc'),
    amount: read('amount'),
    sign: read('sign'),
    payee: read('payee')
  };
  if (imp.map.out == null && imp.map.inc == null && imp.map.amount == null) imp.map.amount = null;
  buildImportRows();
}

function handleImportAction(action, target) {
  if (!imp) return false;
  switch (action) {
    case 'imp-pick':
      triggerStatementPicker();
      return true;
    case 'imp-mode': {
      const mode = target.dataset.mode;
      if (imp.mode !== mode) {
        imp.mode = mode;
        imp.error = null;
        imp.smsError = null;
      }
      renderImportStep();
      return true;
    }
    case 'imp-sms-clear':
      imp.smsText = '';
      imp.smsError = null;
      renderImportStep();
      return true;
    case 'imp-sms-parse': {
      const box = document.getElementById('imp-sms');
      const text = box ? box.value : String(imp.smsText || '');
      if (!imp.accountId) { toast('Choose the account the messages belong to first.', 'error'); return true; }
      if (!String(text).trim()) { toast('Paste at least one M-Pesa message first.', 'error'); return true; }
      readImportSmsText(text);
      return true;
    }
    case 'imp-to-text': {
      if (!imp.rows.length) { imp.textError = 'No rows were recognised, so there is nothing to re-word. Map the date and amount columns first.'; renderImportStep(); return true; }
      const texts = statementTexts(imp.rows, imp.accountId);
      const joined = texts.lines.join('\n');
      const preview = parseSmsMessages(joined, { keepEchoes: true });
      if (!preview.messages.length) {
        imp.textError = `None of the ${texts.lines.length} ${plural(texts.lines.length, 'text')} built from this file said both how much moved and which way. Post the rows from the table instead.`;
        renderImportStep();
        return true;
      }
      readImportSmsText(joined, {
        file: imp.fileName,
        rows: imp.rows.length,
        lines: texts.lines.length,
        folded: texts.folded,
        read: preview.messages.length,
        lost: texts.lines.length - preview.messages.length,
        statementCents: imp.statementCents == null ? null : imp.statementCents,
        from: imp.statementFrom || '',
        to: imp.statementTo || ''
      });
      return true;
    }
    case 'imp-fuliza': {
      const account = addOverdraftAccount(imp.rows);
      if (!account) {
        imp.error = 'A liability account already carries the overdraft money, so nothing new was added. Use the “Overdraft lines” filter to see where each row goes.';
        renderImportStep();
        return true;
      }
      buildImportRows();
      renderImportStep();
